<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Un unico posto per gestire i primi minuti dopo un incidente e conservare i dati utili."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/accident-kit/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>AccidentKit — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"><link rel="stylesheet" href="../assets/microapp-pro.css"></head><body data-tool="accident-kit"><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../auto/">← Categoria</a></header><section class="hero"><div class="ey">AUTO</div><h1 id="name">AccidentKit</h1><p id="desc">Un unico posto per gestire i primi minuti dopo un incidente e conservare i dati utili.</p></section><section id="work"></section><footer class="footer"><a href="../">Home</a> · dati elaborati nel browser quando possibile</footer></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/microapp-pro-defs.js"></script><script src="../assets/microapp-pro.js"></script><script>(()=>{const save=document.querySelector('#saveI');if(!save)return;const dateField=document.querySelector('#f_date'),timeField=document.querySelector('#f_time'),plateField=document.querySelector('#f_plate'),now=new Date(),pad=n=>String(n).padStart(2,'0');if(dateField&&!dateField.value)dateField.value=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());if(timeField&&!timeField.value)timeField.value=pad(now.getHours())+':'+pad(now.getMinutes());if(plateField){plateField.setAttribute('autocomplete','off');plateField.setAttribute('autocapitalize','characters');plateField.setAttribute('inputmode','text');plateField.setAttribute('maxlength','8');plateField.addEventListener('input',()=>{const no
