<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5a6048"><meta name="description" content="Scadenze e manutenzioni di casa con ricorrenze semplici."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/home-memo/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>HomeMemo — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"><style>:root{--navy:#5a6048;--green:#d8c99f;--blue:#d8c99f}.row>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg" alt="">HomeMemo</div><a href="../casa/">← Casa</a></header><section class="hero"><div class="ey">CASA</div><h1>HomeMemo</h1><p>Scadenze e manutenzioni di casa con ricorrenze semplici.</p></section>
<div class="grid"><section class="card"><h2>Nuova manutenzione</h2><div class="form"><div class="field"><label>Attività</label><input class="f" id="name" placeholder="Pulire filtro cappa"></div><div class="field"><label>Prossima data</label><input class="f" id="due" type="date"></div><div class="field"><label>Ripeti ogni N mesi (0 = no)</label><input class="f" id="months" type="number" min="0" max="120" value="0"></div><div class="field"><label>Nota</label><input class="f" id="note" placeholder="Filtro carbone…"></div></div><div class="actions"><button class="btn green" onclick="add()">Programma</button></div></section><aside class="card"><h2>Situazione</h2><div class="result"><div class="metric"><span>Attività</span><b id="total">0</b></div><div class="metric"><span>Entro 7 giorni</span><b id="week">0</b></div><div class="metric"><span>In ritardo</span><b id="overdue">0</b></div></div></aside></div><section class="card" style="margin-top:12px"><h2>Calendario casa</h2><div id="list" class="list"></div></section><div class="footer"><a href="../casa/">Casa</a> · dati salvati solo nel browser</div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>
const K='homememo.v1',$=id=>document.getElementById(id);let S=Webinsolito.store.get(K,{items:[]});
function add(){const name=$('name').value.trim(),due=$('due').value,months=Math.max(0,+$('months').value||0),note=$('note').value.trim();if(!name||!due)return Webinsolito.toast('Inserisci attività e data');S.items.push({id:Date.now(),name,due,months,note});Webinsolito.store.set(K,S);$('name').value=$('due').value=$('note').value='';$('months').value=0;render()}
function done(id){const x=S.items.find(v=>v.id===id);if(!x)return;if(x.months>0){x.due=Webinsolito.addMonths(x.due,x.months).toISOString().slice(0,10)}else S.items=S.items.filter(v=>v.id!==id);Webinsolito.store.set(K,S);render()}
function del(id){S.items=S.items.filter(v=>v.id!==id);Webinsolito.store.set(K,S);render()}
function render(){const today=new Date().toISOString().slice(0,10),arr=S.items.slice().sort((a,b)=>a.due.localeCompare(b.due));const overdue=arr.filter(x=>Webinsolito.days(today,x.due)<0).length,week=arr.filter(x=>{const d=Webinsolito.days(today,x.due);return d>=0&&d<=7}).length;$('total').textContent=arr.length;$('overdue').textContent=overdue;$('week').textContent=week;$('list').innerHTML=arr.length?arr.map(x=>{const d=Webinsolito.days(today,x.due),cls=d<0?'bad':d<=7?'warn':'good',txt=d<0?'in ritardo':d===0?'oggi':d===1?'domani':'tra '+d+' giorni';return '<div class="row"><div><b>'+Webinsolito.esc(x.name)+'</b><span>'+Webinsolito.date(x.due)+(x.months?' · ogni '+x.months+' mesi':'')+(x.note?' · '+Webinsolito.esc(x.note):'')+'</span></div><div><span class="status '+cls+'">'+txt+'</span><button class="btn primary" onclick="done('+x.id+')">Fatto</button><button class="btn soft" onclick="del('+x.id+')">X</button></div></div>'}).join(''):'<div class="note">Nessuna manutenzione programmata.</div>'}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
