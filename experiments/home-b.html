<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webinsolito variant-b</title><style>*{box-sizing:border-box}body{margin:0;background:#08111b;color:#f7f9fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:18px 20px 70px}header{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.05em}header img{width:44px;height:44px}.hero h1{letter-spacing:-4px;line-height:.92;margin:0}.search{border:1px solid #304256;background:#101b27;border-radius:18px;color:#8091a5}.search span{margin-left:8px}.tile{text-decoration:none;color:inherit}.tile img{display:block}.tile strong{display:block}.hero{padding:44px 0 28px}.hero h1{font-size:68px}.search{margin-top:20px;max-width:650px;padding:15px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.tile{min-height:190px;border-radius:30px;background:#0e1925;border:1px solid #23364b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}.tile img{width:120px;height:120px}.tile strong{font-size:11px;letter-spacing:.07em}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){main{padding:14px}.hero{padding:32px 0 22px}.hero h1{font-size:50px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.tile{min-height:160px;border-radius:24px}.tile img{width:104px;height:104px}.tile strong{font-size:10px}}</style></head><body class="variant-b"><main><header><img src="../assets/webinsolito-logo.svg"><b>WEBINSOLITO</b></header><section class="hero"><h1>Dimmi cosa devi fare.</h1><div class="search">⌕ <span>Es. devo vendere la macchina…</span></div></section><section id="grid" class="grid"></section></main><script>const slug={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'};fetch('../apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{grid.innerHTML=x.categories.map(c=>'<a class="tile" href="../'+slug[c.id]+'/"><img src="../assets/categories-v2/'+c.id+'.svg" alt=""><strong>'+c.name.split(' & ')[0].toUpperCase()+'</strong></a>').join('')});</script></body></html>
