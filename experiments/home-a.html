<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webinsolito variant-a</title><style>*{box-sizing:border-box}body{margin:0;background:#08111b;color:#f7f9fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:18px 20px 70px}header{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.05em}header img{width:44px;height:44px}.hero h1{letter-spacing:-4px;line-height:.92;margin:0}.search{border:1px solid #304256;background:#101b27;border-radius:18px;color:#8091a5}.search span{margin-left:8px}.tile{text-decoration:none;color:inherit}.tile img{display:block}.tile strong{display:block}.hero{padding:58px 0 34px;max-width:800px}.hero h1{font-size:76px}.search{margin-top:24px;max-width:720px;padding:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tile{height:180px;border:1px solid #293a4e;background:linear-gradient(145deg,#111d2a,#0b141e);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.tile img{width:104px;height:104px}.tile strong{font-size:13px;letter-spacing:.04em}@media(max-width:700px){main{padding:14px}.hero{padding:38px 0 24px}.hero h1{font-size:54px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tile{height:154px;border-radius:22px}.tile img{width:88px;height:88px}.tile strong{font-size:12px}}</style></head><body class="variant-a"><main><header><img src="../assets/webinsolito-logo.svg"><b>WEBINSOLITO</b></header><section class="hero"><h1>Dimmi cosa devi fare.</h1><div class="search">⌕ <span>Es. devo vendere la macchina…</span></div></section><section id="grid" class="grid"></section></main><script>const slug={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'};fetch('../apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{grid.innerHTML=x.categories.map(c=>'<a class="tile" href="../'+slug[c.id]+'/"><img src="../assets/categories-v2/'+c.id+'.svg" alt=""><strong>'+c.name.split(' & ')[0].toUpperCase()+'</strong></a>').join('')});</script></body></html>
