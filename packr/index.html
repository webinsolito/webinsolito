<!doctype html>
<html lang="it" data-app-build="packr-rebuild-v1">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071522"><title>Packr</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071522;color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{width:min(100%,680px);margin:auto;padding:18px 18px max(30px,env(safe-area-inset-bottom))}.head{display:flex;gap:11px;align-items:center;margin:4px 0 25px}.head img{width:42px;height:42px}.head b{font-size:18px}.head span{display:block;color:#7e94a7;font-size:10px;margin-top:3px}.hero h1{font-size:36px;line-height:1.03;letter-spacing:-.055em;margin:0}.hero p{color:#8ca1b2;font-size:13px;line-height:1.5;margin:11px 0 23px}.card{background:#0b1f30;border:1px solid #203c53;border-radius:23px;padding:16px;margin-top:12px}.label{display:block;color:#91a6b6;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}.field{width:100%;min-height:52px;border:1px solid #29465d;border-radius:15px;background:#071924;color:#f7fafc;padding:0 13px;font:700 14px/1.2 inherit;outline:none}.field:focus{border-color:#74aee7;box-shadow:0 0 0 3px #74aee718}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid+.grid{margin-top:10px}.primary{width:100%;min-height:54px;border:0;border-radius:16px;background:#74aee7;color:#071522;font:900 15px/1 inherit;margin-top:14px}.active{display:none}.active.show{display:block}.tripTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tripTitle{font-size:24px;letter-spacing:-.035em;margin:0}.tripMeta{color:#8197a9;font-size:10px;margin-top:5px}.progress{height:8px;border-radius:99px;background:#102d43;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;width:0;background:#74aee7;border-radius:inherit}.progressLine{display:flex;justify-content:space-between;gap:10px;color:#91a7b8;font-size:10px}.sections{display:grid;gap:11px;margin-top:12px}.section{border:1px solid #1f3a50;border-radius:18px;overflow:hidden;background:#091a28}.sectionHead{padding:11px 13px;background:#0e2638;font-size:12px;font-weight:900;display:flex;justify-content:space-between}.items{display:grid}.item{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;padding:11px 13px;border-top:1px solid #173247}.item:first-child{border-top:0}.item input{width:20px;height:20px}.item span{font-size:12px}.item.done span{text-decoration:line-through;color:#698196}.addRow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.addBtn{border:0;border-radius:14px;background:#17364d;color:#d8e5ee;padding:0 15px;font-weight:850}.secondary{border:0;border-radius:12px;background:#152f44;color:#9fb5c6;padding:9px 11px;font-weight:800}.empty{color:#7d94a6;font-size:11px;line-height:1.5}.error{color:#ff9a9a;font-size:11px;margin-top:10px;display:none}.error.show{display:block}@media(max-width:460px){.app{padding:14px}.hero h1{font-size:33px}.grid{grid-template-columns:1fr}.grid+.grid{margin-top:10px}}
</style></head>
<body><main class="app">
<header class="head"><img src="logo.svg" alt=""><div><b>Packr</b><span>La checklist che ti segue davvero</span></div></header>
<section class="hero"><h1>Dimmi dove vai.<br>Ti preparo la valigia.</h1><p>Niente meteo inventato: scegli tu il clima previsto. Packr crea una checklist concreta, la salva sul dispositivo e ricorda cosa hai già spuntato.</p></section>
<section class="card" id="createCard">
<div class="grid"><div><label class="label" for="dest">Destinazione</label><input id="dest" class="field" placeholder="Es. Roma"></div><div><label class="label" for="type">Tipo di viaggio</label><select id="type" class="field"><option value="city">Città</option><option value="sea">Mare</option><option value="mountain">Montagna</option><option value="work">Lavoro</option><option value="road">Road trip</option></select></div></div>
<div class="grid"><div><label class="label" for="start">Partenza</label><input id="start" class="field" type="date"></div><div><label class="label" for="end">Ritorno</label><input id="end" class="field" type="date"></div></div>
<div class="grid"><div><label class="label" for="climate">Clima previsto</label><select id="climate" class="field"><option value="mild">Mite</option><option value="hot">Caldo</option><option value="cold">Freddo</option><option value="rain">Pioggia</option></select></div><div><label class="label" for="bag">Bagaglio</label><select id="bag" class="field"><option value="backpack">Solo zaino</option><option value="cabin">Bagaglio a mano</option><option value="medium">Valigia media</option><option value="large">Valigia grande</option></select></div></div>
<button id="generateBtn" class="primary" type="button">Prepara checklist</button><div id="formError" class="error"></div>
</section>
<section id="activeTrip" class="card active" aria-live="polite"><div class="tripTop"><div><h2 id="tripTitle" class="tripTitle"></h2><div id="tripMeta" class="tripMeta"></div></div><button id="newTripBtn" class="secondary" type="button">Nuovo</button></div><div class="progress"><i id="progressBar"></i></div><div class="progressLine"><span id="progressText">0/0 pronti</span><strong id="progressPct">0%</strong></div><div id="sections" class="sections"></div><div class="addRow"><input id="customItem" class="field" placeholder="Aggiungi qualcosa che ti serve"><button id="addItemBtn" class="addBtn" type="button">Aggiungi</button></div></section>
</main>
<script>
(()=>{
const KEY='packr.rebuild.v1',$=id=>document.getElementById(id);let state=null;
const base={Documenti:['Documento identità','Tessera sanitaria','Carte / contanti'],Tecnologia:['Telefono','Caricatore telefono','Power bank'],Igiene:['Spazzolino','Dentifricio','Deodorante'],Salute:['Farmaci personali','Cerotti']};
const typeItems={city:{Vestiti:['Intimo','Calze','Magliette','Pantaloni','Scarpe comode']},sea:{Mare:['Costume','Telo mare','Crema solare','Ciabatte','Occhiali da sole'],Vestiti:['Intimo','Magliette leggere','Pantaloncini']},mountain:{Montagna:['Scarponi','Calze tecniche','Borraccia','Zaino piccolo'],Vestiti:['Intimo','Maglie tecniche','Pantaloni comodi']},work:{Lavoro:['Laptop','Caricatore laptop','Agenda / penna','Abbigliamento lavoro'],Vestiti:['Intimo','Calze','Cambio completo']},road:{Auto:['Patente','Documenti auto','Cavo ricarica','Acqua'],Vestiti:['Intimo','Calze','Magliette','Pantaloni']}};
const climateItems={hot:['Cappellino','Crema solare'],cold:['Giacca pesante','Maglione','Guanti'],rain:['Ombrello','Giacca impermeabile'],mild:[]};
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function daysBetween(a,b){const x=new Date(a+'T12:00:00'),y=new Date(b+'T12:00:00');return Math.floor((y-x)/86400000)+1}
function packCount(days,bag){const max=bag==='backpack'?3:bag==='cabin'?5:bag==='medium'?8:12;return Math.max(1,Math.min(days,max))}
function buildItems(days,type,climate,bag){const groups=JSON.parse(JSON.stringify(base));Object.entries(typeItems[type]||{}).forEach(([cat,items])=>groups[cat]=(groups[cat]||[]).concat(items));if(climateItems[climate]?.length)groups['Clima']=[...climateItems[climate]];const count=packCount(days,bag);if(groups.Vestiti){groups.Vestiti=groups.Vestiti.map(item=>/Intimo|Calze|Magliette|Maglie tecniche/.test(item)?`${item} × ${count}`:item)}return Object.entries(groups).flatMap(([category,items])=>items.map((name,index)=>({id:`${category}-${index}-${name}`,category,name,done:false})))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.items))state=v}catch{}}
function render(){if(!state){$('activeTrip').classList.remove('show');return}$('activeTrip').classList.add('show');$('tripTitle').textContent=state.dest;$('tripMeta').textContent=`${state.days} giorni · ${state.typeLabel} · ${state.climateLabel}`;const done=state.items.filter(i=>i.done).length,total=state.items.length,pct=total?Math.round(done/total*100):0;$('progressText').textContent=`${done}/${total} pronti`;$('progressPct').textContent=pct+'%';$('progressBar').style.width=pct+'%';const groups={};state.items.forEach(item=>(groups[item.category]||(groups[item.category]=[])).push(item));$('sections').innerHTML=Object.entries(groups).map(([cat,items])=>`<section class="section"><div class="sectionHead"><span>${esc(cat)}</span><span>${items.filter(i=>i.done).length}/${items.length}</span></div><div class="items">${items.map(item=>`<label class="item ${item.done?'done':''}"><input type="checkbox" data-id="${esc(item.id)}" ${item.done?'checked':''}><span>${esc(item.name)}</span></label>`).join('')}</div></section>`).join('');$('sections').querySelectorAll('input[data-id]').forEach(input=>input.addEventListener('change',()=>{const item=state.items.find(i=>i.id===input.dataset.id);if(item){item.done=input.checked;save();render()}}));}
function generate(){const dest=$('dest').value.trim(),start=$('start').value,end=$('end').value;const err=$('formError');err.classList.remove('show');if(!dest||!start||!end){err.textContent='Inserisci destinazione, partenza e ritorno.';err.classList.add('show');return}const days=daysBetween(start,end);if(!Number.isFinite(days)||days<1||days>60){err.textContent='Controlla le date: il viaggio deve durare da 1 a 60 giorni.';err.classList.add('show');return}const type=$('type'),climate=$('climate'),bag=$('bag');state={dest,start,end,days,type:type.value,typeLabel:type.options[type.selectedIndex].text,climate:climate.value,climateLabel:climate.options[climate.selectedIndex].text,bag:bag.value,items:buildItems(days,type.value,climate.value,bag.value),createdAt:new Date().toISOString()};save();render();$('activeTrip').scrollIntoView({behavior:'smooth',block:'start'})}
function addCustom(){if(!state)return;const name=$('customItem').value.trim();if(!name)return;state.items.push({id:'custom-'+Date.now(),category:'Personali',name,done:false});$('customItem').value='';save();render()}
$('generateBtn').addEventListener('click',generate);$('addItemBtn').addEventListener('click',addCustom);$('customItem').addEventListener('keydown',e=>{if(e.key==='Enter')addCustom()});$('newTripBtn').addEventListener('click',()=>{state=null;localStorage.removeItem(KEY);render();$('createCard').scrollIntoView({behavior:'smooth'})});load();render();
})();
</script></body></html>
