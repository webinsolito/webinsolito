<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153149"><link rel="manifest" href="manifest.json"><title>Packr</title><style>:root{--d:#153149;--p:#4F9CF9;--bg:#f4f6f9;--text:#18212d;--muted:#718096;--line:#e2e8f0;--card:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--d) 0 220px,var(--bg) 220px);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#e8eef5}.top a{color:inherit;text-decoration:none}.badge{font-size:11px;border:1px solid #ffffff2b;border-radius:99px;padding:7px 10px}.hero{color:#fff;padding:28px 2px 26px}.hero h1{font-size:40px;letter-spacing:-1.5px;margin:8px 0}.hero p{margin:0;color:#c8d4df;line-height:1.5}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:800;color:#526173}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #0b18270d}.stat{font-size:30px;font-weight:900;letter-spacing:-1px}.small{font-size:12px;color:var(--muted);line-height:1.45}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.f{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fbfcfd;outline:none}.f:focus{border-color:var(--p)}textarea.f{min-height:82px;resize:vertical}.btn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:12px 15px;font-weight:850;cursor:pointer}.btn.ghost{background:#eef2f6;color:#364152}.btn.danger{background:#ffe8e8;color:#a12828}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block}.pill{display:inline-block;font-size:10px;font-weight:850;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#536173}.empty{text-align:center;padding:28px;color:var(--muted)}.notice{background:#fff8db;border:1px solid #f0d67c;border-radius:16px;padding:12px 14px;color:#6b5712;font-size:12px;line-height:1.45;margin-bottom:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3f7;border:1px solid #dce5ec;border-radius:99px;padding:7px 10px;font-size:12px}.progress{height:9px;border-radius:99px;background:#e9eef3;overflow:hidden}.progress>i{display:block;height:100%;background:var(--p)}.thumb{width:76px;height:76px;object-fit:cover;border-radius:14px;background:#edf1f5}.check{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.check.done{text-decoration:line-through;opacity:.58}@media(max-width:720px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hero h1{font-size:34px}.item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><div class="top"><a href="../">← Webinsolito Apps</a><span class="badge">APP V1 · locale</span></div><section class="hero"><div style="font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#4F9CF9">Webinsolito</div><h1>Packr</h1><p><b>Ogni viaggio rende il prossimo più facile.</b><br>Genera checklist per giorni, clima e tipo di viaggio e ricorda le destinazioni già fatte.</p></section>
<nav class="tabs"><button class="tab on" data-tab="0">Viaggio</button><button class="tab" data-tab="1">Checklist</button><button class="tab" data-tab="2">Storico</button></nav>
<section class="panel on" id="p0"><div class="card"><h2>Nuovo viaggio</h2><div class="form"><input class="f" id="dest" placeholder="Destinazione"><input class="f" id="days" type="number" min="1" value="3" placeholder="Giorni"><select class="f" id="type"><option>Città</option><option>Mare</option><option>Montagna</option><option>Lavoro</option><option>Road trip</option></select><select class="f" id="climate"><option>Mite</option><option>Caldo</option><option>Freddo</option><option>Pioggia</option></select><select class="f" id="laundry"><option value="0">Niente lavanderia</option><option value="1">Posso lavare vestiti</option></select><input class="f" id="custom" placeholder="Extra personali, separati da virgola"></div><button class="btn" id="make" style="margin-top:10px">Genera checklist</button></div></section>
<section class="panel" id="p1"><div class="card"><div class="row" style="justify-content:space-between"><div><b id="tripTitle">Nessun viaggio</b><div class="small" id="tripMeta"></div></div><span class="pill" id="progressTxt">0%</span></div><div class="progress" style="margin-top:10px"><i id="bar" style="width:0"></i></div></div><div class="list" id="list"></div></section>
<section class="panel" id="p2"><div class="list" id="history"></div></section></main><script>
const K='packr_v2';let S=JSON.parse(localStorage.getItem(K)||'{"trips":[],"active":null}');const id=()=>Date.now()+Math.random(),save=()=>{localStorage.setItem(K,JSON.stringify(S));render()},esc=s=>(s||'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p'+b.dataset.tab).classList.add('on');render()});
function gen(d,t,c,l){const cap=n=>Math.max(1,Math.min(n,l?4:8)),a=[['Documenti','Documento identità',1],['Documenti','Carte / contanti',1],['Tech','Telefono + caricatore',1],['Igiene','Spazzolino e dentifricio',1],['Igiene','Deodorante',1],['Vestiti','Intimo',cap(d)],['Vestiti','Calze',cap(d)],['Vestiti','Maglie',cap(Math.ceil(d/2))],['Vestiti','Pantaloni / gonne',cap(Math.ceil(d/3))],['Notte','Pigiama',1]];if(c==='Caldo'||t==='Mare')a.push(['Mare','Costume',2],['Mare','Crema solare',1],['Mare','Occhiali da sole',1],['Vestiti','Cappello',1]);if(c==='Freddo'||t==='Montagna')a.push(['Freddo','Giacca pesante',1],['Freddo','Maglione',cap(Math.ceil(d/3))],['Freddo','Guanti / berretto',1]);if(c==='Pioggia')a.push(['Meteo','Ombrello / guscio',1]);if(t==='Lavoro')a.push(['Lavoro','Laptop + caricatore',1],['Lavoro','Abito / outfit lavoro',cap(Math.ceil(d/2))]);if(t==='Road trip')a.push(['Auto','Cavo ricarica auto',1],['Auto','Acqua e snack',1]);return a.map((x,i)=>({id:id()+i,cat:x[0],name:x[1],qty:x[2],done:false}))}
make.onclick=()=>{if(!dest.value.trim()||!days.value)return alert('Inserisci destinazione e giorni');const prev=S.trips.find(x=>x.dest.toLowerCase()===dest.value.trim().toLowerCase());let items=gen(+days.value,type.value,climate.value,laundry.value==='1');const extras=[...new Set(custom.value.split(',').map(x=>x.trim()).filter(Boolean).concat(prev?.extras||[]))];items=items.concat(extras.map((x,i)=>({id:id()+i,cat:'Personali',name:x,qty:1,done:false})));const trip={id:id(),dest:dest.value.trim(),days:+days.value,type:type.value,climate:climate.value,laundry:laundry.value==='1',extras,items,at:new Date().toISOString()};S.trips.unshift(trip);S.active=trip.id;save();document.querySelector('[data-tab="1"]').click()};
function active(){return S.trips.find(x=>x.id==S.active)}function toggle(i){const t=active();const x=t?.items.find(x=>x.id==i);if(x){x.done=!x.done;save()}}function delTrip(i){S.trips=S.trips.filter(x=>x.id!=i);if(S.active==i)S.active=S.trips[0]?.id||null;save()}function openTrip(i){S.active=i;save();document.querySelector('[data-tab="1"]').click()}function repeat(i){const t=S.trips.find(x=>x.id==i);if(!t)return;dest.value=t.dest;days.value=t.days;type.value=t.type;climate.value=t.climate;laundry.value=t.laundry?'1':'0';custom.value=(t.extras||[]).join(', ');document.querySelector('[data-tab="0"]').click()}
function render(){const t=active();if(t){tripTitle.textContent=t.dest;tripMeta.textContent=t.days+' giorni · '+t.type+' · '+t.climate;const done=t.items.filter(x=>x.done).length,pc=t.items.length?Math.round(done/t.items.length*100):0;progressTxt.textContent=pc+'%';bar.style.width=pc+'%';list.innerHTML=t.items.map(x=>'<label class="check '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggle('+x.id+')"><span><b>'+esc(x.name)+'</b><span class="small">'+esc(x.cat)+(x.qty>1?' · x'+x.qty:'')+'</span></span></label>').join('')}else{tripTitle.textContent='Nessun viaggio';tripMeta.textContent='';progressTxt.textContent='0%';bar.style.width='0';list.innerHTML='<div class="empty">Crea il primo viaggio</div>'}history.innerHTML=S.trips.map(t=>'<div class="item"><div><b>'+esc(t.dest)+'</b><span class="small">'+t.days+' giorni · '+esc(t.type)+' · '+new Date(t.at).toLocaleDateString('it-IT')+'</span></div><div class="row"><button class="btn ghost" onclick="openTrip('+t.id+')">Apri</button><button class="btn ghost" onclick="repeat('+t.id+')">Ripeti</button><button class="btn danger" onclick="delTrip('+t.id+')">×</button></div></div>').join('')||'<div class="empty">Nessun viaggio salvato</div>'}render();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
