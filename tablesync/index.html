<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17352A"><link rel="manifest" href="manifest.json"><title>TableSync</title><style>
:root{--d:#17352A;--p:#3B9B73;--bg:#f4f6f9;--text:#18212d;--muted:#718096;--line:#e2e8f0;--card:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--d) 0 220px,var(--bg) 220px);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#e8eef5}.top a{color:inherit;text-decoration:none}.badge{font-size:11px;border:1px solid #ffffff2b;border-radius:99px;padding:7px 10px}.hero{color:#fff;padding:28px 2px 26px}.hero h1{font-size:40px;letter-spacing:-1.5px;margin:8px 0}.hero p{margin:0;color:#c8d4df;line-height:1.5}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:800;color:#526173}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #0b18270d}.stat{font-size:30px;font-weight:900;letter-spacing:-1px}.small{font-size:12px;color:var(--muted);line-height:1.45}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.f{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fbfcfd;outline:none}.f:focus{border-color:var(--p)}textarea.f{min-height:80px;resize:vertical}.btn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:12px 15px;font-weight:850;cursor:pointer}.btn.ghost{background:#eef2f6;color:#364152}.btn.danger{background:#ffe8e8;color:#a12828}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block}.pill{display:inline-block;font-size:10px;font-weight:850;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#536173}.empty{text-align:center;padding:28px;color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.sectionTitle h2{font-size:21px;margin:0}.notice{background:#fff8db;border:1px solid #f0d67c;border-radius:16px;padding:12px 14px;color:#6b5712;font-size:12px;line-height:1.45;margin-bottom:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hero h1{font-size:34px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><div class="top"><a href="../">← Webinsolito Apps</a><span class="badge">APP V1 · locale</span></div><section class="hero"><div style="font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#3B9B73">Webinsolito</div><h1>TableSync</h1><p><b>La sala, senza caos.</b><br>Prenotazioni, coperti, tavoli e stato del servizio organizzati per data.</p></section>
<nav class="tabs"><button class="tab on" data-tab="0">Oggi</button><button class="tab" data-tab="1">Prenotazioni</button><button class="tab" data-tab="2">Tavoli</button></nav>
<section class="panel on" id="p0"><div class="grid"><div class="card"><div class="small">Coperti</div><div class="stat" id="cov">0</div></div><div class="card"><div class="small">Prenotazioni</div><div class="stat" id="cnt">0</div></div><div class="card"><div class="small">In attesa</div><div class="stat" id="wait">0</div></div></div><div class="card" style="margin-top:12px"><div class="sectionTitle"><h2>Servizio del giorno</h2><input class="f" id="day" type="date" style="width:auto"></div><div id="today"></div></div></section>
<section class="panel" id="p1"><div class="card"><h2>Nuova prenotazione</h2><div class="form"><input class="f" id="rName" placeholder="Nome"><input class="f" id="rPhone" placeholder="Telefono"><input class="f" id="rDate" type="date"><input class="f" id="rTime" type="time"><input class="f" id="rParty" type="number" min="1" placeholder="Persone"><select class="f" id="rTable"></select><input class="f" id="rNote" placeholder="Allergie / note"><select class="f" id="rStatus"><option>Confermata</option><option>In attesa</option><option>Arrivata</option><option>Completata</option><option>No-show</option></select></div><button class="btn" id="addR" style="margin-top:10px">Salva prenotazione</button></div><div class="list" id="reservations"></div></section>
<section class="panel" id="p2"><div class="card"><h2>Aggiungi tavolo</h2><div class="form"><input class="f" id="tName" placeholder="Es. T1"><input class="f" id="tSeats" type="number" min="1" placeholder="Posti"></div><button class="btn" id="addT" style="margin-top:10px">Aggiungi tavolo</button></div><div class="list" id="tables"></div></section></main><script>
const K='tablesync_v2';let S=JSON.parse(localStorage.getItem(K)||'{"tables":[],"res":[]}');const id=()=>Date.now()+Math.random(),save=()=>{localStorage.setItem(K,JSON.stringify(S));render()},esc=s=>(s||'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
day.value=new Date().toISOString().slice(0,10);rDate.value=day.value;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p'+b.dataset.tab).classList.add('on')});day.onchange=render;
addT.onclick=()=>{if(!tName.value.trim()||!tSeats.value)return alert('Inserisci nome e posti');S.tables.push({id:id(),name:tName.value.trim(),seats:+tSeats.value});tName.value=tSeats.value='';save()};
addR.onclick=()=>{if(!rName.value.trim()||!rDate.value||!rTime.value||!rParty.value)return alert('Completa nome, data, ora e persone');S.res.push({id:id(),name:rName.value.trim(),phone:rPhone.value.trim(),date:rDate.value,time:rTime.value,party:+rParty.value,table:+rTable.value||null,note:rNote.value.trim(),status:rStatus.value});[rName,rPhone,rTime,rParty,rNote].forEach(x=>x.value='');save()};
function rem(type,i){S[type]=S[type].filter(x=>x.id!=i);save()}function st(i,v){const r=S.res.find(x=>x.id==i);if(r){r.status=v;save()}}
function render(){const opts='<option value="">Nessun tavolo</option>'+S.tables.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' · '+t.seats+' posti</option>').join('');const old=rTable.value;rTable.innerHTML=opts;rTable.value=old;
 tables.innerHTML=S.tables.map(t=>'<div class="item"><div><b>'+esc(t.name)+'</b><span class="small">'+t.seats+' posti</span></div><button class="btn danger" onclick="rem(\'tables\','+t.id+')">×</button></div>').join('')||'<div class="empty">Nessun tavolo configurato</div>';
 reservations.innerHTML=S.res.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(r=>'<div class="item"><div><b>'+esc(r.name)+' · '+r.party+' persone</b><span class="small">'+r.date+' '+r.time+' · '+esc(S.tables.find(t=>t.id==r.table)?.name||'senza tavolo')+' · '+esc(r.note)+'</span></div><div class="row"><select class="f" style="width:auto" onchange="st('+r.id+',this.value)">'+['Confermata','In attesa','Arrivata','Completata','No-show'].map(s=>'<option'+(r.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn danger" onclick="rem(\'res\','+r.id+')">×</button></div></div>').join('')||'<div class="empty">Nessuna prenotazione</div>';
 const d=S.res.filter(r=>r.date===day.value).sort((a,b)=>a.time.localeCompare(b.time));cov.textContent=d.reduce((a,b)=>a+b.party,0);cnt.textContent=d.length;wait.textContent=d.filter(r=>r.status==='In attesa').length;today.innerHTML=d.map(r=>'<div class="item"><div><b>'+r.time+' · '+esc(r.name)+'</b><span class="small">'+r.party+' persone · '+esc(S.tables.find(t=>t.id==r.table)?.name||'senza tavolo')+'</span></div><span class="pill">'+esc(r.status)+'</span></div>').join('')||'<div class="empty">Nessuna prenotazione per questa data</div>';
}render();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
