<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Scatta o scegli una foto, ruotala o trasformala in bianco e nero e scarica una copia pulita."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/scan-pocket/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>ScanPocket — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../documenti/">← Categoria</a></header><section class="hero"><h1>ScanPocket</h1><p>Scatta o scegli una foto, ruotala o trasformala in bianco e nero e scarica una copia pulita.</p></section>
<section class="card"><div class="field"><label>Foto / documento</label><input class="f" id="file" type="file" accept="image/*" capture="environment"></div><div class="actions"><button class="btn" id="rotate">Ruota 90°</button><label class="btn"><input id="gray" type="checkbox"> Bianco e nero</label><button class="btn primary" id="download">Scarica JPG</button></div><canvas id="canvas" style="max-width:100%;margin-top:16px;background:#fff;border-radius:12px"></canvas><div id="status" class="muted"></div></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>
let img=null,angle=0;const ctx=canvas.getContext('2d');function draw(){if(!img)return;const swap=angle%180!==0;canvas.width=swap?img.naturalHeight:img.naturalWidth;canvas.height=swap?img.naturalWidth:img.naturalHeight;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(angle*Math.PI/180);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);ctx.restore();if(gray.checked){const d=ctx.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<d.data.length;i+=4){const y=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];d.data[i]=d.data[i+1]=d.data[i+2]=y}ctx.putImageData(d,0,0)}}file.onchange=()=>{const f=file.files[0];if(!f)return;img=new Image();img.onload=()=>{angle=0;draw();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};rotate.onclick=()=>{angle=(angle+90)%360;draw()};gray.onchange=draw;download.onclick=()=>{if(!img)return;const a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg',.92);a.download='scansione.jpg';a.click()}
</script></body></html>
