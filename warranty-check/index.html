<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Calcola la data di fine garanzia partendo da data d'acquisto e durata dichiarata."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/warranty-check/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>WarrantyCheck — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../shopping/">← Categoria</a></header><section class="hero"><h1>WarrantyCheck</h1><p>Calcola la data di fine garanzia partendo da data d'acquisto e durata dichiarata.</p></section>
<section class="card"><div class="field"><label>Data acquisto</label><input class="f" id="date" type="date"></div><div class="field"><label>Durata garanzia (mesi)</label><input class="f" id="months" type="number" min="1" max="240" value="24"></div><button class="btn primary" id="go">Calcola</button><div id="out" class="result"></div><p class="muted">Il risultato usa i dati inseriti: condizioni, sospensioni o estensioni contrattuali possono cambiare la scadenza effettiva.</p></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>go.onclick=()=>{if(!date.value){out.textContent='Inserisci la data di acquisto.';return}const d=new Date(date.value+'T12:00:00');d.setMonth(d.getMonth()+(+months.value||0));const days=Math.ceil((d-new Date())/864e5);out.textContent='Fine garanzia indicativa: '+d.toLocaleDateString('it-IT')+' · '+(days>=0?days+' giorni rimanenti':'scaduta da '+Math.abs(days)+' giorni')}</script></body></html>
