<!doctype html>
<html lang="it" data-app-build="bresciago-rebuild-v1">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071724"><title>BresciaGo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071724;color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{width:min(100%,720px);margin:auto;padding:18px 18px max(30px,env(safe-area-inset-bottom))}.head{display:flex;gap:11px;align-items:center;margin:4px 0 25px}.head img{width:42px;height:42px}.head b{font-size:18px}.head span{display:block;color:#8197aa;font-size:10px;margin-top:3px}.hero h1{font-size:36px;line-height:1.03;letter-spacing:-.055em;margin:0}.hero p{color:#8da2b4;font-size:13px;line-height:1.5;margin:11px 0 18px}.freshness{padding:10px 12px;border:1px solid #23455d;border-radius:14px;background:#0b2232;color:#9eb4c5;font-size:10px;line-height:1.45}.freshness.stale{border-color:#5e4b28;background:#2b2415;color:#dfc582}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{width:100%;min-height:48px;border:1px solid #2a4b61;border-radius:14px;background:#081c2a;color:#f7fafc;padding:0 12px;font:750 13px/1.2 inherit;outline:none}.field:focus{border-color:#79bceb}.search{grid-column:1/-1}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 2px 8px;color:#7991a4;font-size:10px}.events{display:grid;gap:9px}.event{display:block;text-decoration:none;color:inherit;background:#0b202f;border:1px solid #204057;border-radius:19px;padding:14px}.event:active{transform:scale(.995)}.date{color:#80c8f2;font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.event h2{font-size:15px;line-height:1.25;margin:6px 0}.place{color:#9aafbe;font-size:10px;line-height:1.4}.note{color:#7f96a8;font-size:10px;line-height:1.45;margin-top:7px}.source{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:#647f94;font-size:8.5px}.empty{padding:18px;border:1px dashed #2a4b60;border-radius:17px;color:#8097a9;font-size:11px;line-height:1.5}.error{padding:14px;border:1px solid #643a3d;border-radius:16px;background:#2c1a1d;color:#e7a0a4;font-size:11px;line-height:1.5}@media(max-width:440px){.app{padding:14px}.hero h1{font-size:33px}.filters{grid-template-columns:1fr}.search{grid-column:auto}}
</style></head>
<body><main class="app"><header class="head"><img src="logo.svg" alt=""><div><b>BresciaGo</b><span>Eventi con fonte verificabile</span></div></header>
<section class="hero"><h1>Cosa c'è da fare<br>a Brescia?</h1><p>Eventi raccolti da fonti pubbliche. BresciaGo mostra sempre quando il dataset è stato generato e ti manda alla fonte originale per verificare orari, disponibilità e prenotazioni.</p></section>
<div id="freshness" class="freshness">Caricamento dati…</div><section class="filters"><select id="mode" class="field"><option value="today">In corso oggi</option><option value="week">Oggi + 7 giorni</option><option value="all">Tutti i prossimi</option></select><select id="category" class="field"><option value="">Tutte le categorie</option></select><input id="search" class="field search" placeholder="Cerca evento o luogo"></section><div class="meta"><span id="count">0 eventi</span><span id="sourceMeta"></span></div><section id="events" class="events"><div class="empty">Caricamento…</div></section></main>
<script>
(()=>{const $=id=>document.getElementById(id);let DATA=null;function dateOnly(d){const x=new Date(d);x.setHours(0,0,0,0);return x}function isoToday(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function parseDay(s,fallback){if(!s)return fallback;const d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?fallback:d}function formatRange(e){const start=parseDay(e.date,null),end=parseDay(e.end_date,start);if(!start)return'Data da verificare';const a=start.toLocaleDateString('it-IT',{day:'numeric',month:'short'});if(!end||end.toDateString()===start.toDateString())return e.time?`${a} · ${e.time}`:a;return`${a} → ${end.toLocaleDateString('it-IT',{day:'numeric',month:'short'})}`+(e.time?` · ${e.time}`:'')}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function overlaps(e,from,to){const s=parseDay(e.date,new Date(0)),end=parseDay(e.end_date,s);return s<=to&&end>=from}function render(){if(!DATA)return;const today=parseDay(isoToday(),new Date()),mode=$('mode').value;let to=new Date(today);if(mode==='week')to.setDate(to.getDate()+7);else if(mode==='all')to=new Date('2100-01-01T12:00:00');const q=$('search').value.trim().toLowerCase(),cat=$('category').value;let list=DATA.events.filter(e=>overlaps(e,today,to));if(cat)list=list.filter(e=>e.cat===cat);if(q)list=list.filter(e=>`${e.title||''} ${e.place||''} ${e.note||''}`.toLowerCase().includes(q));list.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.title||'').localeCompare(String(b.title||''),'it'));$('count').textContent=`${list.length} event${list.length===1?'o':'i'}`;$('events').innerHTML=list.length?list.slice(0,80).map(e=>`<a class="event" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer"><div class="date">${esc(formatRange(e))} · ${esc(e.cat||'Evento')}</div><h2>${esc(e.title)}</h2><div class="place">${esc(e.place||e.area||'Brescia e provincia')}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}<div class="source"><span>Fonte: ${esc(e.source||'fonte pubblica')}</span><span>Apri fonte ↗</span></div></a>`).join(''):'<div class="empty">Nessun evento nel filtro scelto. Prova “Tutti i prossimi” o cambia ricerca.</div>'}async function load(){try{const r=await fetch(`data/events.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.events))throw new Error('dataset non valido');DATA=data;const generated=new Date(data.generated_at),ageDays=Math.max(0,Math.floor((Date.now()-generated.getTime())/86400000));$('freshness').textContent=`Dataset generato ${generated.toLocaleDateString('it-IT')} · ${data.count||data.events.length} eventi · verifica sempre sulla fonte originale.`;$('freshness').classList.toggle('stale',ageDays>7);if(ageDays>7)$('freshness').textContent+=` Attenzione: dati di ${ageDays} giorni fa.`;$('sourceMeta').textContent=(data.sources||[]).filter(s=>s.ok).map(s=>s.name).join(' + ');const cats=[...new Set(data.events.map(e=>e.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));$('category').innerHTML='<option value="">Tutte le categorie</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');render()}catch(err){$('freshness').classList.add('stale');$('freshness').textContent='Dataset non disponibile.';$('events').innerHTML='<div class="error">Non riesco a caricare gli eventi. Riprova più tardi; non mostro eventi inventati.</div>'}}$('mode').addEventListener('change',render);$('category').addEventListener('change',render);$('search').addEventListener('input',render);load();})();
</script></body></html>
