<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2036"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>BresciaGo</title><style>
:root{--navy:#0d2036;--pink:#ff3f8f;--bg:#f4f6f8;--ink:#162334;--muted:#708095;--line:#dfe5eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:1180px;margin:auto;padding:14px 14px 96px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:9px;align-items:center;font-weight:950;font-size:20px}.brand img{width:44px}.top a{color:#758398;text-decoration:none;font-size:11px}.hero{margin-top:14px;min-height:230px;border-radius:30px;padding:28px;background:linear-gradient(135deg,#0d2036,#244f79);color:#fff;display:flex;align-items:end;box-shadow:0 18px 45px #142b451b}.hero h1{font-size:48px;line-height:.93;letter-spacing:-2.5px;margin:4px 0 7px}.hero .today{font-weight:900;font-size:19px}.hero .sub{font-size:12px;color:#d7e4ef}.status{display:inline-flex;margin-top:10px;padding:6px 9px;border-radius:99px;background:#ffffff13;border:1px solid #ffffff20;font-size:9px;color:#d7e7f5}.modes,.cats{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.modes{padding:14px 0 8px}.cats{padding:7px 0 14px}.pill,.cat{cursor:pointer;white-space:nowrap}.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:10px 14px;font-weight:850;color:#66768a}.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}.cat{border:0;background:#eef2f5;border-radius:16px;padding:9px 11px;font-size:11px;font-weight:850;color:#57687c}.cat.on{background:#ffedf5;color:#a82762;box-shadow:inset 0 0 0 1px #ffc2dc}.tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:3px 0 12px}.tools h2{margin:0;font-size:22px}.search{width:260px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.event{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.pic{height:155px;background:linear-gradient(135deg,#d8e7f6,#f5ddba);background-size:cover;background-position:center;position:relative}.when{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:12px;padding:7px 9px;box-shadow:0 8px 18px #0002;font-size:10px;font-weight:900}.kind{position:absolute;right:10px;top:10px;background:#111b31d8;color:#fff;border-radius:99px;padding:6px 8px;font-size:9px;font-weight:900}.body{padding:13px;display:flex;flex-direction:column;flex:1}.body h3{font-size:18px;line-height:1.1;margin:0 0 7px}.meta{font-size:10px;color:var(--muted);line-height:1.45}.desc{font-size:11px;line-height:1.45;color:#4e5d70;margin:9px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:auto}.btn{border:0;border-radius:11px;padding:9px 11px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.pick{background:var(--pink);color:#fff}.btn.soft{background:#eef2f5;color:#5c6c7f}.btn.unpick{background:#dff6ea;color:#24684f}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:20px;padding:28px;text-align:center;color:var(--muted)}.plan{display:block;margin-top:14px}.plan.on{display:block}.planCard{background:var(--navy);color:#fff;border-radius:24px;padding:18px}.planList{display:grid;gap:8px;margin-top:12px}.picked{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.picked b{display:block}.picked span{font-size:9px;color:#b7c9d8}.source{font-size:9px;color:#7c8a9a;margin-top:5px}.mobileNav{display:none}@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.plan{display:none}.plan.on{display:block}.app{padding:10px 10px 88px}.top a{display:none}.hero{min-height:220px;padding:20px;border-radius:24px}.hero h1{font-size:40px}.grid{grid-template-columns:1fr}.tools{align-items:flex-start;flex-direction:column}.search{width:100%}.pic{height:180px}.mobileNav{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;background:#0d2036ee;backdrop-filter:blur(14px);border-radius:17px;padding:7px;justify-content:space-around}.mobileNav button{border:0;background:transparent;color:#9fb2c5;font-size:10px;font-weight:900;padding:10px 14px;border-radius:11px}.mobileNav button.on{background:#274560;color:#fff}}
</style></head><body><main class="app"><header class="top"><div class="brand"><img src="logo.svg">BresciaGo</div><a href="../">← Webinsolito Apps</a></header><section class="hero"><div><div style="font-size:10px;font-weight:950;letter-spacing:.13em;color:#ffd044">BRESCIA & PROVINCIA</div><h1>Cosa fare oggi</h1><div class="today" id="todayLabel"></div><div class="sub">Eventi, sagre, musica, cibo, cultura e cose da fare davvero.</div><div class="status" id="feedStatus">● Aggiornamento eventi…</div></div></section><div class="modes" id="modes"></div><div class="cats" id="cats"></div><section id="discover"><div class="tools"><h2 id="sectionTitle">Oggi</h2><input id="search" class="search" placeholder="Cerca solo se ti serve" oninput="render()"></div><div class="grid" id="grid"></div></section><section id="plan" class="plan"><div class="planCard"><div style="display:flex;justify-content:space-between;align-items:end"><div><div style="font-size:9px;font-weight:900;letter-spacing:.1em;color:#ffd044">LA MIA USCITA</div><h2 style="margin:2px 0">Hai scelto questi eventi</h2></div><button class="btn soft" onclick="clearPlan()">Svuota</button></div><div id="planList" class="planList"></div></div></section></main><nav class="mobileNav"><button id="nDiscover" class="on" onclick="showTab('discover')">Scopri</button><button id="nPlan" onclick="showTab('plan')">Scelti <span id="pickedCount"></span></button></nav><script>
const KEY='bresciago.v4',MODES=['Oggi','Stasera','Weekend'],CATS=[['Tutto','✨'],['Musica','♫'],['Cibo','🍴'],['Cultura','🎭'],['Mercatini','🏛'],['Famiglia','👨‍👩‍👧'],['Sport','👟'],['Altro','＋']];
let feed=[],meta={},state=load(),mode='Oggi',cat='Tutto';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)return x;const old=JSON.parse(localStorage.getItem('bresciago.v3')||'null');if(old)return{picked:(old.itinerary||[]).map(String)}}catch{}return{picked:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return(s??'').toString().replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]})}
function todayISO(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){return new Date(d+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}
function weekend(){const n=new Date(),day=n.getDay(),sat=new Date(n);sat.setDate(n.getDate()+((6-day+7)%7));const sun=new Date(sat);sun.setDate(sat.getDate()+1);return[sat.toISOString().slice(0,10),sun.toISOString().slice(0,10)]}
function matchMode(e){const t=todayISO();if(mode==='Oggi')return e.date<=t&&(e.end_date||e.date)>=t;if(mode==='Stasera')return e.date<=t&&(e.end_date||e.date)>=t&&(!e.time||+e.time.slice(0,2)>=17);const w=weekend();return e.date<=w[1]&&(e.end_date||e.date)>=w[0]}
function price(e){return e.price===0?'Gratis':Number.isFinite(e.price)&&e.price>0?'€'+Number(e.price).toFixed(0):''}
function when(e){let x=fmtDate(e.date);if(e.end_date&&e.end_date!==e.date)x+=' → '+fmtDate(e.end_date);if(e.time)x+=' · '+e.time;return x}
function picked(id){return state.picked.includes(String(id))}
function choose(id){id=String(id);state.picked=picked(id)?state.picked.filter(function(x){return x!==id}):state.picked.concat([id]);save();render();renderPlan()}
function card(e){const bg=e.image?'background-image:linear-gradient(180deg,transparent,#0002),url('+JSON.stringify(e.image)+')':'';return '<article class="event"><div class="pic" style="'+bg+'"><span class="kind">'+esc(e.cat||'Evento')+'</span><span class="when">'+esc(when(e))+'</span></div><div class="body"><h3>'+esc(e.title)+'</h3><div class="meta">📍 '+esc(e.place||e.area||'Brescia e provincia')+(price(e)?' · '+esc(price(e)):'')+'</div>'+(e.note?'<div class="desc">'+esc(e.note)+'</div>':'')+'<div class="row"><button class="btn '+(picked(e.id)?'unpick':'pick')+'" onclick="choose(\''+esc(e.id)+'\')">'+(picked(e.id)?'✓ Scelto':'Scegli evento')+'</button>'+(e.url?'<a class="btn soft" target="_blank" rel="noopener" href="'+esc(e.url)+'">Dettagli</a>':'')+'</div><div class="source">'+esc(e.source||'Fonte pubblica')+'</div></div></article>'}
function filtered(){const q=(search.value||'').trim().toLowerCase();return feed.filter(function(e){return matchMode(e)&&(cat==='Tutto'||e.cat===cat)&&(!q||((e.title||'')+' '+(e.place||'')+' '+(e.note||'')).toLowerCase().includes(q))}).sort(function(a,b){return(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))})}
function render(){document.querySelectorAll('#modes .pill').forEach(function(x){x.classList.toggle('on',x.dataset.mode===mode)});document.querySelectorAll('#cats .cat').forEach(function(x){x.classList.toggle('on',x.dataset.cat===cat)});sectionTitle.textContent=mode+(cat!=='Tutto'?' · '+cat:'');const a=filtered();grid.innerHTML=a.length?a.map(card).join(''):'<div class="empty">Nessun evento trovato per questa scelta. Prova un’altra categoria.</div>';pickedCount.textContent=state.picked.length?'('+state.picked.length+')':''}
function renderPlan(){const map=new Map(feed.map(function(e){return[String(e.id),e]})),a=state.picked.map(function(id){return map.get(String(id))}).filter(Boolean).sort(function(x,y){return(x.date+(x.time||'')).localeCompare(y.date+(y.time||''))});planList.innerHTML=a.length?a.map(function(e){return'<div class="picked"><div><b>'+esc(e.title)+'</b><span>'+esc(when(e))+' · '+esc(e.place||e.area||'')+'</span></div><button class="btn soft" onclick="choose(\''+esc(e.id)+'\')">Togli</button></div>'}).join(''):'<div style="color:#aebfd0;font-size:12px">Tocca “Scegli evento” su ciò che ti interessa. Qui rimane solo la tua selezione.</div>';pickedCount.textContent=state.picked.length?'('+state.picked.length+')':''}
function showTab(t){discover.style.display=t==='discover'?'block':'none';plan.classList.toggle('on',t==='plan');nDiscover.classList.toggle('on',t==='discover');nPlan.classList.toggle('on',t==='plan');if(t==='plan')renderPlan()}
function clearPlan(){if(confirm('Svuotare gli eventi scelti?')){state.picked=[];save();render();renderPlan()}}
async function loadFeed(){try{const r=await fetch('./data/events.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);meta=await r.json();feed=Array.isArray(meta.events)?meta.events:[];const d=meta.generated_at?new Date(meta.generated_at):null;feedStatus.textContent='● '+feed.length+' eventi · '+(d?'aggiornato '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'feed automatico');render();renderPlan()}catch(e){feedStatus.textContent='● Feed non disponibile · riprova tra poco';grid.innerHTML='<div class="empty">Non riesco a caricare gli eventi adesso.</div>'}}
todayLabel.textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});modes.innerHTML=MODES.map(function(m){return'<button class="pill '+(m===mode?'on':'')+'" data-mode="'+m+'" onclick="mode=\''+m+'\';render()">'+m+'</button>'}).join('');cats.innerHTML=CATS.map(function(x){return'<button class="cat '+(x[0]===cat?'on':'')+'" data-cat="'+x[0]+'" onclick="cat=\''+x[0]+'\';render()">'+x[1]+' '+x[0]+'</button>'}).join('');loadFeed();if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(function(){})}
</script></body></html>
