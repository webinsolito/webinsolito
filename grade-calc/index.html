<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3f3b78"><meta name="description" content="Calcola media pesata e voto necessario per raggiungere un obiettivo."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/grade-calc/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>GradeCalc — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"><style>:root{--navy:#3f3b78;--green:#9d95ff;--blue:#9d95ff}.row>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg" alt="">GradeCalc</div><a href="../studio/">← Studio & produttività</a></header><section class="hero"><div class="ey">STUDIO & PRODUTTIVITÀ</div><h1>GradeCalc</h1><p>Calcola media pesata e voto necessario per raggiungere un obiettivo.</p></section>
<div class="grid"><section class="card"><h2>Aggiungi voto</h2><div class="form"><div class="field"><label>Voto</label><input class="f" id="grade" type="number" step=".01"></div><div class="field"><label>Peso</label><input class="f" id="weight" type="number" min=".01" step=".01" placeholder="es. 20"></div></div><div class="actions"><button class="btn green" onclick="add()">Aggiungi</button></div><div id="list" class="list" style="margin-top:10px"></div></section><aside class="card"><h2>Media e obiettivo</h2><div class="result"><div class="metric"><span>Media pesata</span><b id="avg">—</b></div><div class="metric"><span>Peso usato</span><b id="weights">0</b></div></div><div class="form" style="margin-top:10px"><div class="field"><label>Media obiettivo</label><input class="f" id="target" type="number" step=".01" value="70"></div><div class="field"><label>Peso rimanente</label><input class="f" id="remaining" type="number" min="0" step=".01" value="20"></div></div><div class="metric" style="margin-top:8px"><span>Voto necessario</span><b id="required">—</b></div><div class="note" id="message">Inserisci i voti ottenuti.</div></aside></div><div class="footer"><a href="../studio/">Studio & produttività</a> · dati salvati solo nel browser</div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>
const $=id=>document.getElementById(id);let rows=[];
function add(){const grade=+$('grade').value,weight=+$('weight').value;if(!Number.isFinite(grade)||!Number.isFinite(weight)||weight<=0)return Webinsolito.toast('Inserisci voto e peso');rows.push({id:Date.now(),grade,weight});$('grade').value=$('weight').value='';render()}
function del(id){rows=rows.filter(x=>x.id!==id);render()}
function calcRequired(avg,w,target,remaining){if(remaining<=0)return null;return (target*(w+remaining)-avg*w)/remaining}
function render(){const w=rows.reduce((t,x)=>t+x.weight,0),sum=rows.reduce((t,x)=>t+x.grade*x.weight,0),avg=w?sum/w:0,target=+$('target').value||0,remaining=Math.max(0,+$('remaining').value||0),req=calcRequired(avg,w,target,remaining);$('avg').textContent=w?avg.toFixed(2):'—';$('weights').textContent=w.toFixed(1);$('required').textContent=req===null?'—':req.toFixed(2);$('message').textContent=req===null?'Inserisci il peso rimanente.':req<0?'Obiettivo già raggiunto con questi pesi.':req>100?'Con scala 0–100, l’obiettivo non è raggiungibile con il peso rimanente.':'Serve circa '+req.toFixed(2)+' nel restante '+remaining+'%.';$('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><div><b>Voto '+x.grade+'</b><span>Peso '+x.weight+'</span></div><button class="btn soft" onclick="del('+x.id+')">Togli</button></div>').join(''):'<div class="note">Aggiungi i voti già ottenuti.</div>'}
$('target').oninput=$('remaining').oninput=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
