<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Genera QR code da testo o link direttamente nel browser, senza inviare il contenuto a server esterni."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/qrpocket/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>QRPocket — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../documenti/">← Categoria</a></header><section class="hero"><h1>QRPocket</h1><p>Genera QR code da testo o link direttamente nel browser, senza inviare il contenuto a server esterni.</p></section>
<section class="card"><div class="field"><label>Testo o link</label><textarea class="f" id="text" rows="5"></textarea></div><div class="actions"><button class="btn primary" id="go">Genera QR</button><button class="btn" id="download">Scarica PNG</button></div><div id="err" class="muted"></div><div id="qr" style="max-width:300px;margin:20px auto;background:#fff;padding:14px;border-radius:14px"></div></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/vendor/qrcode.min.js"></script><script>
let q=null;go.onclick=()=>{err.textContent='';qr.innerHTML='';const t=text.value.trim();if(!t){err.textContent='Inserisci un testo o un link.';return}try{q=new QRCode(qr,{text:t,width:256,height:256,correctLevel:QRCode.CorrectLevel.M})}catch(e){err.textContent='Contenuto troppo lungo per questo QR.'}}
download.onclick=()=>{const c=qr.querySelector('canvas'),i=qr.querySelector('img');const u=c?.toDataURL('image/png')||i?.src;if(!u)return;const a=document.createElement('a');a.href=u;a.download='qrcode.png';a.click()}
</script></body></html>
