<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Tieni un elenco degli abbonamenti e vedi il loro costo mensile e annuale."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/subscriptions/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>Subscriptions — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg">Subscriptions</div><a href="../soldi/">← Soldi & risparmio</a></header><section class="hero"><div class="ey">SOLDI & RISPARMIO</div><h1>Quanto spendi in abbonamenti?</h1><p>Salva servizi ricorrenti e trasformali in un costo mensile e annuale comparabile.</p></section><div class="grid"><section class="card"><h2>Nuovo abbonamento</h2><div class="form"><div class="field"><label>Nome</label><input class="f" id="subName" placeholder="Es. Streaming"></div><div class="field"><label>Costo €</label><input class="f" id="amount" type="number" min="0" max="100000" step=".01"></div><div class="field"><label>Frequenza</label><select class="f" id="freq"><option value="monthly">Mensile</option><option value="yearly">Annuale</option><option value="weekly">Settimanale</option><option value="quarterly">Ogni 3 mesi</option></select></div><div class="field"><label>Prossimo rinnovo</label><input class="f" id="renewal" type="date"></div></div><div class="actions"><button class="btn green" onclick="addSub()">Aggiungi</button><button class="btn soft" onclick="resetForm()">Pulisci</button></div><div id="error" class="note warn" hidden></div></section><aside class="card"><h2>Totali</h2><div class="result"><div class="metric"><span>Al mese</span><b id="monthly">—</b></div><div class="metric"><span>All'anno</span><b id="yearly">—</b></div><div class="metric"><span>Abbonamenti</span><b id="count">0</b></div></div><div id="list" class="list" style="margin-top:10px"></div><div class="actions"><button class="btn soft" onclick="exportData()">Esporta copia</button></div></aside></div><div class="footer"><a href="../soldi/">Soldi & risparmio</a></div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>const KEY='subscriptions.v1';let S=Webinsolito.store.get(KEY,{items:[]});function norm(x){const a=+x.amount||0;return x.freq==='yearly'?a/12:x.freq==='weekly'?a*52/12:x.freq==='quarterly'?a/3:a}function addSub(){error.hidden=true;const n=subName.value.trim(),a=+amount.value;if(!n||!(a>0)){error.textContent='Inserisci nome e costo maggiore di zero.';error.hidden=false;return}S.items.push({id:Date.now(),name:n,amount:a,freq:freq.value,renewal:renewal.value});Webinsolito.store.set(KEY,S);resetForm();render()}function resetForm(){subName.value=amount.value=renewal.value='';freq.value='monthly';error.hidden=true}function removeSub(id){S.items=S.items.filter(x=>x.id!==id);Webinsolito.store.set(KEY,S);render()}function render(){const m=S.items.reduce((s,x)=>s+norm(x),0);monthly.textContent=Webinsolito.euro(m);yearly.textContent=Webinsolito.euro(m*12);count.textContent=S.items.length;list.innerHTML=S.items.length?S.items.map(x=>'<div class="row"><div><b>'+Webinsolito.esc(x.name)+'</b><span>'+Webinsolito.euro(x.amount)+' · '+({monthly:'mensile',yearly:'annuale',weekly:'settimanale',quarterly:'ogni 3 mesi'}[x.freq])+(x.renewal?' · rinnovo '+Webinsolito.date(x.renewal):'')+'</span></div><button class="btn soft" onclick="removeSub('+x.id+')">Togli</button></div>').join(''):'<div class="note">Nessun abbonamento salvato.</div>'}function exportData(){Webinsolito.download('abbonamenti.json',JSON.stringify(S,null,2))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
