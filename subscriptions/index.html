<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f4b45"><meta name="description" content="Tieni sotto controllo abbonamenti, rinnovi e costo mensile/annuale."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/subscriptions/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>Subscriptions — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"><style>:root{--navy:#0f4b45;--green:#68d6a3;--blue:#68d6a3}.row>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg" alt="">Subscriptions</div><a href="../soldi/">← Soldi & risparmio</a></header><section class="hero"><div class="ey">SOLDI & RISPARMIO</div><h1>Subscriptions</h1><p>Tieni sotto controllo abbonamenti, rinnovi e costo mensile/annuale.</p></section>
<div class="grid"><section class="card"><h2>Nuovo abbonamento</h2><div class="form"><div class="field"><label>Nome</label><input class="f" id="name" placeholder="Netflix, palestra…"></div><div class="field"><label>Importo €</label><input class="f" id="amount" type="number" min="0" step=".01"></div><div class="field"><label>Frequenza</label><select class="f" id="cadence"><option value="month">Mensile</option><option value="year">Annuale</option><option value="week">Settimanale</option></select></div><div class="field"><label>Prossimo rinnovo</label><input class="f" id="renewal" type="date"></div></div><div class="actions"><button class="btn green" onclick="save()">Aggiungi</button></div></section><aside class="card"><h2>Totali</h2><div class="result"><div class="metric"><span>Al mese</span><b id="m">—</b></div><div class="metric"><span>All'anno</span><b id="y">—</b></div><div class="metric"><span>Abbonamenti</span><b id="n">0</b></div><div class="metric"><span>Rinnovi 30 gg</span><b id="soon">0</b></div></div></aside></div><section class="card" style="margin-top:12px"><h2>I tuoi abbonamenti</h2><div id="list" class="list"></div></section><div class="footer"><a href="../soldi/">Soldi & risparmio</a> · dati salvati solo nel browser</div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>
const K='subscriptions.v1', $=id=>document.getElementById(id);let S=Webinsolito.store.get(K,{items:[]});
function monthly(x){const a=+x.amount||0;return x.cadence==='year'?a/12:x.cadence==='week'?a*52/12:a}
function save(){const name=$('name').value.trim(),amount=+$('amount').value,date=$('renewal').value;if(!name||!(amount>=0)||!date)return Webinsolito.toast('Inserisci nome, importo e rinnovo');S.items.push({id:Date.now(),name,amount,cadence:$('cadence').value,renewal:date});Webinsolito.store.set(K,S);$('name').value=$('amount').value=$('renewal').value='';render()}
function del(id){S.items=S.items.filter(x=>x.id!==id);Webinsolito.store.set(K,S);render()}
function render(){const m=S.items.reduce((t,x)=>t+monthly(x),0),y=m*12,now=new Date().toISOString().slice(0,10),soon=S.items.filter(x=>{const d=Webinsolito.days(now,x.renewal);return d>=0&&d<=30}).length;$('m').textContent=Webinsolito.euro(m);$('y').textContent=Webinsolito.euro(y);$('n').textContent=S.items.length;$('soon').textContent=soon;$('list').innerHTML=S.items.length?S.items.slice().sort((a,b)=>a.renewal.localeCompare(b.renewal)).map(x=>'<div class="row"><div><b>'+Webinsolito.esc(x.name)+'</b><span>'+Webinsolito.euro(x.amount)+' · '+(x.cadence==='month'?'mensile':x.cadence==='year'?'annuale':'settimanale')+' · rinnovo '+Webinsolito.date(x.renewal)+'</span></div><button class="btn soft" onclick="del('+x.id+')">Togli</button></div>').join(''):'<div class="note">Nessun abbonamento salvato.</div>'}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
