<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><meta name="robots" content="noindex,nofollow"><title>Offline — Webinsolito</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111d;color:#f7f3e9;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.box{width:min(560px,100%);padding:30px;border:1px solid #26384d;border-radius:24px;background:#0b1928;box-shadow:0 24px 70px rgba(0,0,0,.35)}h1{margin:0 0 12px;font-size:32px}p{margin:0 0 20px;color:#a9bac9;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a{min-height:44px;border-radius:12px;border:1px solid #415a74;background:#13283d;color:#fff;padding:11px 15px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}button{background:#e3b56b;color:#251a0d;border-color:#e3b56b}</style></head><body><main class="box"><h1>Sei offline.</h1><p>Le pagine già aperte su questo dispositivo possono continuare a funzionare. Per una pagina non ancora salvata, riconnettiti e riprova.</p><div class="actions"><button type="button" onclick="location.reload()">Riprova</button><a href="./">Torna alla Home</a></div></main></body></html>
