<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234a31"><meta name="description" content="Segna le scadenze del cibo e vedi subito cosa consumare prima."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/expiry-food/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>ExpiryFood — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"><style>:root{--navy:#234a31;--green:#f39a52;--blue:#f39a52}.row>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg" alt="">ExpiryFood</div><a href="../food/">← Food & spesa</a></header><section class="hero"><div class="ey">FOOD & SPESA</div><h1>ExpiryFood</h1><p>Segna le scadenze del cibo e vedi subito cosa consumare prima.</p></section>
<div class="grid"><section class="card"><h2>Aggiungi alimento</h2><div class="form"><div class="field"><label>Alimento</label><input class="f" id="name" placeholder="Yogurt, mozzarella…"></div><div class="field"><label>Scadenza</label><input class="f" id="date" type="date"></div><div class="field"><label>Quantità / nota</label><input class="f" id="qty" placeholder="2 confezioni"></div></div><div class="actions"><button class="btn green" onclick="add()">Salva scadenza</button></div></section><aside class="card"><h2>Situazione</h2><div class="result"><div class="metric"><span>Totale</span><b id="count">0</b></div><div class="metric"><span>Entro 3 giorni</span><b id="soon">0</b></div><div class="metric"><span>Scaduti</span><b id="bad">0</b></div></div></aside></div><section class="card" style="margin-top:12px"><h2>Da consumare</h2><div id="list" class="list"></div></section><div class="footer"><a href="../food/">Food & spesa</a> · dati salvati solo nel browser</div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>
const K='expiryfood.v1',$=id=>document.getElementById(id);let S=Webinsolito.store.get(K,{items:[]});
function add(){const name=$('name').value.trim(),date=$('date').value,qty=$('qty').value.trim();if(!name||!date)return Webinsolito.toast('Inserisci alimento e data');S.items.push({id:Date.now(),name,date,qty});Webinsolito.store.set(K,S);$('name').value=$('date').value=$('qty').value='';render()}
function del(id){S.items=S.items.filter(x=>x.id!==id);Webinsolito.store.set(K,S);render()}
function render(){const today=new Date().toISOString().slice(0,10),arr=S.items.slice().sort((a,b)=>a.date.localeCompare(b.date));let bad=0,soon=0;for(const x of arr){const d=Webinsolito.days(today,x.date);if(d<0)bad++;else if(d<=3)soon++}$('count').textContent=arr.length;$('bad').textContent=bad;$('soon').textContent=soon;$('list').innerHTML=arr.length?arr.map(x=>{const d=Webinsolito.days(today,x.date),cls=d<0?'bad':d<=3?'warn':'good',txt=d<0?'scaduto da '+Math.abs(d)+' g':d===0?'scade oggi':d===1?'scade domani':'tra '+d+' giorni';return '<div class="row"><div><b>'+Webinsolito.esc(x.name)+'</b><span>'+(x.qty?Webinsolito.esc(x.qty)+' · ':'')+Webinsolito.date(x.date)+'</span></div><div><span class="status '+cls+'">'+txt+'</span><button class="btn soft" onclick="del('+x.id+')">Usato</button></div></div>'}).join(''):'<div class="note">Aggiungi ciò che vuoi tenere d’occhio.</div>'}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
