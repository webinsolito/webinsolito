<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171B20"><link rel="manifest" href="manifest.json"><title>DealerFlow</title><style>
:root{--d:#171B20;--p:#D9534F;--bg:#f4f6f9;--text:#18212d;--muted:#718096;--line:#e2e8f0;--card:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--d) 0 220px,var(--bg) 220px);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#e8eef5}.top a{color:inherit;text-decoration:none}.badge{font-size:11px;border:1px solid #ffffff2b;border-radius:99px;padding:7px 10px}.hero{color:#fff;padding:28px 2px 26px}.hero h1{font-size:40px;letter-spacing:-1.5px;margin:8px 0}.hero p{margin:0;color:#c8d4df;line-height:1.5}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:800;color:#526173}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #0b18270d}.stat{font-size:30px;font-weight:900;letter-spacing:-1px}.small{font-size:12px;color:var(--muted);line-height:1.45}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.f{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fbfcfd;outline:none}.f:focus{border-color:var(--p)}textarea.f{min-height:80px;resize:vertical}.btn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:12px 15px;font-weight:850;cursor:pointer}.btn.ghost{background:#eef2f6;color:#364152}.btn.danger{background:#ffe8e8;color:#a12828}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block}.pill{display:inline-block;font-size:10px;font-weight:850;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#536173}.empty{text-align:center;padding:28px;color:var(--muted)}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.sectionTitle h2{font-size:21px;margin:0}.notice{background:#fff8db;border:1px solid #f0d67c;border-radius:16px;padding:12px 14px;color:#6b5712;font-size:12px;line-height:1.45;margin-bottom:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hero h1{font-size:34px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="app"><div class="top"><a href="../">← Webinsolito Apps</a><span class="badge">APP V1 · locale</span></div><section class="hero"><div style="font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#D9534F">Webinsolito</div><h1>DealerFlow</h1><p><b>La concessionaria, in movimento.</b><br>Stock veicoli, lead, pipeline e agenda commerciale in un’unica app locale.</p></section>
<nav class="tabs"><button class="tab on" data-tab="0">Dashboard</button><button class="tab" data-tab="1">Veicoli</button><button class="tab" data-tab="2">Lead</button><button class="tab" data-tab="3">Agenda</button></nav>
<section class="panel on" id="p0"><div class="grid"><div class="card"><div class="small">Veicoli disponibili</div><div class="stat" id="sVeh">0</div></div><div class="card"><div class="small">Lead aperti</div><div class="stat" id="sLead">0</div></div><div class="card"><div class="small">Valore stock</div><div class="stat" id="sVal">€0</div></div></div><div class="card" style="margin-top:12px"><h2>Pipeline</h2><div id="pipe"></div></div></section>
<section class="panel" id="p1"><div class="card"><h2>Nuovo veicolo</h2><div class="form"><input class="f" id="carStock" placeholder="Codice stock"><input class="f" id="carModel" placeholder="Marca e modello"><input class="f" id="carPlate" placeholder="Targa"><input class="f" id="carPrice" type="number" placeholder="Prezzo €"><input class="f" id="carKm" type="number" placeholder="Km"><select class="f" id="carStatus"><option>Disponibile</option><option>Riservata</option><option>Venduta</option></select></div><button class="btn" id="addCar" style="margin-top:10px">Aggiungi veicolo</button></div><div class="list" id="cars"></div></section>
<section class="panel" id="p2"><div class="card"><h2>Nuovo lead</h2><div class="form"><input class="f" id="lName" placeholder="Nome cliente"><input class="f" id="lContact" placeholder="Telefono / email"><input class="f" id="lInterest" placeholder="Veicolo di interesse"><select class="f" id="lStage"><option>Nuovo</option><option>Contattato</option><option>Test drive</option><option>Offerta</option><option>Chiuso</option></select><input class="f" id="lNext" type="datetime-local"><input class="f" id="lNote" placeholder="Nota"></div><button class="btn" id="addLead" style="margin-top:10px">Salva lead</button></div><div class="list" id="leads"></div></section>
<section class="panel" id="p3"><div class="card"><h2>Prossime attività</h2><div id="agenda"></div></div></section></main><script>
const K='dealerflow_v2';let S=JSON.parse(localStorage.getItem(K)||'{"cars":[],"leads":[]}');const save=()=>{localStorage.setItem(K,JSON.stringify(S));render()};const id=()=>Date.now()+Math.random();const esc=s=>(s||'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p'+b.dataset.tab).classList.add('on')});
addCar.onclick=()=>{if(!carModel.value.trim())return alert('Inserisci il veicolo');S.cars.push({id:id(),stock:carStock.value.trim(),model:carModel.value.trim(),plate:carPlate.value.trim().toUpperCase(),price:+carPrice.value||0,km:+carKm.value||0,status:carStatus.value});[carStock,carModel,carPlate,carPrice,carKm].forEach(x=>x.value='');save()};
addLead.onclick=()=>{if(!lName.value.trim())return alert('Inserisci il cliente');S.leads.push({id:id(),name:lName.value.trim(),contact:lContact.value.trim(),interest:lInterest.value.trim(),stage:lStage.value,next:lNext.value,note:lNote.value.trim()});[lName,lContact,lInterest,lNext,lNote].forEach(x=>x.value='');save()};
function remove(type,i){S[type]=S[type].filter(x=>x.id!=i);save()}function setStage(i,v){const x=S.leads.find(x=>x.id==i);if(x){x.stage=v;save()}}function setCar(i,v){const x=S.cars.find(x=>x.id==i);if(x){x.status=v;save()}}
function render(){sVeh.textContent=S.cars.filter(c=>c.status==='Disponibile').length;sLead.textContent=S.leads.filter(l=>l.stage!=='Chiuso').length;sVal.textContent='€'+S.cars.filter(c=>c.status!=='Venduta').reduce((a,b)=>a+b.price,0).toLocaleString('it-IT');
 const stages=['Nuovo','Contattato','Test drive','Offerta','Chiuso'];pipe.innerHTML='<div class="grid">'+stages.map(s=>'<div class="card"><b>'+s+'</b><div class="stat">'+S.leads.filter(l=>l.stage===s).length+'</div></div>').join('')+'</div>';
 cars.innerHTML=S.cars.map(c=>'<div class="item"><div><b>'+esc(c.model)+'</b><span class="small">'+esc(c.stock)+' · '+esc(c.plate)+' · '+c.km.toLocaleString('it-IT')+' km · €'+c.price.toLocaleString('it-IT')+'</span></div><div class="row"><select class="f" style="width:auto" onchange="setCar('+c.id+',this.value)"><option'+(c.status==='Disponibile'?' selected':'')+'>Disponibile</option><option'+(c.status==='Riservata'?' selected':'')+'>Riservata</option><option'+(c.status==='Venduta'?' selected':'')+'>Venduta</option></select><button class="btn danger" onclick="remove(\'cars\','+c.id+')">×</button></div></div>').join('')||'<div class="empty">Nessun veicolo</div>';
 leads.innerHTML=S.leads.slice().reverse().map(l=>'<div class="item"><div><b>'+esc(l.name)+' · '+esc(l.interest)+'</b><span class="small">'+esc(l.contact)+' · '+esc(l.note)+(l.next?' · '+l.next.replace('T',' '):'')+'</span></div><div class="row"><select class="f" style="width:auto" onchange="setStage('+l.id+',this.value)">'+['Nuovo','Contattato','Test drive','Offerta','Chiuso'].map(s=>'<option'+(l.stage===s?' selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn danger" onclick="remove(\'leads\','+l.id+')">×</button></div></div>').join('')||'<div class="empty">Nessun lead</div>';
 const a=S.leads.filter(l=>l.next).sort((x,y)=>x.next.localeCompare(y.next));agenda.innerHTML=a.map(l=>'<div class="item"><div><b>'+esc(l.name)+' · '+esc(l.stage)+'</b><span class="small">'+esc(l.interest)+'</span></div><span class="pill">'+l.next.replace('T',' ')+'</span></div>').join('')||'<div class="empty">Nessuna attività pianificata</div>';
}render();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
