<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>GestionaleJo · Ripristino sessione live</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#fff}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(420px,100%);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 16px;border-radius:17px;background:#d3a24b;color:#111827;display:grid;place-items:center;font-weight:1000}
    h1{font-size:22px;margin:0 0 8px}p{font-size:12px;line-height:1.6;color:#b8c2d1;margin:0}
  </style>
</head>
<body>
  <main><div class="mark">GJ</div><h1>Ripristino GestionaleJo</h1><p id="status">Rimuovo la vecchia sessione demo e apro MALÙ23 con i dati reali…</p></main>
  <script>
    (async()=>{
      try{
        localStorage.removeItem('dealer-platform-session');
        sessionStorage.removeItem('gestionalejo-session-reset');
        if('caches' in window){
          const names=await caches.keys();
          await Promise.all(names.filter(name=>name.startsWith('dealer-platform-')).map(name=>caches.delete(name)));
        }
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(reg=>reg.scope.includes('/dealer-platform/')).map(reg=>reg.unregister()));
        }
      }catch(err){console.warn('Reset parziale',err)}
      location.replace('./?live='+Date.now());
    })();
  </script>
</body>
</html>
