<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Trasforma rapidamente una o più immagini in pagine pronte da stampare o salvare come PDF dal browser."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/pdfquick/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>PDFQuick — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"><style>.print-page{background:#fff;border-radius:14px;padding:16px;margin:16px 0;text-align:center}.print-page img{max-width:100%;max-height:90vh}@media print{body{background:#fff}.top,.hero,.no-print,.footer,.wi-app-install{display:none!important}.tool{max-width:none;padding:0}.print-page{page-break-after:always;margin:0;padding:0;border:0;border-radius:0;height:100vh;display:flex;align-items:center;justify-content:center}.print-page img{max-height:98vh;max-width:98vw}}</style></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../documenti/">← Categoria</a></header><section class="hero"><h1>PDFQuick</h1><p>Trasforma rapidamente una o più immagini in pagine pronte da stampare o salvare come PDF dal browser.</p></section>
<section class="card no-print"><div class="field"><label>Seleziona immagini</label><input class="f" id="files" type="file" accept="image/*" multiple></div><div class="actions"><button class="btn primary" id="prepare">Prepara pagine</button><button class="btn" id="printbtn">Stampa / Salva PDF</button></div><div class="muted">Nel pannello di stampa scegli “Salva come PDF”. Nessun file viene caricato online.</div></section><section id="pages"></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>
let urls=[];prepare.onclick=()=>{urls.forEach(URL.revokeObjectURL);urls=[];pages.innerHTML='';[...files.files].forEach(f=>{const u=URL.createObjectURL(f);urls.push(u);const p=document.createElement('div');p.className='print-page';p.innerHTML='<img src="'+u+'" alt="">';pages.appendChild(p)})};printbtn.onclick=()=>window.print()
</script></body></html>
