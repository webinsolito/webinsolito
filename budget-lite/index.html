<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Budget mensile essenziale con entrate, spese e margine disponibile."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/budget-lite/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>BudgetLite — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg">BudgetLite</div><a href="../soldi/">← Soldi & risparmio</a></header><section class="hero"><div class="ey">SOLDI & RISPARMIO</div><h1>Il mese è sotto controllo?</h1><p>Un budget semplice: entrate, spese principali e quanto resta davvero disponibile.</p></section><div class="grid"><section class="card"><h2>Questo mese</h2><div class="form"><div class="field"><label>Entrate nette €</label><input class="f" id="income" type="number" min="0" max="1000000" step=".01"></div><div class="field"><label>Casa €</label><input class="f" id="home" type="number" min="0" step=".01"></div><div class="field"><label>Spesa / cibo €</label><input class="f" id="food" type="number" min="0" step=".01"></div><div class="field"><label>Trasporti €</label><input class="f" id="transport" type="number" min="0" step=".01"></div><div class="field"><label>Abbonamenti €</label><input class="f" id="subs" type="number" min="0" step=".01"></div><div class="field"><label>Altre spese €</label><input class="f" id="other" type="number" min="0" step=".01"></div></div><div class="actions"><button class="btn green" onclick="calc()">Calcola budget</button><button class="btn soft" onclick="resetAll()">Reset</button></div><div id="error" class="note warn" hidden></div></section><aside class="card"><h2>Risultato</h2><div class="result"><div class="metric"><span>Spese totali</span><b id="expenses">—</b></div><div class="metric"><span>Rimane</span><b id="left">—</b></div><div class="metric"><span>Spese / entrate</span><b id="ratio">—</b></div><div class="metric"><span>Margine / giorno</span><b id="perDay">—</b></div></div><div id="status" class="status" style="margin-top:10px">Inserisci le entrate.</div></aside></div><div class="footer"><a href="../soldi/">Soldi & risparmio</a></div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>const $=id=>document.getElementById(id);function calc(){error.hidden=true;const i=+income.value;if(!(i>0)){error.textContent='Inserisci entrate maggiori di zero.';error.hidden=false;return}const ids=['home','food','transport','subs','other'],e=ids.reduce((s,id)=>s+Math.max(0,+$(id).value||0),0),l=i-e;expenses.textContent=Webinsolito.euro(e);left.textContent=Webinsolito.euro(l);ratio.textContent=(e/i*100).toFixed(1)+'%';perDay.textContent=Webinsolito.euro(Math.max(0,l)/30);status.className='status '+(l<0?'bad':l<i*.1?'warn':'good');status.textContent=l<0?'Le spese superano le entrate.':l<i*.1?'Il margine è piuttosto stretto.':'Hai un margine positivo questo mese.'}function resetAll(){for(const id of ['income','home','food','transport','subs','other'])$(id).value='';for(const id of ['expenses','left','ratio','perDay'])$(id).textContent='—';status.className='status';status.textContent='Inserisci le entrate.';error.hidden=true};if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
