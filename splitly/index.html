<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#232040"><link rel="manifest" href="manifest.json"><title>Splitly</title><style>:root{--d:#232040;--p:#8276FF;--bg:#f4f6f9;--text:#18212d;--muted:#718096;--line:#e2e8f0;--card:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--d) 0 220px,var(--bg) 220px);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#e8eef5}.top a{color:inherit;text-decoration:none}.badge{font-size:11px;border:1px solid #ffffff2b;border-radius:99px;padding:7px 10px}.hero{color:#fff;padding:28px 2px 26px}.hero h1{font-size:40px;letter-spacing:-1.5px;margin:8px 0}.hero p{margin:0;color:#c8d4df;line-height:1.5}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:800;color:#526173}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #0b18270d}.stat{font-size:30px;font-weight:900;letter-spacing:-1px}.small{font-size:12px;color:var(--muted);line-height:1.45}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.f{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fbfcfd;outline:none}.f:focus{border-color:var(--p)}textarea.f{min-height:82px;resize:vertical}.btn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:12px 15px;font-weight:850;cursor:pointer}.btn.ghost{background:#eef2f6;color:#364152}.btn.danger{background:#ffe8e8;color:#a12828}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block}.pill{display:inline-block;font-size:10px;font-weight:850;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#536173}.empty{text-align:center;padding:28px;color:var(--muted)}.notice{background:#fff8db;border:1px solid #f0d67c;border-radius:16px;padding:12px 14px;color:#6b5712;font-size:12px;line-height:1.45;margin-bottom:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3f7;border:1px solid #dce5ec;border-radius:99px;padding:7px 10px;font-size:12px}.progress{height:9px;border-radius:99px;background:#e9eef3;overflow:hidden}.progress>i{display:block;height:100%;background:var(--p)}@media(max-width:720px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hero h1{font-size:34px}.item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><div class="top"><a href="../">← Webinsolito Apps</a><span class="badge">APP V1 · locale</span></div><section class="hero"><div style="font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#8276FF">Webinsolito</div><h1>Splitly</h1><p><b>Dividere le spese, senza discussioni.</b><br>Gruppi, spese condivise, saldi e rimborsi calcolati automaticamente.</p></section>
<nav class="tabs"><button class="tab on" data-tab="0">Gruppo</button><button class="tab" data-tab="1">Spese</button><button class="tab" data-tab="2">Saldi</button></nav>
<section class="panel on" id="p0"><div class="card"><h2>Imposta gruppo</h2><div class="form"><input class="f" id="gName" placeholder="Es. Weekend Roma"><textarea class="f" id="gPeople" placeholder="Una persona per riga o separate da virgola"></textarea></div><button class="btn" id="saveGroup" style="margin-top:10px">Salva gruppo</button><div class="chips" id="people" style="margin-top:14px"></div></div></section>
<section class="panel" id="p1"><div class="card"><h2>Nuova spesa</h2><div class="form"><input class="f" id="xDesc" placeholder="Descrizione"><input class="f" id="xAmt" type="number" step="0.01" placeholder="Importo €"><select class="f" id="xPayer"></select><select class="f" id="xSplit"><option value="all">Dividi tra tutti</option><option value="payer">Solo chi ha pagato</option></select></div><button class="btn" id="addExp" style="margin-top:10px">Aggiungi spesa</button></div><div class="list" id="expenses"></div></section>
<section class="panel" id="p2"><div class="grid" id="balances"></div><div class="card" style="margin-top:12px"><h2>Come pareggiare</h2><div id="settle"></div></div></section></main><script>
const K='splitly_v2';let S=JSON.parse(localStorage.getItem(K)||'{"name":"","people":[],"expenses":[]}');gName.value=S.name||'';gPeople.value=(S.people||[]).join('\n');const save=()=>{localStorage.setItem(K,JSON.stringify(S));render()},id=()=>Date.now()+Math.random(),esc=s=>(s||'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p'+b.dataset.tab).classList.add('on');render()});
saveGroup.onclick=()=>{S.name=gName.value.trim();S.people=[...new Set(gPeople.value.split(/[,\n;]/).map(x=>x.trim()).filter(Boolean))];S.expenses=S.expenses.filter(e=>S.people.includes(e.payer));save()};
addExp.onclick=()=>{if(!xDesc.value.trim()||!xAmt.value||!xPayer.value)return alert('Completa descrizione, importo e pagante');const shares=xSplit.value==='all'?S.people.slice():[xPayer.value];S.expenses.push({id:id(),desc:xDesc.value.trim(),amt:+xAmt.value,payer:xPayer.value,shares,date:new Date().toISOString()});xDesc.value=xAmt.value='';save()};
function rem(i){S.expenses=S.expenses.filter(e=>e.id!=i);save()}
function calc(){const b=Object.fromEntries(S.people.map(p=>[p,0]));for(const e of S.expenses){if(!b.hasOwnProperty(e.payer))continue;b[e.payer]+=e.amt;const sh=e.shares.filter(p=>b.hasOwnProperty(p));if(sh.length){const each=e.amt/sh.length;sh.forEach(p=>b[p]-=each)}}return b}
function settlements(b){const debt=Object.entries(b).filter(([,v])=>v<-.005).map(([n,v])=>[n,-v]).sort((a,b)=>b[1]-a[1]);const cred=Object.entries(b).filter(([,v])=>v>.005).map(([n,v])=>[n,v]).sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;while(i<debt.length&&j<cred.length){const a=Math.min(debt[i][1],cred[j][1]);out.push([debt[i][0],cred[j][0],a]);debt[i][1]-=a;cred[j][1]-=a;if(debt[i][1]<.005)i++;if(cred[j][1]<.005)j++}return out}
function render(){people.innerHTML=S.people.map(p=>'<span class="chip">'+esc(p)+'</span>').join('')||'<span class="small">Aggiungi almeno due persone</span>';xPayer.innerHTML='<option value="">Chi ha pagato?</option>'+S.people.map(p=>'<option>'+esc(p)+'</option>').join('');expenses.innerHTML=S.expenses.slice().reverse().map(e=>'<div class="item"><div><b>'+esc(e.desc)+'</b><span class="small">'+esc(e.payer)+' ha pagato · divisa tra '+e.shares.length+'</span></div><div class="row"><b>€'+e.amt.toFixed(2)+'</b><button class="btn danger" onclick="rem('+e.id+')">×</button></div></div>').join('')||'<div class="empty">Nessuna spesa</div>';const b=calc();balances.innerHTML=Object.entries(b).map(([n,v])=>'<div class="card"><div class="small">'+esc(n)+'</div><div class="stat" style="color:'+(v>=0?'#198754':'#c0392b')+'">'+(v>=0?'+':'')+'€'+v.toFixed(2)+'</div></div>').join('')||'<div class="empty">Configura il gruppo</div>';const s=settlements(b);settle.innerHTML=s.map(x=>'<div class="item"><b>'+esc(x[0])+' → '+esc(x[1])+'</b><strong>€'+x[2].toFixed(2)+'</strong></div>').join('')||'<div class="empty">Tutto pareggiato</div>'}render();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
