<!doctype html>
<html lang="it" data-app-build="splitly-rebuild-v1">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081620"><title>Splitly</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#081620;color:#f5f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{width:min(100%,620px);margin:auto;padding:18px 18px max(30px,env(safe-area-inset-bottom))}.head{display:flex;gap:11px;align-items:center;margin:4px 0 25px}.head img{width:42px;height:42px}.head b{font-size:18px}.head span{display:block;color:#7f95a6;font-size:10px;margin-top:3px}.hero h1{font-size:36px;line-height:1.03;letter-spacing:-.055em;margin:0}.hero p{color:#8ba0b1;font-size:13px;line-height:1.5;margin:11px 0 23px}.card{background:#0c202d;border:1px solid #214051;border-radius:23px;padding:16px;margin-top:12px}.label{display:block;color:#91a6b5;font-size:10px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}.field{width:100%;min-height:53px;border:1px solid #2b4959;border-radius:15px;background:#071923;color:#f7fafc;padding:0 13px;font:700 15px/1.2 inherit;outline:none}.field:focus{border-color:#7bd7bd;box-shadow:0 0 0 3px #7bd7bd17}.fieldArea{min-height:86px;padding-top:13px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.primary{width:100%;min-height:54px;border:0;border-radius:16px;background:#7bd7bd;color:#071712;font:900 15px/1 inherit;margin-top:14px}.error{display:none;color:#ff9f9f;font-size:11px;margin-top:10px}.error.show{display:block}.result{display:none}.result.show{display:block}.resultTop{display:flex;justify-content:space-between;align-items:start;gap:12px}.resultTop h2{font-size:22px;letter-spacing:-.03em;margin:0}.resultTop strong{font-size:22px;color:#7bd7bd}.sub{color:#7e95a6;font-size:10px;line-height:1.45;margin-top:5px}.debts{display:grid;gap:9px;margin-top:14px}.debt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px;border:1px solid #203d4e;border-radius:15px;background:#091b27}.debt b{font-size:12px}.debt span{display:block;color:#7e95a7;font-size:9.5px;margin-top:3px}.money{font-size:14px;font-weight:900;color:#d9e8ee;white-space:nowrap}.paid{color:#7bd7bd}.actions{display:flex;gap:8px;margin-top:13px}.secondary{flex:1;min-height:43px;border:0;border-radius:13px;background:#153549;color:#b8cad5;font-weight:850}.history{color:#8399aa;font-size:10px;line-height:1.5}.history b{color:#dbe5eb}@media(max-width:420px){.app{padding:14px}.hero h1{font-size:33px}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="app">
<header class="head"><img src="logo.svg" alt=""><div><b>Splitly</b><span>Dividi il conto senza discussioni</span></div></header>
<section class="hero"><h1>Quanto deve dare<br>ciascuno?</h1><p>Inserisci il totale, i nomi e chi ha pagato. Splitly divide in centesimi e ti dice subito chi deve rimborsare chi.</p></section>
<section class="card"><label class="label" for="total">Totale €</label><input id="total" class="field" inputmode="decimal" placeholder="Es. 120,00"><div class="grid"><div><label class="label" for="names">Persone</label><textarea id="names" class="field fieldArea" placeholder="Luca, Marta, Jo"></textarea></div><div><label class="label" for="payer">Ha pagato</label><select id="payer" class="field"><option value="">Inserisci prima i nomi</option></select></div></div><button id="calculateBtn" class="primary" type="button">Dividi conto</button><div id="error" class="error"></div></section>
<section id="result" class="card result" aria-live="polite"><div class="resultTop"><div><h2>Rimborsi</h2><div id="summary" class="sub"></div></div><strong id="perPerson">—</strong></div><div id="debts" class="debts"></div><div class="actions"><button id="copyBtn" class="secondary" type="button">Copia riepilogo</button><button id="resetBtn" class="secondary" type="button">Nuovo conto</button></div></section>
<section class="card"><span class="label">Ultimo conto</span><div id="lastSplit" class="history">Nessun conto salvato.</div></section>
</main>
<script>
(()=>{
const KEY='splitly.rebuild.v1',$=id=>document.getElementById(id);let latest=null;
function parseMoney(v){const n=Number(String(v||'').trim().replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?Math.round(n*100):0}
function euro(cents){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(cents/100)}
function people(){const seen=new Set();return $('names').value.split(/[,\n;]/).map(v=>v.trim()).filter(Boolean).filter(name=>{const key=name.toLocaleLowerCase('it');if(seen.has(key))return false;seen.add(key);return true})}
function syncPayer(){const list=people(),old=$('payer').value;$('payer').innerHTML=list.length?list.map(name=>`<option value="${name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${name.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</option>`).join(''):'<option value="">Inserisci prima i nomi</option>';if(list.includes(old))$('payer').value=old}
function splitCents(total,count){const base=Math.floor(total/count),rest=total-base*count;return Array.from({length:count},(_,i)=>base+(i<rest?1:0))}
function calculate(){const total=parseMoney($('total').value),list=people(),payer=$('payer').value,err=$('error');err.classList.remove('show');if(total<=0){err.textContent='Inserisci un totale maggiore di zero.';err.classList.add('show');return}if(list.length<2){err.textContent='Inserisci almeno due persone.';err.classList.add('show');return}if(!list.includes(payer)){err.textContent='Scegli chi ha pagato.';err.classList.add('show');return}const shares=splitCents(total,list.length),entries=list.map((name,i)=>({name,share:shares[i]})),payerShare=entries.find(x=>x.name===payer).share;const reimburse=entries.filter(x=>x.name!==payer).map(x=>({from:x.name,to:payer,amount:x.share}));latest={total,list,payer,payerShare,reimburse,at:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(latest));renderResult()}
function textSummary(data){return [`Conto ${euro(data.total)} · ${data.list.length} persone`,`Quota media ${euro(Math.floor(data.total/data.list.length))}`,`Ha pagato: ${data.payer}`,...data.reimburse.map(r=>`${r.from} → ${r.to}: ${euro(r.amount)}`)].join('\n')}
function renderResult(){if(!latest){$('result').classList.remove('show');return}$('result').classList.add('show');$('perPerson').textContent=euro(Math.floor(latest.total/latest.list.length));$('summary').textContent=`${euro(latest.total)} · ${latest.list.length} persone · ha pagato ${latest.payer}`;$('debts').innerHTML=`<div class="debt"><div><b>${latest.payer}</b><span>Quota personale già compresa</span></div><div class="money paid">${euro(latest.payerShare)}</div></div>`+latest.reimburse.map(r=>`<div class="debt"><div><b>${r.from}</b><span>deve rimborsare ${r.to}</span></div><div class="money">${euro(r.amount)}</div></div>`).join('');$('lastSplit').innerHTML=`<b>${euro(latest.total)}</b> · ${latest.list.join(', ')}<br>${new Date(latest.at).toLocaleString('it-IT')}`;$('result').scrollIntoView({behavior:'smooth',block:'start'})}
async function copy(){if(!latest)return;const text=textSummary(latest);try{await navigator.clipboard.writeText(text);$('copyBtn').textContent='Copiato ✓';setTimeout(()=>$('copyBtn').textContent='Copia riepilogo',1300)}catch{$('copyBtn').textContent='Copia non disponibile';setTimeout(()=>$('copyBtn').textContent='Copia riepilogo',1500)}}
function reset(){latest=null;$('total').value='';$('names').value='';syncPayer();$('result').classList.remove('show');$('total').focus()}
$('names').addEventListener('input',syncPayer);$('calculateBtn').addEventListener('click',calculate);$('copyBtn').addEventListener('click',copy);$('resetBtn').addEventListener('click',reset);try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.total&&Array.isArray(saved.list))latest=saved}catch{}syncPayer();renderResult();
})();
</script></body></html>
