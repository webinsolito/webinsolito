<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Trasforma il budget rimanente in una soglia di spesa giornaliera."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/daily-spend/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>DailySpend — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg">DailySpend</div><a href="../soldi/">← Soldi & risparmio</a></header><section class="hero"><div class="ey">SOLDI & RISPARMIO</div><h1>Quanto puoi spendere al giorno?</h1><p>Dividi il budget che ti resta per i giorni rimanenti e tieni un ritmo semplice.</p></section><div class="grid"><section class="card"><h2>Budget rimanente</h2><div class="form"><div class="field"><label>Budget rimasto €</label><input class="f" id="budget" type="number" min="0" max="1000000" step=".01"></div><div class="field"><label>Giorni rimanenti</label><input class="f" id="days" type="number" min="1" max="366" step="1"></div><div class="field"><label>Riserva da non toccare €</label><input class="f" id="reserve" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Speso oggi €</label><input class="f" id="today" type="number" min="0" step=".01" value="0"></div></div><div class="actions"><button class="btn green" onclick="calc()">Calcola ritmo</button><button class="btn soft" onclick="resetAll()">Reset</button></div><div id="error" class="note warn" hidden></div></section><aside class="card"><h2>Oggi</h2><div class="result"><div class="metric"><span>Budget utile</span><b id="usable">—</b></div><div class="metric"><span>Quota / giorno</span><b id="dailyLimit">—</b></div><div class="metric"><span>Resto per oggi</span><b id="todayLeft">—</b></div></div><div id="status" class="status" style="margin-top:10px">Inserisci budget e giorni.</div></aside></div><div class="footer"><a href="../soldi/">Soldi & risparmio</a></div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>function calc(){error.hidden=true;const b=+budget.value,d=Math.floor(+days.value),r=Math.max(0,+reserve.value||0),t=Math.max(0,+today.value||0);if(!(b>=0)||!(d>=1)){error.textContent='Inserisci un budget valido e almeno 1 giorno.';error.hidden=false;return}if(r>b){error.textContent='La riserva non può superare il budget rimasto.';error.hidden=false;return}const u=b-r,l=u/d,left=l-t;usable.textContent=Webinsolito.euro(u);dailyLimit.textContent=Webinsolito.euro(l);todayLeft.textContent=Webinsolito.euro(Math.max(0,left));status.className='status '+(left<0?'warn':'good');status.textContent=left<0?'Oggi hai superato la quota di '+Webinsolito.euro(Math.abs(left))+'.':'Sei ancora dentro la quota di oggi.'}function resetAll(){budget.value=days.value='';reserve.value=today.value=0;usable.textContent=dailyLimit.textContent=todayLeft.textContent='—';status.className='status';status.textContent='Inserisci budget e giorni.';error.hidden=true};if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
