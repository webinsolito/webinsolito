name: Dealer Platform Browser Gate

on:
  push:
    branches:
      - main
    paths:
      - 'dealer-platform/**'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/dealer-platform-browser-gate.yml'
  pull_request:
    paths:
      - 'dealer-platform/**'
      - 'tests/e2e/dealer-platform-release.spec.js'
      - 'tests/e2e/dealer-platform-bootstrap.spec.js'
      - 'tests/e2e/dealer-platform-premium.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/dealer-platform-browser-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/malu23-http.log 2>&1 &
          echo $! > /tmp/malu23-http.pid
          sleep 2
      - name: Bootstrap diagnostics
        run: npx playwright test tests/e2e/dealer-platform-bootstrap.spec.js --project=desktop-chromium
      - name: Desktop and iPhone release gate
        run: npx playwright test tests/e2e/dealer-platform-release.spec.js tests/e2e/dealer-platform-premium.spec.js --project=desktop-chromium --project=iphone
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: malu23-browser-gate-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            /tmp/malu23-http.log
          if-no-files-found: ignore
          retention-days: 7
