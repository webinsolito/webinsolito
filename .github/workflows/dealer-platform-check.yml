name: Dealer Platform Check

on:
  pull_request:
    paths:
      - 'dealer-platform/**'
      - '.github/workflows/dealer-platform-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check dealer-platform/app.js
          node --check dealer-platform/today-priority.js
          node --check dealer-platform/delivery-readiness.js
          node --check dealer-platform/client-followup.js
          node --check dealer-platform/calendar-priority.js
          node --check dealer-platform/api.js
          node --check dealer-platform/offline.js
          node --check dealer-platform/clients.js
          node --check dealer-platform/calendar.js
          node --check dealer-platform/documents.js
          node --check dealer-platform/contracts.js
          node --check dealer-platform/invoices.js
          node --check dealer-platform/sales.js
          node --check dealer-platform/finances.js
          node --check dealer-platform/autoscout-advisor.js
          node --check dealer-platform/autoscout.js
          node --check dealer-platform/autoscout-link.js
          node --check dealer-platform/autoscout-safety.js
          node --check dealer-platform/instagram.js
          node --check dealer-platform/reports.js
          node --check dealer-platform/admin.js
          node --check dealer-platform/backup-core.js
          node --check dealer-platform/backup.js
          node --check dealer-platform/sw.js
          node --check dealer-platform/worker/index.js
          node --check dealer-platform/worker/admin.js
          node --check dealer-platform/worker/setup-telegram.mjs
      - name: Focused unit tests
        run: node --test dealer-platform/tests/*.test.mjs
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('dealer-platform/manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Secret guard
        run: |
          ! grep -R -E "(sk_live_|sb_secret_|service_role[^A-Za-z0-9]*[:=][^A-Za-z0-9]*(eyJ|[A-Za-z0-9_-]{30,})|AUTOSCOUT_(USER|PASSWORD)[^A-Za-z0-9]*[:=][^A-Za-z0-9]+[^$'{]|(META|INSTAGRAM)_(ACCESS_TOKEN|APP_SECRET)[^A-Za-z0-9]*[:=][^A-Za-z0-9]+[^$'{])" dealer-platform --exclude='*.md' --exclude='*.example' || (echo 'Possible committed secret' && exit 1)
      - name: Required offline assets
        run: |
          test -f dealer-platform/index.html
          test -f dealer-platform/offline.js
          test -f dealer-platform/sw.js
          test -f dealer-platform/today-priority.js
          test -f dealer-platform/delivery-readiness.js
          test -f dealer-platform/client-followup.js
          test -f dealer-platform/calendar-priority.js
          test -f dealer-platform/clients.js
          test -f dealer-platform/calendar.js
          test -f dealer-platform/documents.js
          test -f dealer-platform/contracts.js
          test -f dealer-platform/invoices.js
          test -f dealer-platform/sales.js
          test -f dealer-platform/finances.js
          test -f dealer-platform/autoscout-advisor.js
          test -f dealer-platform/autoscout.js
          test -f dealer-platform/autoscout-link.js
          test -f dealer-platform/autoscout-safety.js
          test -f dealer-platform/instagram.js
          test -f dealer-platform/reports.js
          test -f dealer-platform/admin.js
          test -f dealer-platform/backup-core.js
          test -f dealer-platform/backup.js
          test -f dealer-platform/worker/index.js
          test -f dealer-platform/worker/admin.js
      - name: Contract invariants
        run: |
          grep -q "snapshot_hash" dealer-platform/contracts.js
          grep -q "guard_contract_version_immutable" dealer-platform/supabase/migrations/0006_contracts_v07.sql
          grep -q "contract_versions" dealer-platform/offline.js
      - name: Invoice invariants
        run: |
          grep -q "payment_status" dealer-platform/invoices.js
          grep -q "vehicle_cost_id" dealer-platform/invoices.js
          grep -q "invoices_member_select" dealer-platform/supabase/migrations/0007_invoices_v08.sql
          grep -q "with check" dealer-platform/supabase/migrations/0007_invoices_v08.sql
          grep -q "'invoices'" dealer-platform/offline.js
      - name: Sales invariants
        run: |
          grep -q "sale_stage" dealer-platform/sales.js
          grep -q "financing_status" dealer-platform/sales.js
          grep -q "trade_in" dealer-platform/sales.js
          grep -q "planned_delivery_at" dealer-platform/sales.js
          grep -q "contracts_sale_invoice_fk" dealer-platform/supabase/migrations/0008_sales_v09.sql
          grep -q "CONSEGNATA" dealer-platform/sales.js
      - name: Finance invariants
        run: |
          grep -q "CAPITALE STOCK" dealer-platform/finances.js
          grep -q "MARGINE GESTIONALE" dealer-platform/finances.js
          grep -q "DA INCASSARE" dealer-platform/finances.js
          grep -q "view_costs" dealer-platform/finances.js
          grep -q "vehicle_costs" dealer-platform/finances.js
      - name: AutoScout invariants
        run: |
          grep -q "autoscout_status" dealer-platform/autoscout.js
          grep -q "autoscout_listing_id" dealer-platform/autoscout.js
          grep -q "suggestAutoScoutPrice" dealer-platform/autoscout.js
          grep -q "AUTOSCOUT_EXPORT" dealer-platform/autoscout.js
          grep -q "Esporta stock" dealer-platform/autoscout.js
          grep -q "normalizeAutoScoutUrl" dealer-platform/autoscout-link.js
          grep -q "MISSING_LISTING_ID" dealer-platform/autoscout-link.js
          grep -q "Apri annuncio AutoScout24" dealer-platform/autoscout-safety.js
          grep -q "autoscout-safety.js" dealer-platform/config.js
          grep -q "autoscout-safety.js" dealer-platform/sw.js
          grep -q "autoscout_published_at" dealer-platform/supabase/migrations/0009_autoscout_v11.sql
      - name: Instagram invariants
        run: |
          grep -q "content_type" dealer-platform/instagram.js
          grep -q "SCHEDULED" dealer-platform/instagram.js
          grep -q "Genera caption auto" dealer-platform/instagram.js
          grep -q "instagram_posts_member_select" dealer-platform/supabase/migrations/0010_instagram_v12.sql
          grep -q "instagram_manage" dealer-platform/supabase/migrations/0010_instagram_v12.sql
          grep -q "instagram.js" dealer-platform/sw.js
      - name: Report invariants
        run: |
          grep -q "CAPITALE INVESTITO" dealer-platform/reports.js
          grep -q "Stock + spese" dealer-platform/reports.js
          grep -q "Vendite + margini" dealer-platform/reports.js
          grep -q "Ageing stock" dealer-platform/reports.js
          grep -q "Stampa / PDF" dealer-platform/reports.js
          grep -q "Esporta CSV" dealer-platform/reports.js
          grep -q "A4 landscape" dealer-platform/reports.js
          grep -q "reports.js" dealer-platform/sw.js
      - name: Admin invariants
        run: |
          grep -q "admin_manage" dealer-platform/admin.js
          grep -q "force_password_change" dealer-platform/worker/admin.js
          grep -q "temporaryPassword" dealer-platform/worker/admin.js
          grep -q "cannot_demote_or_suspend_self" dealer-platform/worker/admin.js
          grep -q "last_admin_required" dealer-platform/worker/admin.js
          grep -q "SERVICE KEY SOLO SERVER" dealer-platform/admin.js
          grep -q "handleAdminRoute" dealer-platform/worker/index.js
          grep -q "admin.js" dealer-platform/sw.js
      - name: Backup invariants
        run: |
          grep -q "MALU23_DEALER_BACKUP" dealer-platform/backup-core.js
          grep -q "backup_wrong_dealer" dealer-platform/backup-core.js
          grep -q "mergeForRestore" dealer-platform/backup.js
          grep -q "document_blobs" dealer-platform/backup-core.js
          grep -q "mutations" dealer-platform/backup-core.js
          grep -q "backup.js" dealer-platform/sw.js

