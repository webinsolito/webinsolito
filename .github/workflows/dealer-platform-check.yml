name: Dealer Platform Check

on:
  pull_request:
    paths:
      - 'dealer-platform/**'
      - '.github/workflows/dealer-platform-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check dealer-platform/app.js
          node --check dealer-platform/today-priority.js
          node --check dealer-platform/delivery-readiness.js
          node --check dealer-platform/client-followup.js
          node --check dealer-platform/api.js
          node --check dealer-platform/offline.js
          node --check dealer-platform/clients.js
          node --check dealer-platform/calendar.js
          node --check dealer-platform/documents.js
          node --check dealer-platform/contracts.js
          node --check dealer-platform/invoices.js
          node --check dealer-platform/sales.js
          node --check dealer-platform/finances.js
          node --check dealer-platform/sw.js
          node --check dealer-platform/worker/index.js
          node --check dealer-platform/worker/setup-telegram.mjs
      - name: Focused unit tests
        run: node --test dealer-platform/tests/*.test.mjs
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('dealer-platform/manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Secret guard
        run: |
          ! grep -R -E "(sk_live_|sb_secret_|service_role[^A-Za-z0-9]*[:=][^A-Za-z0-9]*(eyJ|[A-Za-z0-9_-]{30,}))" dealer-platform --exclude='*.md' --exclude='*.example' || (echo 'Possible committed secret' && exit 1)
      - name: Required offline assets
        run: |
          test -f dealer-platform/index.html
          test -f dealer-platform/offline.js
          test -f dealer-platform/sw.js
          test -f dealer-platform/today-priority.js
          test -f dealer-platform/delivery-readiness.js
          test -f dealer-platform/client-followup.js
          test -f dealer-platform/clients.js
          test -f dealer-platform/calendar.js
          test -f dealer-platform/documents.js
          test -f dealer-platform/contracts.js
          test -f dealer-platform/invoices.js
          test -f dealer-platform/sales.js
          test -f dealer-platform/finances.js
          test -f dealer-platform/worker/index.js
      - name: Contract invariants
        run: |
          grep -q "snapshot_hash" dealer-platform/contracts.js
          grep -q "guard_contract_version_immutable" dealer-platform/supabase/migrations/0006_contracts_v07.sql
          grep -q "contract_versions" dealer-platform/offline.js
      - name: Invoice invariants
        run: |
          grep -q "payment_status" dealer-platform/invoices.js
          grep -q "vehicle_cost_id" dealer-platform/invoices.js
          grep -q "invoices_member_select" dealer-platform/supabase/migrations/0007_invoices_v08.sql
          grep -q "with check" dealer-platform/supabase/migrations/0007_invoices_v08.sql
          grep -q "'invoices'" dealer-platform/offline.js
      - name: Sales invariants
        run: |
          grep -q "sale_stage" dealer-platform/sales.js
          grep -q "financing_status" dealer-platform/sales.js
          grep -q "trade_in" dealer-platform/sales.js
          grep -q "planned_delivery_at" dealer-platform/sales.js
          grep -q "contracts_sale_invoice_fk" dealer-platform/supabase/migrations/0008_sales_v09.sql
          grep -q "CONSEGNATA" dealer-platform/sales.js
      - name: Finance invariants
        run: |
          grep -q "CAPITALE STOCK" dealer-platform/finances.js
          grep -q "MARGINE GESTIONALE" dealer-platform/finances.js
          grep -q "DA INCASSARE" dealer-platform/finances.js
          grep -q "view_costs" dealer-platform/finances.js
          grep -q "vehicle_costs" dealer-platform/finances.js
