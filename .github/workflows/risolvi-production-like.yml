name: RISOLVI production-like integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/risolvi-api/**'
      - '.github/workflows/risolvi-production-like.yml'

permissions:
  contents: read

jobs:
  production-like:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/risolvi-api
    env:
      RISOLVI_IMAGE: webinsolito-risolvi-api:production-like
      RISOLVI_NETWORK: risolvi-ci
      POSTGRES_USER: risolvi
      POSTGRES_PASSWORD: risolvi-ci-db-password
      POSTGRES_DB: risolvi
      MINIO_ROOT_USER: risolvi-ci-access
      MINIO_ROOT_PASSWORD: risolvi-ci-storage-password
      RISOLVI_BUCKET: risolvi-private
      RISOLVI_CAPABILITY_SECRET: ci-capability-secret-0123456789abcdef0123456789abcdef
      RISOLVI_REVIEWER_ID: rev-ci
      RISOLVI_REVIEWER_TOKEN: ci-reviewer-token-0123456789abcdef0123456789abcdef
      MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
      MINIO_MC_IMAGE: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/risolvi-api/pyproject.toml

      - name: Install smoke/readiness client dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build exact production candidate
        run: |
          docker build \
            --build-arg RISOLVI_BUILD_SHA="$GITHUB_SHA" \
            -t "$RISOLVI_IMAGE" .

      - name: Start disposable private dependencies
        run: |
          set -euo pipefail
          docker network create "$RISOLVI_NETWORK"

          docker run -d --name risolvi-postgres --network "$RISOLVI_NETWORK" \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            postgres:16-alpine

          docker run -d --name risolvi-minio --network "$RISOLVI_NETWORK" \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            "$MINIO_IMAGE" \
            server /data

          docker run -d --name risolvi-clamav --network "$RISOLVI_NETWORK" \
            clamav/clamav:stable

      - name: Wait for PostgreSQL, S3 and ClamAV
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if docker exec risolvi-postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs risolvi-postgres
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 60); do
            if docker run --rm --network "$RISOLVI_NETWORK" \
              --entrypoint /bin/sh \
              "$MINIO_MC_IMAGE" \
              -c "mc alias set ci http://risolvi-minio:9000 '$MINIO_ROOT_USER' '$MINIO_ROOT_PASSWORD' >/dev/null && mc admin info ci >/dev/null"; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs risolvi-minio
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 90); do
            if docker exec risolvi-clamav clamdscan --ping 1 >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs risolvi-clamav
              exit 1
            fi
            sleep 2
          done

      - name: Create private disposable bucket
        run: |
          set -euo pipefail
          docker run --rm --network "$RISOLVI_NETWORK" \
            --entrypoint /bin/sh \
            "$MINIO_MC_IMAGE" \
            -c "mc alias set ci http://risolvi-minio:9000 '$MINIO_ROOT_USER' '$MINIO_ROOT_PASSWORD' >/dev/null && mc mb --ignore-existing ci/$RISOLVI_BUCKET >/dev/null && mc anonymous set none ci/$RISOLVI_BUCKET >/dev/null"

      - name: Apply Alembic migrations against PostgreSQL
        run: |
          set -euo pipefail
          docker run --rm --network "$RISOLVI_NETWORK" \
            -e RISOLVI_MIGRATION_DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@risolvi-postgres:5432/$POSTGRES_DB" \
            "$RISOLVI_IMAGE" \
            alembic upgrade head

      - name: Production preflight with intake closed
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts
          docker run --rm --network "$RISOLVI_NETWORK" \
            -e RISOLVI_ENV=production \
            -e RISOLVI_AUTO_CREATE_SCHEMA=false \
            -e RISOLVI_PILOT_ENABLED=true \
            -e RISOLVI_PILOT_INTAKE_ENABLED=false \
            -e RISOLVI_CAPABILITY_SECRET="$RISOLVI_CAPABILITY_SECRET" \
            -e RISOLVI_REVIEWER_CREDENTIALS_JSON="{\"$RISOLVI_REVIEWER_ID\":\"$RISOLVI_REVIEWER_TOKEN\"}" \
            -e RISOLVI_DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@risolvi-postgres:5432/$POSTGRES_DB" \
            -e RISOLVI_STORAGE_BACKEND=s3 \
            -e RISOLVI_S3_BUCKET="$RISOLVI_BUCKET" \
            -e RISOLVI_S3_REGION=us-east-1 \
            -e RISOLVI_S3_ENDPOINT_URL=http://risolvi-minio:9000 \
            -e RISOLVI_S3_FORCE_PATH_STYLE=true \
            -e AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER" \
            -e AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD" \
            -e RISOLVI_MALWARE_SCANNER=clamav \
            -e RISOLVI_CLAMAV_HOST=risolvi-clamav \
            -e RISOLVI_CLAMAV_PORT=3310 \
            "$RISOLVI_IMAGE" \
            python -m app.preflight \
            > .ci-artifacts/preflight.json

      - name: Start API in production mode for synthetic smoke only
        run: |
          set -euo pipefail
          docker run -d --name risolvi-api --network "$RISOLVI_NETWORK" -p 8000:8000 \
            -e RISOLVI_ENV=production \
            -e RISOLVI_AUTO_CREATE_SCHEMA=false \
            -e RISOLVI_PILOT_ENABLED=true \
            -e RISOLVI_PILOT_INTAKE_ENABLED=true \
            -e RISOLVI_CAPABILITY_SECRET="$RISOLVI_CAPABILITY_SECRET" \
            -e RISOLVI_REVIEWER_CREDENTIALS_JSON="{\"$RISOLVI_REVIEWER_ID\":\"$RISOLVI_REVIEWER_TOKEN\"}" \
            -e RISOLVI_DATABASE_URL="postgresql+psycopg://$POSTGRES_USER:$POSTGRES_PASSWORD@risolvi-postgres:5432/$POSTGRES_DB" \
            -e RISOLVI_STORAGE_BACKEND=s3 \
            -e RISOLVI_S3_BUCKET="$RISOLVI_BUCKET" \
            -e RISOLVI_S3_REGION=us-east-1 \
            -e RISOLVI_S3_ENDPOINT_URL=http://risolvi-minio:9000 \
            -e RISOLVI_S3_FORCE_PATH_STYLE=true \
            -e AWS_ACCESS_KEY_ID="$MINIO_ROOT_USER" \
            -e AWS_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD" \
            -e RISOLVI_MALWARE_SCANNER=clamav \
            -e RISOLVI_CLAMAV_HOST=risolvi-clamav \
            -e RISOLVI_CLAMAV_PORT=3310 \
            "$RISOLVI_IMAGE"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs risolvi-api
              exit 1
            fi
            sleep 2
          done

      - name: Run destructive synthetic smoke
        env:
          RISOLVI_SMOKE_BASE_URL: http://127.0.0.1:8000
          RISOLVI_SMOKE_REVIEWER_ID: ${{ env.RISOLVI_REVIEWER_ID }}
          RISOLVI_SMOKE_REVIEWER_SECRET: ${{ env.RISOLVI_REVIEWER_TOKEN }}
        run: |
          set -euo pipefail
          python -m app.remote_smoke --output .ci-artifacts/smoke.json >/dev/null

      - name: Verify case blob cleanup in S3-compatible storage
        run: |
          set -euo pipefail
          remaining="$({ docker run --rm --network "$RISOLVI_NETWORK" \
            --entrypoint /bin/sh \
            "$MINIO_MC_IMAGE" \
            -c "mc alias set ci http://risolvi-minio:9000 '$MINIO_ROOT_USER' '$MINIO_ROOT_PASSWORD' >/dev/null && mc ls --recursive ci/$RISOLVI_BUCKET"; } | sed '/^[[:space:]]*$/d' | wc -l)"
          if [ "$remaining" -ne 0 ]; then
            echo "Synthetic smoke left objects in private storage" >&2
            exit 1
          fi
          printf '{"kind":"storage_cleanup","status":"ok","remaining_objects":0}\n' > .ci-artifacts/storage-cleanup.json

      - name: Aggregate readiness and require fail-closed NO-GO
        run: |
          set -euo pipefail
          set +e
          python -m app.pilot_readiness \
            --preflight .ci-artifacts/preflight.json \
            --smoke .ci-artifacts/smoke.json \
            --evidence ci/readiness-evidence.production-like.json \
            --json-out .ci-artifacts/readiness.json \
            --markdown-out .ci-artifacts/readiness.md \
            >/dev/null
          readiness_exit=$?
          set -e
          if [ "$readiness_exit" -ne 1 ]; then
            echo "Disposable stack must remain NO-GO because manual gates are UNKNOWN" >&2
            exit 1
          fi

          python -m app.production_like_evidence \
            --preflight .ci-artifacts/preflight.json \
            --smoke .ci-artifacts/smoke.json \
            --readiness .ci-artifacts/readiness.json \
            --expected-commit "$GITHUB_SHA"

      - name: Assert normalized artifacts contain no runtime credentials
        run: |
          set -euo pipefail
          for value in \
            "$RISOLVI_CAPABILITY_SECRET" \
            "$RISOLVI_REVIEWER_TOKEN" \
            "$POSTGRES_PASSWORD" \
            "$MINIO_ROOT_PASSWORD"; do
            if grep -R -F -q "$value" .ci-artifacts; then
              echo "A normalized CI artifact contains runtime credential material" >&2
              exit 1
            fi
          done

      - name: Upload normalized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risolvi-production-like-evidence-${{ github.run_id }}
          path: services/risolvi-api/.ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup disposable stack
        if: always()
        run: |
          docker rm -f risolvi-api risolvi-clamav risolvi-minio risolvi-postgres >/dev/null 2>&1 || true
          docker network rm "$RISOLVI_NETWORK" >/dev/null 2>&1 || true
