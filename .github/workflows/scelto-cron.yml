name: SCELTO H24 Monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scelto-h24-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body \
            --retry 2 --retry-delay 2 --retry-connrefused \
            --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=scelto-cron")"
          TOKEN="$(printf '%s' "$RESPONSE" | jq -er '.value | select(type == "string" and length > 0)')"
          echo "::add-mask::${TOKEN}"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run due SCELTO missions
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body -X POST \
            --retry 3 --retry-delay 4 --retry-connrefused \
            --retry-max-time 160 --connect-timeout 10 --max-time 45 \
            'https://scelto-app-production.up.railway.app/cron/github' \
            -H "Authorization: Bearer ${OIDC_TOKEN}")"
          if ! printf '%s' "$RESPONSE" | jq -e '
            type == "object" and .ok == true and
            (.checked | type == "number") and
            (.alerts | type == "number") and
            (.found | type == "number") and
            (.failed == null or (.failed | type == "number")) and
            ((.failed // 0) == 0)
          ' >/dev/null; then
            echo '::error::SCELTO ha restituito una risposta non valida oppure errori nel controllo delle ricerche.'
            exit 1
          fi
          if ! printf '%s' "$RESPONSE" | jq -e '(.failed | type) == "number"' >/dev/null; then
            echo '::warning::Il backend SCELTO non espone ancora failed: i fallimenti parziali non sono verificabili finché non viene pubblicata la versione aggiornata.'
          fi
          SUMMARY="$(printf '%s' "$RESPONSE" | jq -c '{ok, checked, alerts, found, failed: (.failed // "non_esposto"), source}')"
          printf 'SCELTO_MONITOR %s\n' "$SUMMARY"
          printf '### SCELTO monitor\n\n%s\n' "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
