name: AutoBuddy Candidate QA

on:
  pull_request:
    paths:
      - "autobuddy/**"
      - "automation/autobuddy/**"
      - "tests/e2e/autobuddy-backup-recovery.spec.js"
      - ".github/workflows/autobuddy-candidate-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autobuddy-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install

      - name: Backup guard unit/regression tests
        run: |
          node automation/autobuddy/test_backup_guard.cjs
          node automation/autobuddy/test_backup_types.cjs
          node automation/autobuddy/test_backup_recovery_extra.cjs

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Serve candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/autobuddy-http.log 2>&1 &
          sleep 2

      - name: Browser backup/recovery flow — desktop and iPhone
        run: npx playwright test tests/e2e/autobuddy-backup-recovery.spec.js --project=desktop-chromium --project=iphone

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: autobuddy-candidate-qa-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
