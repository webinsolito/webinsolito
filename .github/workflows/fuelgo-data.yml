name: Update FuelGo data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuelgo-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main before generating data
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and normalize MIMIT fuel data
        run: python automation/fuelgo/update_fuel.py

      - name: Commit changed feed safely
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- fuelgo/data; then
            echo "FuelGo feed unchanged"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main changed while FuelGo was generating data. Aborting safely; rerun manually."
            exit 1
          fi
          git config user.name "webinsolito-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A fuelgo/data
          git commit -m "chore(fuelgo): refresh MIMIT fuel prices [skip ci]"
          git push origin HEAD:main
