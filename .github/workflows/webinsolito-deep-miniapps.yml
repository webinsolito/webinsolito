name: WEBINSOLITO Deep Mini App QA
on:
  pull_request:
    paths:
      - "tests/e2e/miniapps-extended-20261022.spec.js"
      - ".github/workflows/webinsolito-deep-miniapps.yml"
      - "autobuddy/**"
      - "splitly/**"
      - "docpocket/**"
      - "screensort/**"
      - "packr/**"
      - "frigochef/**"
      - "fuelgo/**"
      - "parkmemo/**"
      - "carcost/**"
      - "fuel-saver/**"
      - "tripcost/**"
      - "stylematch/**"
      - "safebuy/**"
      - "bresciago/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webinsolito-miniapps-deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout existing WEBINSOLITO code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Playwright from project
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: Serve app source without modifying published data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/webinsolito-deep-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
      - name: 14-app deep browser test on desktop Chromium and iPhone WebKit
        run: npx playwright test tests/e2e/miniapps-extended-20261022.spec.js --project=desktop-chromium --project=iphone --retries=0
      - name: Preserve failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webinsolito-14-app-extended-audit
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
