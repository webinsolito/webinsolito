name: Webinsolito H24 Autopilot

on:
  workflow_dispatch:
concurrency:
  group: webinsolito-h24-autopilot
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  copilot-requests: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  director:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: H24 director
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const PREFIX = '[H24 AUTOPILOT]';
            const BASE = 'candidate/h24-autopilot';
            const STALE_HOURS = 6;

            const info = (m) => core.info('[H24] ' + m);

            async function listActiveIssues() {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', per_page: 100
              });
              return items.filter(i => !i.pull_request && i.title && i.title.startsWith(PREFIX));
            }

            async function listAgentPRs() {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: BASE, per_page: 100
              });
              return prs.filter(p => p.user && p.user.login === 'copilot-swe-agent[bot]');
            }

            async function commentOnce(issueNumber, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100
              });
              if (comments.some(c => (c.body || '').includes(marker))) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: marker + '\n' + body
              });
            }

            async function assignCopilot(issueNumber) {
              const customInstructions =
                'Use the repository custom agent webinsolito-director. ' +
                'Work ONLY from and back into candidate/h24-autopilot. ' +
                'Never target main. Read .github/AUTOPILOT_MISSION.md. ' +
                'Perform exactly one coherent improvement, run real tests, provide visual evidence when applicable, ' +
                'and include Fixes #' + issueNumber + ' in the PR body.';

              const payload = {
                owner, repo, issue_number: issueNumber,
                assignees: ['copilot-swe-agent[bot]'],
                agent_assignment: {
                  target_repo: owner + '/' + repo,
                  base_branch: BASE,
                  custom_instructions: customInstructions,
                  custom_agent: 'webinsolito-director'
                },
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };

              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', payload);
                info('Assigned issue #' + issueNumber + ' to Copilot with Webinsolito Director.');
                return true;
              } catch (firstError) {
                core.warning('Custom-agent assignment failed: ' + firstError.message);
                try {
                  const fallback = { ...payload };
                  fallback.agent_assignment = {
                    target_repo: owner + '/' + repo,
                    base_branch: BASE,
                    custom_instructions: customInstructions
                  };
                  await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', fallback);
                  info('Assigned issue #' + issueNumber + ' to Copilot without custom-agent selector.');
                  return true;
                } catch (secondError) {
                  core.warning('Copilot assignment failed: ' + secondError.message);
                  await commentOnce(
                    issueNumber,
                    '<!-- h24-copilot-assignment-failed -->',
                    '**H24 controller:** automatic coding-agent assignment failed.\n\n' +
                    'The orchestration is installed, but GitHub Copilot cloud agent must be enabled for this account/repository ' +
                    '(paid Copilot plan required by GitHub). The controller will retry on a later cycle.\n\n' +
                    'Error: `' + String(secondError.message).replace(/`/g, '') + '`'
                  );
                  return false;
                }
              }
            }

            let agentPRs = await listAgentPRs();

            if (agentPRs.length) {
              const pr = agentPRs.sort((a,b) => new Date(a.created_at) - new Date(b.created_at))[0];
              info('Inspecting agent PR #' + pr.number);

              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100
              });

              const runs = checks.data.check_runs || [];

              if (!runs.length) {
                info('No check runs yet. Waiting; no merge.');
                return;
              }

              const pending = runs.filter(r => r.status !== 'completed');
              if (pending.length) {
                info('Checks still running: ' + pending.map(r => r.name).join(', '));
                return;
              }

              const bad = runs.filter(r => !['success','neutral','skipped'].includes(r.conclusion));
              if (bad.length) {
                await commentOnce(
                  pr.number,
                  '<!-- h24-repair-request -->',
                  '@copilot The H24 director found failing checks: **' +
                  bad.map(r => r.name + ' (' + r.conclusion + ')').join(', ') +
                  '**. Please inspect the failures, make the smallest graphics-only correction allowed by ' +
                  '`.github/AUTOPILOT_MISSION.md`, rerun tests, and do not target `main`.'
                );
                info('Failing checks found; repair requested. No merge.');
                return;
              }

              const fresh = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });

              if (fresh.data.mergeable !== true) {
                await commentOnce(
                  pr.number,
                  '<!-- h24-merge-conflict -->',
                  '@copilot The H24 director cannot safely merge this PR into `' + BASE +
                  '` because GitHub does not currently report it as cleanly mergeable. Please resolve/rebase without changing scope.'
                );
                info('PR is not cleanly mergeable. No merge.');
                return;
              }

              const merged = await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number,
                merge_method: 'squash',
                commit_title: 'H24 candidate: ' + pr.title
              });

              if (!merged.data.merged) {
                core.warning('GitHub declined merge: ' + merged.data.message);
                return;
              }

              info('Merged PR #' + pr.number + ' into ' + BASE + ' (never main).');

              const activeAfterMerge = await listActiveIssues();
              for (const issue of activeAfterMerge) {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
              }
            }

            let active = await listActiveIssues();

            if (active.length) {
              const issue = active.sort((a,b) => new Date(a.created_at) - new Date(b.created_at))[0];
              const hasCopilot = (issue.assignees || []).some(a => a.login === 'copilot-swe-agent[bot]');

              if (!hasCopilot) {
                info('Open H24 issue is not assigned to Copilot; retrying assignment.');
                await assignCopilot(issue.number);
                return;
              }

              const ageHours = (Date.now() - new Date(issue.updated_at).getTime()) / 3600000;

              if (ageHours < STALE_HOURS) {
                info('Task #' + issue.number + ' is active. No parallel task created.');
                return;
              }

              const prsNow = await listAgentPRs();
              if (prsNow.length) {
                info('Old issue still has an open agent PR. Waiting.');
                return;
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '**H24 watchdog:** no pull request appeared for more than ' + STALE_HOURS +
                      ' hours. Closing this stalled cycle so the next hourly cycle can retry with a fresh task.'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              info('Closed stale H24 task #' + issue.number + '.');
            }

            const missionFile = await github.rest.repos.getContent({
              owner, repo, path: '.github/AUTOPILOT_MISSION.md', ref: 'main'
            });

            const mission = Buffer.from(missionFile.data.content, 'base64').toString('utf8').slice(0, 14000);
            const stamp = new Date().toISOString().replace(/:\d\d\.\d\d\dZ$/, 'Z');

            const body =
              '## H24 autonomous cycle\n\n' +
              'You are working on **one** autonomous improvement cycle for Webinsolito.\n\n' +
              '**Base/target branch:** `' + BASE + '`\n' +
              '**Production main:** DO NOT MODIFY OR TARGET.\n\n' +
              'Read the mission below, inspect the real current candidate, choose the single highest-impact improvement ' +
              'inside the allowed scope, implement it, run real tests, compare rendered results, and open one PR back to `' + BASE + '`.\n\n' +
              'The PR body must include `Fixes #<this issue number>`.\n\n' +
              'If you cannot verify a claim, say NOT TESTED. If the visual result is not clearly better, iterate or revert before opening the PR.\n\n' +
              '---\n\n' + mission;

            const created = await github.rest.issues.create({
              owner, repo,
              title: PREFIX + ' ' + stamp + ' — one graphics improvement',
              body
            });

            info('Created task #' + created.data.number);
            await assignCopilot(created.data.number);
