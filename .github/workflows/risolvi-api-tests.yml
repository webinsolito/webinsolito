name: RISOLVI API tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/risolvi-api/**'
      - '.github/workflows/risolvi-api-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risolvi-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
