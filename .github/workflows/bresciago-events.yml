name: Update BresciaGo events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "automation/bresciago/**"
      - ".github/workflows/bresciago-events.yml"

permissions:
  contents: write

concurrency:
  group: bresciago-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: pip install -r automation/bresciago/requirements.txt

      - name: Collect and validate events
        run: python automation/bresciago/update_events.py

      - name: Commit changed feed
        run: |
          if git diff --quiet -- bresciago/data/events.json; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "webinsolito-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bresciago/data/events.json
          git commit -m "chore(bresciago): refresh automatic events [skip ci]"
          git push
