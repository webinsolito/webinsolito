name: Dealer Platform PR Check

on:
  pull_request:
    paths:
      - 'dealer-platform/**'
      - '.github/workflows/dealer-platform-pr-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: find dealer-platform -maxdepth 2 -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Unit and regression tests
        run: node --test dealer-platform/tests/*.test.mjs
      - name: Manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('dealer-platform/manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Operational and sale lifecycle invariants
        run: |
          test -f dealer-platform/operational-quality.js
          test -f dealer-platform/mobile-shell.js
          test -f dealer-platform/sale-safety.js
          test -f dealer-platform/sync-conflict.js
          test -f dealer-platform/sync-recovery.js
          test -f dealer-platform/PRE_RELEASE_CHECKLIST.md
          test -f dealer-platform/supabase/migrations/0016_operational_quality_v193.sql
          test -f dealer-platform/supabase/migrations/0017_sale_terminal_lock_v194.sql
          test -f dealer-platform/supabase/migrations/0018_publish_photo_gate_v197.sql
          test -f dealer-platform/supabase/migrations/0019_contract_status_terminal_v197.sql
          grep -q "version: '1.9.8'" dealer-platform/config.js
          grep -q "data-quality.js?v=1.9.7" dealer-platform/config.js
          grep -q "operational-quality.js?v=1.9.7" dealer-platform/config.js
          grep -q "mobile-shell.js?v=1.9.6" dealer-platform/config.js
          grep -q "daily-ux.js?v=1.9.6" dealer-platform/config.js
          grep -q "sale-safety.js?v=1.9.8" dealer-platform/config.js
          grep -q "sync-recovery.js?v=1.9.6" dealer-platform/config.js
          grep -q "session-security.js?v=1.9.6" dealer-platform/config.js
          grep -q "dealer-platform-v1.9.8-static-only" dealer-platform/sw.js
          grep -q "sale-safety.js?v=1.9.8" dealer-platform/sw.js
          grep -q "data-quality.js?v=1.9.7" dealer-platform/sw.js
          grep -q "operational-quality.js?v=1.9.7" dealer-platform/sw.js
          grep -q "mobile-shell.js?v=1.9.6" dealer-platform/sw.js
          grep -q "daily-ux.js?v=1.9.6" dealer-platform/sw.js
          grep -q "sync-recovery.js?v=1.9.6" dealer-platform/sw.js
          grep -q "session-security.js?v=1.9.6" dealer-platform/sw.js
          grep -q "sync-conflict.js?v=1.9.5" dealer-platform/sw.js
          grep -q "vehicles_active_plate_unique" dealer-platform/supabase/migrations/0016_operational_quality_v193.sql
          grep -q "vehicles_active_vin_unique" dealer-platform/supabase/migrations/0016_operational_quality_v193.sql
          grep -q "vehicle_costs_amount_positive" dealer-platform/supabase/migrations/0016_operational_quality_v193.sql
          grep -q "sale_delivered_terminal" dealer-platform/supabase/migrations/0017_sale_terminal_lock_v194.sql
          grep -q "sale_contract_terms_locked" dealer-platform/supabase/migrations/0017_sale_terminal_lock_v194.sql
          grep -q "vehicle_delivered_terminal" dealer-platform/supabase/migrations/0017_sale_terminal_lock_v194.sql
          grep -q "vehicle_photo_required" dealer-platform/supabase/migrations/0018_publish_photo_gate_v197.sql
          grep -q "sale_contract_signed_terminal" dealer-platform/supabase/migrations/0019_contract_status_terminal_v197.sql
          grep -q "sale_contract_finalized_terminal" dealer-platform/supabase/migrations/0019_contract_status_terminal_v197.sql
          ! grep -q "dealer-platform-session" dealer-platform/preview.html
          ! grep -qi "supabase" dealer-platform/preview.html
          ! grep -q "indexedDB" dealer-platform/preview.html
          ! grep -q "serviceWorker" dealer-platform/preview.html
      - name: Secret guard
        run: |
          ! grep -R -E "(sk_live_|sb_secret_|service_role[^A-Za-z0-9]*[:=][^A-Za-z0-9]*(eyJ|[A-Za-z0-9_-]{30,}))" dealer-platform --exclude='*.md' --exclude='*.example' || (echo 'Possible committed secret' && exit 1)
