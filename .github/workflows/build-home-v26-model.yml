name: Build V26 premium GLB model only

on:
  push:
    branches:
      - candidate/model-v26-premium-one-at-a-time
    paths:
      - 'tools/build_home_v26_model.py'
      - '.github/workflows/build-home-v26-model.yml'

permissions:
  contents: write

env:
  PYOPENGL_PLATFORM: egl

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/model-v26-premium-one-at-a-time
          fetch-depth: 0

      - name: Install model toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "trimesh==4.11.1" \
            "numpy==2.2.6" \
            "shapely==2.1.2" \
            "mapbox-earcut==1.0.3" \
            "matplotlib==3.10.6"

      - name: Generate premium V26 GLB
        run: |
          python tools/build_home_v26_model.py

      - name: Validate binary and structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -c 4 assets/models/webinsolito-hero-v26.glb)" = "glTF"
          test "$(wc -c < assets/models/webinsolito-hero-v26.glb)" -gt 1000000
          python - <<'PY'
          import json, trimesh
          from pathlib import Path
          p=Path('assets/models/webinsolito-hero-v26.glb')
          s=trimesh.load(p, force='scene')
          names=set(s.graph.nodes_geometry)
          required={
              'globe_core','land_africa','land_europe','land_asia',
              'logo_W_gold','logo_star','axis_vertical','armillary_outer',
              'orbit_ring_01','orbit_ring_02','orbit_ring_03','orbit_ring_04',
              'planet_01','planet_02','planet_03','planet_04','planet_05'
          }
          missing=sorted(required-names)
          if missing:
              raise SystemExit('missing required 3D nodes: '+','.join(missing))
          faces=sum(len(g.faces) for g in s.geometry.values())
          if faces < 180000:
              raise SystemExit(f'face count too low: {faces}')
          m=json.loads(Path('assets/models/webinsolito-hero-v26.manifest.json').read_text())
          print('VALIDATED_BYTES', p.stat().st_size)
          print('VALIDATED_GEOMETRIES', len(s.geometry))
          print('VALIDATED_FACES', faces)
          print('VALIDATED_SHA256', m['sha256'])
          PY

      - name: Commit only the model outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "webinsolito-build"
          git config user.email "actions@users.noreply.github.com"
          git add assets/models/webinsolito-hero-v26.glb assets/models/webinsolito-hero-v26.manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(model): materialize detailed V26 premium GLB"
          git push origin HEAD:candidate/model-v26-premium-one-at-a-time

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: webinsolito-v26-premium-glb
          path: |
            assets/models/webinsolito-hero-v26.glb
            assets/models/webinsolito-hero-v26.manifest.json
          if-no-files-found: error
