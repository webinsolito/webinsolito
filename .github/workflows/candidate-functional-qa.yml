name: Candidate Functional QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-functional-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/webinsolito-http.log 2>&1 &
          echo $! > /tmp/webinsolito-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/webinsolito-http.log
          exit 1
      - name: Run Home premium visual preflight
        run: npx playwright test tests/e2e/home-visual-preflight.spec.js --project=desktop-chromium
      - name: Upload Home visual preflight screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-visual-preflight
          path: test-results/home-visual-preflight/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run FrigoChef mobile preflight
        run: npx playwright test tests/e2e/frigochef-finalization.spec.js --project=iphone --grep "mobile has no horizontal overflow"
      - name: Run Splitly backup preflight
        run: npx playwright test tests/e2e/splitly-finalization.spec.js --project=desktop-chromium --project=iphone --grep "malicious backup"
      - name: Run DocPocket async security preflight
        run: npx playwright test tests/e2e/docpocket-sync-preflight.spec.js --project=desktop-chromium --project=iphone
      - name: Run ScreenSort forged-image security preflight
        run: npx playwright test tests/e2e/screensort-finalization.spec.js --project=desktop-chromium --project=iphone --grep "forged image"
      - name: Run Playwright regression suite
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
