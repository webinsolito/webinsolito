name: Functional QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'candidate/**']
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.json"
      - "**/*.svg"
      - "tests/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/functional-qa.yml"
  push:
    branches: [main, 'candidate/**']
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.json"
      - "**/*.svg"
      - "tests/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/functional-qa.yml"

concurrency:
  group: functional-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Build 200-app structural audit
        run: node scripts/quality-audit.mjs
      - name: Measure rebuilt static assets
        run: node scripts/performance-after.mjs
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/webinsolito-http.log 2>&1 &
          echo $! > /tmp/webinsolito-http.pid
          sleep 2
      - name: Run functional browser tests
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-qa-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload home visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-visual-${{ github.run_id }}
          path: |
            test-results/home-visual-before-desktop.png
            test-results/home-visual-after-desktop.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload quality rebuild artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-rebuild-artifacts-${{ github.run_id }}
          path: |
            quality-artifacts/**
            test-results/quality-baseline/**
            test-results/quality-after/**
          if-no-files-found: warn
          retention-days: 7
