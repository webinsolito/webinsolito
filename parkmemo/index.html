<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1C1D20"><link rel="manifest" href="manifest.json"><title>ParkMemo</title><style>:root{--d:#1C1D20;--p:#D3A500;--bg:#f4f6f9;--text:#18212d;--muted:#718096;--line:#e2e8f0;--card:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--d) 0 220px,var(--bg) 220px);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:auto;padding:16px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#e8eef5}.top a{color:inherit;text-decoration:none}.badge{font-size:11px;border:1px solid #ffffff2b;border-radius:99px;padding:7px 10px}.hero{color:#fff;padding:28px 2px 26px}.hero h1{font-size:40px;letter-spacing:-1.5px;margin:8px 0}.hero p{margin:0;color:#c8d4df;line-height:1.5}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 13px;font-weight:800;color:#526173}.tab.on{background:var(--p);color:#fff;border-color:var(--p)}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #0b18270d}.stat{font-size:30px;font-weight:900;letter-spacing:-1px}.small{font-size:12px;color:var(--muted);line-height:1.45}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.f{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:#fbfcfd;outline:none}.f:focus{border-color:var(--p)}textarea.f{min-height:82px;resize:vertical}.btn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:12px 15px;font-weight:850;cursor:pointer}.btn.ghost{background:#eef2f6;color:#364152}.btn.danger{background:#ffe8e8;color:#a12828}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:12px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item b{display:block}.pill{display:inline-block;font-size:10px;font-weight:850;padding:5px 8px;border-radius:99px;background:#eef2f6;color:#536173}.empty{text-align:center;padding:28px;color:var(--muted)}.notice{background:#fff8db;border:1px solid #f0d67c;border-radius:16px;padding:12px 14px;color:#6b5712;font-size:12px;line-height:1.45;margin-bottom:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#edf3f7;border:1px solid #dce5ec;border-radius:99px;padding:7px 10px;font-size:12px}.progress{height:9px;border-radius:99px;background:#e9eef3;overflow:hidden}.progress>i{display:block;height:100%;background:var(--p)}@media(max-width:720px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.hero h1{font-size:34px}.item{align-items:flex-start;flex-direction:column}}</style><link rel="stylesheet" href="../assets/polish.css"><link rel="stylesheet" href="theme.css"></head><body><main class="app"><div class="top"><a href="../">← Webinsolito Apps</a><span class="badge">APP V1 · locale</span></div><section class="hero"><div style="font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#D3A500">Webinsolito</div><h1>ParkMemo</h1><p><b>Ricordati solo di guidare.</b><br>GPS, posto auto, scadenza, mappa e cronologia sul dispositivo.</p></section>
<nav class="tabs"><button class="tab on" data-tab="0">Parcheggio</button><button class="tab" data-tab="1">Cronologia</button></nav>
<section class="panel on" id="p0"><div class="card"><h2>Salva dove sei</h2><div class="form"><input class="f" id="note" placeholder="Es. P2, fila C, posto 18"><input class="f" id="until" type="datetime-local"><input class="f" id="address" placeholder="Via / riferimento (facoltativo)"><label class="f">Foto posto auto<input id="pic" type="file" accept="image/*" capture="environment" style="display:block;margin-top:8px"></label></div><div class="row" style="margin-top:10px"><button class="btn" id="gps">Salva con GPS</button><button class="btn ghost" id="manual">Salva senza GPS</button></div><div id="current" style="margin-top:12px"></div></div></section>
<section class="panel" id="p1"><div class="list" id="history"></div></section></main><script>
const K='parkmemo_v2';let S=JSON.parse(localStorage.getItem(K)||'{"current":null,"history":[]}');let picUrl='';const save=()=>{localStorage.setItem(K,JSON.stringify(S));render()},id=()=>Date.now()+Math.random(),esc=s=>(s||'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('p'+b.dataset.tab).classList.add('on')});
pic.onchange=()=>{const f=pic.files[0];if(f)picUrl=URL.createObjectURL(f)};
function make(lat,lng){return{id:id(),lat,lng,note:note.value.trim(),until:until.value,address:address.value.trim(),at:new Date().toISOString()}}
gps.onclick=()=>{if(!navigator.geolocation)return alert('GPS non disponibile');gps.disabled=true;navigator.geolocation.getCurrentPosition(p=>{S.current=make(p.coords.latitude,p.coords.longitude);S.history.unshift({...S.current});S.history=S.history.slice(0,30);gps.disabled=false;save()},e=>{gps.disabled=false;alert('Posizione non disponibile: '+e.message)},{enableHighAccuracy:true,timeout:10000})};
manual.onclick=()=>{S.current=make(null,null);S.history.unshift({...S.current});S.history=S.history.slice(0,30);save()};
function clearNow(){S.current=null;save()}function rem(i){S.history=S.history.filter(x=>x.id!=i);save()}
function fmtLeft(p){if(!p.until)return'Nessuna scadenza';const ms=new Date(p.until)-Date.now();if(ms<=0)return'Tempo scaduto';const m=Math.floor(ms/60000);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+' min'}
function card(p,cur=false){const map=p.lat!=null?'https://maps.apple.com/?ll='+p.lat+','+p.lng:'';return '<div class="item"><div><b>'+esc(p.note||p.address||'Parcheggio')+'</b><span class="small">'+esc(p.address)+' · '+fmtLeft(p)+'</span></div><div class="row">'+(map?'<a class="btn" style="text-decoration:none" target="_blank" href="'+map+'">Mappa</a>':'')+'<button class="btn danger" onclick="'+(cur?'clearNow()':'rem('+p.id+')')+'">×</button></div></div>'}
function render(){current.innerHTML=S.current?card(S.current,true):'<div class="empty">Nessun parcheggio attivo</div>';history.innerHTML=S.history.map(p=>card(p,false)).join('')||'<div class="empty">Cronologia vuota</div>'}render();setInterval(()=>{if(S.current)render()},30000);
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
