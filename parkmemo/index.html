<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c1d20"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>ParkMemo</title><style>
:root{--dark:#1c1d20;--yellow:#d3a500;--blue:#7ca8ff;--bg:#eef1f4;--ink:#202226;--muted:#78818d;--line:#dce1e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:390px 1fr}.control{padding:18px;background:#f5f6f7;overflow:auto;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:20px}.brand img{width:44px}.back{font-size:11px;color:#7b8490;text-decoration:none;display:inline-block;margin:13px 0}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:11px}.card h2,.card h3{margin:0 0 9px}.f{width:100%;border:1.5px solid var(--line);background:#fbfcfd;border-radius:12px;padding:10px 11px;outline:none;font:inherit;margin-bottom:8px}.f:focus{border-color:var(--yellow);box-shadow:0 0 0 4px #d3a50020}.btn{border:0;border-radius:13px;padding:11px 12px;font-weight:900;cursor:pointer}.btn.yellow{background:var(--yellow);color:#211b00}.btn.dark{background:var(--dark);color:#fff}.btn.soft{background:#e9edf1;color:#58616d}.btn.danger{background:#fae7e7;color:#9b3d3d}.big{width:100%;padding:17px;font-size:15px;margin-top:9px}.map{position:relative;background:#dfe5ea;min-height:100vh}.map iframe{width:100%;height:100vh;border:0;display:block}.mapEmpty{height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fff 0 4px,#d3a500 5px 13px,transparent 14px),linear-gradient(135deg,#dae1e8,#eef2f5);color:#7a8490;text-align:center;padding:30px}.timer{font-size:34px;font-weight:950;letter-spacing:-1px}.small{font-size:10px;color:var(--muted);line-height:1.45}.photo{width:100%;height:150px;object-fit:cover;border-radius:14px;background:#e7ebef}.list{display:grid;gap:7px}.row{border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}.nav{display:flex;gap:7px;margin-top:12px}.nav button{border:0;background:#e7ebef;border-radius:99px;padding:9px 11px;font-weight:850;color:#66717e}.nav button.on{background:var(--dark);color:#fff}.panel{display:none}.panel.on{display:block}.mapActions{position:absolute;left:18px;right:18px;bottom:18px;display:flex;gap:9px;justify-content:center}.mapActions .btn{box-shadow:0 14px 34px #0003}.mobileNav{display:none}@media(max-width:850px){.app{display:block}.control{height:auto;min-height:52vh;padding:12px 12px 90px}.map{min-height:48vh}.map iframe,.mapEmpty{height:48vh;min-height:48vh}.nav{display:none}.mobileNav{display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#1c1d20ee;border-radius:17px;padding:7px;z-index:40;justify-content:space-around;backdrop-filter:blur(14px)}.mobileNav button{border:0;background:transparent;color:#a8adb5;font-size:10px;font-weight:850;padding:9px;border-radius:10px}.mobileNav button.on{background:#35373b;color:#fff}.mapActions{bottom:12px}}
</style></head><body><div class="app"><aside class="control"><div class="brand"><img src="logo.svg">ParkMemo</div><a class="back" href="../">← Webinsolito Apps</a><nav class="nav" id="nav"></nav><section class="panel on" data-panel="park"><div class="card"><h2>Ricorda questo posto</h2><input class="f" id="note" placeholder="Piano / fila / posto"><input class="f" id="address" placeholder="Indirizzo o riferimento (facoltativo)"><input class="f" id="until" type="datetime-local"><label class="f">Foto posto auto<input id="pic" type="file" accept="image/*" capture="environment" style="display:block;margin-top:6px"></label><button class="btn yellow big" onclick="saveWithGps()">SALVA POSIZIONE GPS</button><button class="btn soft" style="width:100%;margin-top:7px" onclick="saveManual()">Salva senza GPS</button></div><div id="activeCard"></div></section><section class="panel" data-panel="history"><div class="card"><h3>Cronologia</h3><div id="historyList" class="list"></div></div></section><section class="panel" data-panel="frequent"><div class="card"><h3>Parcheggi frequenti</h3><div class="small">Salva un parcheggio dalla cronologia come luogo frequente.</div><div id="frequentList" class="list" style="margin-top:9px"></div></div></section><section class="panel" data-panel="settings"><div class="card"><h3>Dati locali</h3><button class="btn soft" onclick="exportData()">Esporta JSON</button> <button class="btn danger" onclick="resetAll()">Azzera</button><p class="small">GPS e cronologia restano su questo dispositivo.</p></div></section></aside><main class="map" id="mapWrap"><div class="mapEmpty"><div><b>Nessun parcheggio attivo</b><br><span class="small">Salva la posizione per vedere la mappa.</span></div></div></main></div><nav class="mobileNav" id="mobileNav"></nav><script>
const KEY='parkmemo.v2',NAV=[['park','Parcheggio'],['history','Cronologia'],['frequent','Frequenti'],['settings','Impostazioni']];let S=load(),photoData='';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.version===2)return x}catch{}return{version:2,current:null,history:[],frequent:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}function uid(){return Date.now()+Math.floor(Math.random()*10000)}function esc(s){return(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
nav.innerHTML=NAV.map(x=>'<button data-go="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');mobileNav.innerHTML=nav.innerHTML;function go(p){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.dataset.panel===p));document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('on',x.dataset.go===p));render()}
pic.onchange=()=>{const f=pic.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function make(lat,lng){return{id:uid(),lat,lng,note:note.value.trim(),address:address.value.trim(),until:until.value,photo:photoData,at:new Date().toISOString()}}function commit(p){S.current=p;S.history.unshift({...p});S.history=S.history.slice(0,40);photoData='';pic.value='';save()}
function saveWithGps(){if(!navigator.geolocation)return alert('GPS non disponibile');navigator.geolocation.getCurrentPosition(p=>commit(make(p.coords.latitude,p.coords.longitude)),e=>alert('Posizione non disponibile: '+e.message),{enableHighAccuracy:true,timeout:10000})}function saveManual(){commit(make(null,null))}
function clearCurrent(){S.current=null;save()}function removeHistory(id){S.history=S.history.filter(x=>x.id!=id);save()}function addFrequent(id){const p=S.history.find(x=>x.id==id);if(!p)return;if(!S.frequent.some(x=>x.note===p.note&&x.address===p.address))S.frequent.push({id:uid(),note:p.note,address:p.address,lat:p.lat,lng:p.lng});save()}function useFrequent(id){const f=S.frequent.find(x=>x.id==id);if(!f)return;note.value=f.note;address.value=f.address;S.current={id:uid(),lat:f.lat,lng:f.lng,note:f.note,address:f.address,until:'',photo:'',at:new Date().toISOString()};S.history.unshift({...S.current});save();go('park')}
function timeLeft(p){if(!p?.until)return'Nessuna scadenza';const ms=new Date(p.until)-Date.now();if(ms<=0)return'Tempo scaduto';const m=Math.floor(ms/60000);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+' min'}
function mapHtml(p){if(!p||p.lat==null)return'<div class="mapEmpty"><div><b>'+(p?'Posizione salvata senza GPS':'Nessun parcheggio attivo')+'</b><br><span class="small">'+esc(p?.address||'Salva il GPS per vedere la mappa.')+'</span></div></div>';const d=.003,bb=[p.lng-d,p.lat-d,p.lng+d,p.lat+d].join('%2C'),src='https://www.openstreetmap.org/export/embed.html?bbox='+bb+'&layer=mapnik&marker='+p.lat+'%2C'+p.lng;return'<iframe loading="lazy" src="'+src+'" title="Mappa parcheggio"></iframe><div class="mapActions"><button class="btn dark" onclick="navigate()">PORTAMI ALL’AUTO</button><button class="btn yellow" onclick="sharePark()">Condividi</button></div>'}
function navigate(){const p=S.current;if(!p)return;if(p.lat!=null)window.open('https://maps.apple.com/?daddr='+p.lat+','+p.lng,'_blank');else if(p.address)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address),'_blank')}async function sharePark(){const p=S.current;if(!p)return;const text='Parcheggio: '+(p.note||p.address||'posizione salvata')+(p.lat!=null?' https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=18/'+p.lat+'/'+p.lng:'');if(navigator.share)try{await navigator.share({title:'ParkMemo',text})}catch{}else{await navigator.clipboard.writeText(text);alert('Posizione copiata')}}
function render(){mapWrap.innerHTML=mapHtml(S.current);if(S.current){const p=S.current;activeCard.innerHTML='<div class="card"><div class="timer">'+timeLeft(p)+'</div><div class="small">'+esc(p.note||'Parcheggio')+' · '+esc(p.address)+'</div>'+(p.photo?'<img class="photo" src="'+p.photo+'" style="margin-top:10px">':'')+'<button class="btn dark big" onclick="navigate()">PORTAMI ALL’AUTO</button><button class="btn danger" style="width:100%;margin-top:7px" onclick="clearCurrent()">Chiudi parcheggio</button></div>'}else activeCard.innerHTML='';historyList.innerHTML=S.history.map(p=>'<div class="row"><div><b>'+esc(p.note||p.address||'Parcheggio')+'</b><span class="small">'+new Date(p.at).toLocaleString('it-IT')+' · '+timeLeft(p)+'</span></div><div><button class="btn soft" onclick="addFrequent('+p.id+')">☆</button> <button class="btn danger" onclick="removeHistory('+p.id+')">×</button></div></div>').join('')||'<div class="small">Cronologia vuota</div>';frequentList.innerHTML=S.frequent.map(f=>'<div class="row"><div><b>'+esc(f.note||'Luogo')+'</b><span class="small">'+esc(f.address)+'</span></div><button class="btn yellow" onclick="useFrequent('+f.id+')">Usa</button></div>').join('')||'<div class="small">Nessun parcheggio frequente</div>'}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='parkmemo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function resetAll(){if(confirm('Cancellare tutta la cronologia?')){localStorage.removeItem(KEY);S=load();save()}}render();go('park');setInterval(()=>{if(S.current)render()},30000);
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(()=>{});}</script></body></html>
