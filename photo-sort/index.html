<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Raggruppa foto per mese usando la data del file e crea uno ZIP ordinato in cartelle, tutto nel browser."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/photo-sort/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>PhotoSort — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../documenti/">← Categoria</a></header><section class="hero"><h1>PhotoSort</h1><p>Raggruppa foto per mese usando la data del file e crea uno ZIP ordinato in cartelle, tutto nel browser.</p></section>
<section class="card"><div class="field"><label>Seleziona foto</label><input class="f" id="files" type="file" accept="image/*" multiple></div><div class="actions"><button class="btn primary" id="analyze">Analizza</button><button class="btn" id="zipbtn">Crea ZIP ordinato</button></div><div id="status" class="muted"></div><div id="list"></div></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/vendor/jszip.min.js"></script><script>
let fs=[];function groups(){const m={};fs.forEach(f=>{const d=new Date(f.lastModified||Date.now()),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');(m[k]??=[]).push(f)});return m}
analyze.onclick=()=>{fs=[...files.files];const g=groups();list.innerHTML=Object.entries(g).sort().map(([k,v])=>'<div class="row"><div><b>'+k+'</b><span>'+v.length+' foto</span></div></div>').join('');status.textContent=fs.length?fs.length+' foto pronte.':'Seleziona almeno una foto.'}
zipbtn.onclick=async()=>{if(!fs.length)analyze.click();if(!fs.length)return;status.textContent='Creazione ZIP…';const z=new JSZip(),g=groups();for(const [k,arr] of Object.entries(g))for(const f of arr)z.file(k+'/'+f.name,f);const blob=await z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},x=>status.textContent='Creazione ZIP '+Math.round(x.percent)+'%');const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='foto-ordinate.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);status.textContent='ZIP creato.'}
</script></body></html>
