<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Cifra una nota con una passphrase usando Web Crypto AES-GCM; nel browser viene salvato solo il contenuto cifrato."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/secure-notes/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>SecureNotes — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../documenti/">← Categoria</a></header><section class="hero"><h1>SecureNotes</h1><p>Cifra una nota con una passphrase usando Web Crypto AES-GCM; nel browser viene salvato solo il contenuto cifrato.</p></section>
<section class="card"><div class="field"><label>Passphrase</label><input class="f" id="pass" type="password" autocomplete="new-password"></div><div class="field"><label>Nota</label><textarea class="f" id="note" rows="12"></textarea></div><div class="actions"><button class="btn primary" id="save">Cifra e salva</button><button class="btn" id="open">Decifra</button><button class="btn danger" id="clear">Elimina nota cifrata</button></div><div id="status" class="muted"></div></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>
const KEY='secure-notes.v2',enc=new TextEncoder(),dec=new TextDecoder(),b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id), passEl=$('pass'), noteEl=$('note'), statusEl=$('status'), saveBtn=$('save'), openBtn=$('open'), clearBtn=$('clear');
async function deriveKey(p,s){const base=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
saveBtn.onclick=async()=>{if(!passEl.value||!noteEl.value){statusEl.textContent='Inserisci passphrase e nota.';return}try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await deriveKey(passEl.value,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(noteEl.value));localStorage.setItem(KEY,JSON.stringify({salt:b64(salt),iv:b64(iv),ct:b64(ct)}));noteEl.value='';statusEl.textContent='Nota cifrata e salvata su questo dispositivo.'}catch(e){statusEl.textContent='Impossibile cifrare la nota.'}}
openBtn.onclick=async()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x){statusEl.textContent='Nessuna nota cifrata salvata.';return}const salt=unb(x.salt),iv=unb(x.iv),k=await deriveKey(passEl.value,salt),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,unb(x.ct));noteEl.value=dec.decode(pt);statusEl.textContent='Nota decifrata.'}catch(e){statusEl.textContent='Passphrase errata o dati non validi.'}}
clearBtn.onclick=()=>{localStorage.removeItem(KEY);noteEl.value='';statusEl.textContent='Nota eliminata.'}
</script></body></html>
