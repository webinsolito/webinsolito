<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Controlla localmente il formato di IMEI o VIN e individua errori evidenti; non interroga banche dati esterne."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/serial-check/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>SerialCheck — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../shopping/">← Categoria</a></header><section class="hero"><h1>SerialCheck</h1><p>Controlla localmente il formato di IMEI o VIN e individua errori evidenti; non interroga banche dati esterne.</p></section>
<section class="card"><div class="field"><label>IMEI / VIN / seriale</label><input class="f" id="serial" autocomplete="off"></div><button class="btn primary" id="go">Controlla formato</button><div id="out" class="result"></div><p class="muted">Questo controllo non certifica autenticità, provenienza o stato del prodotto/veicolo.</p></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>
function luhn(s){let sum=0;for(let i=0;i<s.length;i++){let n=+s[i];if(i%2===1){n*=2;if(n>9)n-=9}sum+=n}return sum%10===0}
go.onclick=()=>{const s=serial.value.trim().toUpperCase().replace(/[\s-]/g,'');if(/^\d{15}$/.test(s))out.textContent='Formato IMEI: '+(luhn(s)?'checksum Luhn valido.':'checksum Luhn NON valido.');else if(/^[A-HJ-NPR-Z0-9]{17}$/.test(s))out.textContent='Formato VIN di 17 caratteri plausibile (I, O e Q esclusi). Non è una verifica su banca dati.';else if(/^[A-Z0-9]{6,40}$/.test(s))out.textContent='Seriale alfanumerico formalmente leggibile; non esiste un checksum universale per verificarlo.';else out.textContent='Formato non riconosciuto o contiene caratteri non previsti.'}
</script></body></html>
