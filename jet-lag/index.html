<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Calcola la differenza di fuso e un piano semplice di adattamento prima del viaggio."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/jet-lag/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>JetLag — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../viaggi/">← Categoria</a></header><section class="hero"><h1>JetLag</h1><p>Calcola la differenza di fuso e un piano semplice di adattamento prima del viaggio.</p></section>
<section class="card"><div class="grid"><div class="field"><label>Fuso partenza UTC</label><input class="f" id="from" type="number" min="-12" max="14" step="0.5" value="2"></div><div class="field"><label>Fuso destinazione UTC</label><input class="f" id="to" type="number" min="-12" max="14" step="0.5"></div><div class="field"><label>Giorni disponibili per adattarti</label><input class="f" id="days" type="number" min="0" max="14" value="3"></div></div><button class="btn primary" id="go">Crea piano</button><div id="out" class="result"></div></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>go.onclick=()=>{let diff=(+to.value||0)-(+from.value||0);if(diff>12)diff-=24;if(diff<-12)diff+=24;const dir=diff>0?'anticipa':'ritarda',shift=Math.min(Math.abs(diff),Math.max(0,+days.value||0));const now=new Date(),utc=now.getTime()+now.getTimezoneOffset()*60000,dest=new Date(utc+(+to.value||0)*3600000);out.textContent='Differenza: '+diff+' ore. Ora indicativa a destinazione: '+dest.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'. Nei giorni prima della partenza '+dir+' gradualmente sonno e pasti di circa '+(shift?Math.max(.5,shift/Math.max(1,+days.value||1)).toFixed(1):0)+' h al giorno, senza superare la differenza totale.'}</script></body></html>
