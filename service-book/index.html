<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Registro manutenzione auto con storico e prossimo intervento."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/service-book/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>ServiceBook — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg">ServiceBook</div><a href="../auto/">← Auto & mobilità</a></header><section class="hero"><div class="ey">AUTO & MOBILITÀ</div><h1>La manutenzione, in ordine.</h1><p>Salva gli interventi fatti e annota quando dovrai pensarci di nuovo.</p></section><div class="grid"><section class="card"><h2>Nuovo intervento</h2><div class="form"><div class="field"><label>Intervento</label><input class="f" id="title" placeholder="Es. Tagliando"></div><div class="field"><label>Data</label><input class="f" id="date" type="date"></div><div class="field"><label>Km</label><input class="f" id="km" type="number" min="0" max="2000000"></div><div class="field"><label>Costo €</label><input class="f" id="cost" type="number" min="0" max="100000" step=".01"></div><div class="field"><label>Prossima data</label><input class="f" id="nextDate" type="date"></div><div class="field"><label>Prossimi km</label><input class="f" id="nextKm" type="number" min="0" max="2000000"></div></div><div class="actions"><button class="btn green" onclick="addEntry()">Salva intervento</button><button class="btn soft" onclick="clearForm()">Pulisci campi</button></div><div id="error" class="note warn" hidden></div></section><aside class="card"><h2>Storico</h2><div id="list" class="list"></div><div class="actions"><button class="btn soft" onclick="exportData()">Esporta copia</button></div></aside></div><div class="footer"><a href="../auto/">Auto & mobilità</a></div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>const KEY='service-book.v1';let S=Webinsolito.store.get(KEY,{items:[]});function addEntry(){error.hidden=true;if(!title.value.trim()||!date.value){error.textContent='Inserisci almeno intervento e data.';error.hidden=false;return}const x={id:Date.now(),title:title.value.trim(),date:date.value,km:Webinsolito.n('km'),cost:Webinsolito.n('cost'),nextDate:nextDate.value,nextKm:Webinsolito.n('nextKm')};S.items.unshift(x);S.items=S.items.slice(0,100);Webinsolito.store.set(KEY,S);clearForm();render();Webinsolito.toast('Intervento salvato')}function clearForm(){title.value=date.value=km.value=cost.value=nextDate.value=nextKm.value='';error.hidden=true}function removeEntry(id){S.items=S.items.filter(x=>x.id!==id);Webinsolito.store.set(KEY,S);render()}function render(){list.innerHTML=S.items.length?S.items.map(x=>'<div class="row"><div><b>'+Webinsolito.esc(x.title)+'</b><span>'+Webinsolito.date(x.date)+(x.km?' · '+x.km.toLocaleString('it-IT')+' km':'')+(x.cost?' · '+Webinsolito.euro(x.cost):'')+'</span><span>'+(x.nextDate?'Prossima data: '+Webinsolito.date(x.nextDate):'')+(x.nextKm?' · '+x.nextKm.toLocaleString('it-IT')+' km':'')+'</span></div><button class="btn soft" onclick="removeEntry('+x.id+')">Togli</button></div>').join(''):'<div class="note">Nessun intervento salvato.</div>'}function exportData(){Webinsolito.download('servicebook.json',JSON.stringify(S,null,2))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
