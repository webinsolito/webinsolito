px #10223508}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:4px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.5px;background:#f2e5ce;color:#785623;margin-bottom:5px}.red{background:#f8e6e5;color:#a53835}.green{background:#e3f3eb;color:#2a6f57}.blue{background:#e7eef4;color:#294b69}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;font-weight:800}.primary{border:0;background:linear-gradient(145deg,#d4aa61,#b98942);color:#172534;box-shadow:0 9px 24px #b9894228}.toolbar{display:flex;gap:9px;margin-bottom:15px}.toolbar input,.toolbar select{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 12px}.toolbar input{flex:1}.vehicle{position:relative;overflow:hidden}.vehicle:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-45px;top:-55px;background:radial-gradient(circle,#b9873f22,transparent 70%)}.vehicle h3{margin:0 0 4px}.vehicle p{margin:0;color:var(--muted);font-size:12px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}.nums div{background:#f7f3eb;border-radius:11px;padding:9px}.nums small{display:block;font-size:8px;color:var(--muted)}.nums b{font-size:12px}.hidden{display:none!important}.mobilebar{display:none}.empty{padding:28px;border:1px dashed #d5c9b8;border-radius:16px;text-align:center;color:var(--muted)}@media(max-width:760px){.shell{display:block}.side{display:none}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 10px;align-items:center}.top .ey{display:none}.top h1{font-size:25px}.top p{font-size:11px}.status{padding:8px;font-size:0}.content{padding:8px 14px calc(92px + env(safe-area-inset-bottom))}.hero{padding:18px;align-items:flex-start}.hero strong{font-size:20px}.hero .pill{display:none}.g4,.g3,.g2{grid-template-columns:1fr 1fr}.metrics .card{padding:15px}.metric b{font-size:28px}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.vehicle{padding:15px}.mobilebar{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);bottom:0;left:0;right:0;background:#fffdfaf2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10}.mobilebar button{border:0;background:transparent;color:#6c7885;font-size:9px}.mobilebar span{display:block;font-size:19px;margin-bottom:2px}.mobilebar button.on{color:#9a6e2f;font-weight:900}.section{margin-top:22px}.desktopOnly{display:none}}@media(max-width:430px){.g4,.g3,.g2{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)!important}.row{align-items:flex-start}.row .btn{white-space:nowrap}.top p{max-width:240px}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><b>MALÙ23 CARS</b><small>powered by AUTOSALONE ONE</small></div><nav class="nav" id="nav"></nav><button class="new" onclick="toast('Nuova auto: flusso disponibile nella build Windows/PWA')">＋ NUOVA AUTO</button><div class="foot">● Preview V1.9.21 · UI reale corrente</div></aside><main class="main"><header class="top"><div><span class="ey">MALÙ23 CARS · AUTOSALONE ONE</span><h1 id="title">OGGI</h1><p id="sub">Cosa devi fare, cosa manca, qual è il prossimo passo.</p></div><button class="status"><i></i>Preview online</button></header><section class="content" id="content"></section></main></div><nav class="mobilebar" id="mobilebar"></nav><script>const V=[['today','⌂','OGGI'],['garage','🚗','GARAGE'],['clients','♙','CLIENTI'],['calendar','▦','CALENDARIO'],['autoscout','⌕','AUTOSCOUT'],['documents','▤','DOCUMENTI']];const cars=[{n:'BMW X1 sDrive18d',p:'GT123AB',s:'In vendita',i:'€ 21.850',v:'€ 26.900',m:'€ 5.050'},{n:'Audi A3 Sportback',p:'GH456CD',s:'In preparazione',i:'€ 18.420',v:'€ 23.500',m:'€ 5.080'},{n:'Fiat 500 Hybrid',p:'GK789EF',s:'Da fotografare',i:'€ 11.780',v:'€ 15.400',m:'€ 3.620'},{n:'Mercedes GLA 200d',p:'GL321ZX',s:'Prenotata',i:'€ 27.300',v:'€ 32.900',m:'€ 5.600'}];const clients=[['Marco Bianchi','BMW X1 · richiamare oggi alle 17:30','CALDO'],['Elena Rossi','Fiat 500 · prova su strada domani','APPUNTAMENTO'],['Luca Ferrari','Audi A3 · attende valutazione permuta','DA RICHIAMARE']];const tasks=[['Conferma riparazione paraurti','Audi A3 Sportback · oggi','URGENTE'],['Richiama Marco Bianchi','BMW X1 · 17:30','IMPORTANTE'],['Prepara documenti consegna','Mercedes GLA · domani','CONSEGNA']];function nav(){navEl=document.querySelector('#nav');mob=document.querySelector('#mobilebar');navEl.innerHTML=V.map(x=>`<button data-v="${x[0]}" onclick="show('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('');mob.innerHTML=V.map(x=>`<button data-v="${x[0]}" onclick="show('${x[0]}')"><span>${x[1]}</span>${x[2].slice(0,5)}</button>`).join('')}function active(v){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}function row(a){return `<div class="row"><div><span class="badge ${a[2]==='URGENTE'?'red':''}">${a[2]}</span><strong>${a[0]}</strong><small>${a[1]}</small></div><button class="btn" onclick="toast('Azione aperta nella build completa')">Apri</button></div>`}function garage(){return `<div class="toolbar"><input placeholder="Cerca targa, telaio, marca o modello"><select><option>Tutti gli stati</option><option>In vendita</option><option>In preparazione</option></select><button class="btn primary" onclick="toast('Nuova auto')">＋ Nuova auto</button></div><div class="grid g2">${cars.map(c=>`<article class="card vehicle" onclick="toast('${c.n}: scheda veicolo')"><span class="badge blue">${c.s}</span><h3>${c.n}</h3><p>${c.p} · 64.200 km</p><div class="nums"><div><small>INVESTITO</small><b>${c.i}</b></div><div><small>PREZZO</small><b>${c.v}</b></div><div><small>MARGINE</small><b>${c.m}</b></div></div></article>`).join('')}</div>`}function today(){return `<div class="hero"><div><small>MALÙ23 CARS · OPERATIVO</small><strong>La concessionaria, sotto controllo.</strong><p>Clienti, auto, consegne e scadenze in un unico posto.</p></div><span class="pill">● Sistema operativo</span></div><div class="grid g4 metrics"><div class="card metric"><small>URGENZE</small><b>1</b></div><div class="card metric"><small>CLIENTI DA RICHIAMARE</small><b>3</b></div><div class="card metric"><small>CONSEGNE 7 GIORNI</small><b>2</b></div><div class="card metric"><small>LAVORI APERTI</small><b>4</b></div></div><div class="section"><h2>Da fare adesso</h2><button class="btn">＋ Attività</button></div><div class="list">${tasks.map(row).join('')}</div><div class="section"><h2>Auto che richiedono attenzione</h2></div><div class="grid g2"><div class="card"><span class="badge">AGING</span><h3>BMW X1 sDrive18d</h3><p>43 giorni online · verifica prezzo AutoScout.</p></div><div class="card"><span class="badge">PREPARAZIONE</span><h3>Audi A3 Sportback</h3><p>2 lavori ancora aperti.</p></div></div>`}function simple(type){if(type==='clients')return `<div class="section"><h2>Clienti e prossimo passo</h2><button class="btn primary">＋ Nuovo cliente</button></div><div class="list">${clients.map(row).join('')}</div>`;if(type==='calendar')return `<div class="section"><h2>Attività e scadenze</h2><button class="btn primary">＋ Attività</button></div><div class="card"><h3>Oggi</h3><div class="list">${tasks.slice(0,2).map(row).join('')}</div></div><div class="card" style="margin-top:12px"><h3>Domani</h3>${row(tasks[2])}</div>`;if(type==='autoscout')return `<div class="section"><h2>AutoScout · prezzo e aging</h2></div><div class="grid g3">${cars.slice(0,3).map((c,i)=>`<div class="card vehicle"><span class="badge ${i?'blue':'red'}">${i?'PREZZO OK':'43 GIORNI ONLINE'}</span><h3>${c.n}</h3><p>${c.v} · margine ${c.m}</p><button class="btn" style="margin-top:14px">Apri analisi prezzo</button></div>`).join('')}</div>`;return `<div class="card"><span class="badge green">ARCHIVIO UNICO</span><h2>Documenti</h2><p style="color:var(--muted)">Libretto, identità, fatture e contratti collegati direttamente ad auto e clienti.</p></div><div class="section"><h2>Documenti recenti</h2></div><div class="list">${[['Carta circolazione BMW X1','BMW X1 · OCR confermato','CONFERMATO'],['Carta identità Marco Bianchi','Cliente · verificato','CONFERMATO'],['Fattura lavori Audi A3','Audi A3 · da verificare','DA VERIFICARE']].map(row).join('')}</div>`}const meta={today:['OGGI','Cosa devi fare, cosa manca, qual è il prossimo passo.'],garage:['GARAGE','Tutto lo stock, con il prossimo passo sempre visibile.'],clients:['CLIENTI','Contatti, interesse e prossimo passo senza CRM complicati.'],calendar:['CALENDARIO','Scadenze generate dal lavoro reale.'],autoscout:['AUTOSCOUT','Annunci, prezzo, aging e margine.'],documents:['DOCUMENTI','Un archivio unico collegato ad auto e clienti.']};function show(v){active(v);title.textContent=meta[v][0];sub.textContent=meta[v][1];content.innerHTML=v==='today'?today():v==='garage'?garage():simple(v);history.replaceState(null,'','#'+v)}function toast(t){let x=document.createElement('div');x.textContent=t;x.style='position:fixed;right:18px;bottom:90px;background:#132638;color:white;padding:12px 16px;border-radius:13px;z-index:50;box-shadow:0 15px 40px #0003;font-size:12px;font-weight:800';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}nav();show(location.hash.slice(1)&&V.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'today');</script></body></html>
