<style>html,body{margin:0;min-height:100%;background:#0d0d0e;color:#fff;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot div{text-align:center}.boot strong{display:block;font-size:18px}.boot small{display:block;color:#aaa;margin-top:6px}</style>
</head>
<body><div class="boot"><div><strong>MALÙ23 CARS</strong><small>Caricamento preview V1.17…</small></div></div>
<script>
(async()=>{
 try{
  const r=await fetch('./index.html?v=117-base',{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  let html=await r.text();
  const css=`
/* V1.17 — Dealer Command Center. One priority, then only the numbers that change a decision. */
.v117-marker{position:fixed;right:12px;top:12px;z-index:9999;background:#111113;color:#fff;border:1px solid #333338;border-radius:999px;padding:7px 10px;font:800 9px/1 Inter,system-ui;letter-spacing:.7px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.v117-command{margin:0 0 18px;display:grid;gap:10px}.v117-main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.8fr);gap:10px}.v117-priority,.v117-stock{border:1px solid #dedee2;border-radius:16px;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.045);padding:18px}.v117-priority{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#171719,#09090a);color:#fff;border-color:#2b2b2e}.v117-priority-copy{min-width:0}.v117-kicker{display:block;font-size:8.5px;font-weight:950;letter-spacing:1.35px;color:#ff555c;text-transform:uppercase}.v117-priority strong{display:block;font-size:20px;letter-spacing:-.45px;margin-top:5px}.v117-priority p,.v117-stock p{margin:5px 0 0;font-size:10px;line-height:1.45;color:#b9b9be}.v117-priority button{flex:0 0 auto;border:0;border-radius:11px;padding:11px 14px;background:#fff;color:#141416;font-size:10px;font-weight:900}.v117-stock-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.v117-stock-head small{font-size:8.5px;font-weight:950;letter-spacing:1.25px;color:#d51f27}.v117-stock-head button{border:0;background:transparent;color:#d51f27;font-size:10px;font-weight:900;padding:4px}.v117-stock-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:11px}.v117-stock-grid div{background:#f6f6f7;border-radius:11px;padding:9px 10px;min-width:0}.v117-stock-grid span{display:block;color:#77777d;font-size:8px;font-weight:850;letter-spacing:.55px;text-transform:uppercase}.v117-stock-grid b{display:block;margin-top:3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#212124}.v117-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.v117-action{position:relative;border:1px solid #e0e0e3;border-radius:13px;background:#fff;padding:12px 13px;text-align:left;min-height:74px;display:grid;grid-template-columns:1fr auto;gap:6px;align-content:center}.v117-action:hover{border-color:#c9c9cd;box-shadow:0 7px 18px rgba(0,0,0,.04)}.v117-action small{grid-column:1/2;color:#77777d;font-size:8px;font-weight:900;letter-spacing:.65px;text-transform:uppercase}.v117-action strong{grid-column:1/2;color:#242427;font-size:11px;line-height:1.3}.v117-action b{grid-column:2/3;grid-row:1/3;align-self:center;font-size:22px;color:#202024}.v117-action.is-alert b{color:#d51f27}.v117-action em{font-style:normal;position:absolute;right:9px;top:8px;min-width:17px;height:17px;border-radius:999px;background:#f1f1f3;color:#2b2b2e;display:grid;place-items:center;font-size:8px;font-weight:950}.v117-action.is-alert em{background:#fde8e9;color:#aa151b}.v117-clean{font-size:10px;color:#6f6f75;padding:2px 2px 0}.desktop-dashboard .grid.cols-4{margin-top:2px}.desktop-dashboard .empty{padding:12px 14px!important;text-align:left!important;border-radius:11px!important;min-height:0!important}.desktop-dashboard .section-title+ .empty{margin-bottom:3px}
.v117-mobile-stock{display:none}
@media(max-width:900px){.v117-main{grid-template-columns:1fr}.v117-actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){body{padding-bottom:calc(94px + env(safe-area-inset-bottom))!important}.content{padding-bottom:calc(128px + env(safe-area-inset-bottom))!important}.mobile-bottom-nav{z-index:70!important}.topbar{min-height:60px!important;padding:calc(6px + env(safe-area-inset-top)) 11px 6px!important}.page-heading{display:flex!important;align-items:center!important;gap:9px!important;min-width:0}.mobile-brand-lockup{width:84px!important;height:31px!important;margin:0!important;flex:0 0 auto;object-fit:contain!important}.topbar h1{font-size:17px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v117-marker{top:auto;bottom:calc(82px + env(safe-area-inset-bottom));right:8px;padding:5px 7px;font-size:7px}.v117-command{display:none}.v117-mobile-stock{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:11px 12px;border:1px solid #e0ddd6;border-radius:13px;background:#fff}.v117-mobile-stock div{min-width:0}.v117-mobile-stock small{display:block;color:#8a8580;font-size:8px;font-weight:900;letter-spacing:.75px}.v117-mobile-stock strong{display:block;color:#22262c;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v117-mobile-stock button{border:0;border-radius:10px;background:#171719;color:#fff;padding:9px 11px;font-size:9px;font-weight:900;flex:0 0 auto}.desktop-dashboard .empty{padding:11px 12px!important}}
`;
  const patch=`
(function(){
 let hydrating=false;
 const euro=n=>{try{return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n||0))}catch(_){return '€ '+Math.round(Number(n||0)).toLocaleString('it-IT')}};
 const actionButton=(label,count,view,alert=false)=>'<button class="v117-action '+(alert?'is-alert':'')+'" onclick="route(\''+view+'\')"><small>'+label+'</small><strong>'+((count||0)?'Richiede attenzione':'Tutto in ordine')+'</strong><b>›</b><em>'+Number(count||0)+'</em></button>';
 async function hydrate(){
  if(hydrating)return;
  const desk=document.querySelector('.desktop-dashboard'),mobile=document.querySelector('.mobile-home');
  if(!desk&&!mobile)return;
  hydrating=true;
  try{
   const [d,cars,clients]=await Promise.all([api('/api/dashboard'),api('/api/vehicles'),api('/api/clients')]);
   const s=d.summary||{};
   const stock=(cars||[]).filter(v=>v.status!=='CONSEGNATA');
   const invested=stock.reduce((a,v)=>a+Number(v.total_invested||0),0);
   const margin=stock.reduce((a,v)=>a+Number(v.margin||0),0);
   const noPhoto=stock.filter(v=>!v.cover_photo_id).length;
   const aging=stock.filter(v=>Number(v.days_in_stock||0)>=60).length;
   const lowMargin=stock.filter(v=>v.margin!=null&&Number(v.margin)<1500).length;
   const noNext=(clients||[]).filter(c=>!['CHIUSO','PERSO'].includes(c.status)&&!c.next_contact_date).length;
   let title='Tutto sotto controllo',desc='Nessuna urgenza aperta. Puoi lavorare su foto, clienti o stock.',cta='Apri Garage',view='garage';
   if(Number(s.urgent||0)>0){title=(s.urgent===1?'1 urgenza da chiudere':s.urgent+' urgenze da chiudere');desc='Parti da qui: MALÙ23 ti porta direttamente alle attività prioritarie.';cta='Vedi urgenze';view='today'}
   else if(Number(s.callbacks||0)>0){title=(s.callbacks===1?'1 cliente da richiamare':s.callbacks+' clienti da richiamare');desc='Il prossimo valore è nel follow-up: apri i richiami e chiudi il prossimo passo.';cta='Apri richiami';view='calendar'}
   else if(Number(s.deliveries||0)>0){title=(s.deliveries===1?'1 consegna nei prossimi 7 giorni':s.deliveries+' consegne nei prossimi 7 giorni');desc='Controlla checklist e documenti prima che diventino urgenze.';cta='Apri calendario';view='calendar'}
   else if(Number(s.works||0)>0){title=(s.works===1?'1 lavoro aperto sul parco':' '+s.works+' lavori aperti sul parco');desc='Porta le auto verso foto e pubblicazione senza perdere passaggi.';cta='Apri Garage';view='garage'}
   if(desk&&!desk.querySelector('.v117-command')){
    const box=document.createElement('section');box.className='v117-command';
    box.innerHTML='<div class="v117-main"><div class="v117-priority"><div class="v117-priority-copy"><small class="v117-kicker">DA FARE ORA</small><strong>'+title+'</strong><p>'+desc+'</p></div><button onclick="route(\''+view+'\')">'+cta+' →</button></div><div class="v117-stock"><div class="v117-stock-head"><small>CONTROLLO PARCO</small><button onclick="route(\'finance\')">Guadagni →</button></div><div class="v117-stock-grid"><div><span>Auto stock</span><b>'+stock.length+'</b></div><div><span>Investito</span><b>'+euro(invested)+'</b></div><div><span>Margine previsto</span><b>'+euro(margin)+'</b></div></div></div></div><div class="v117-actions">'+actionButton('RICHIAMI',s.callbacks,'calendar',Number(s.callbacks||0)>0)+actionButton('CONSEGNE',s.deliveries,'calendar',Number(s.deliveries||0)>0)+actionButton('AUTO DA CURARE',aging+lowMargin,'garage',(aging+lowMargin)>0)+actionButton('DOCUMENTI',Number(s.documents_review||0),'documents',Number(s.documents_review||0)>0)+'</div><div class="v117-clean">Controlli rapidi: '+noPhoto+' senza foto principale · '+aging+' ferme da 60+ giorni · '+lowMargin+' con margine sotto €1.500 · '+noNext+' clienti senza prossimo contatto.</div>';
    const strip=desk.querySelector('.malu-operating-strip'); if(strip)strip.insertAdjacentElement('afterend',box); else desk.prepend(box);
   }
   if(mobile&&!mobile.querySelector('.v117-mobile-stock')){
    const box=document.createElement('div');box.className='v117-mobile-stock';box.innerHTML='<div><small>PARCO AUTO · '+stock.length+' AUTO</small><strong>'+euro(invested)+' investiti · '+euro(margin)+' margine</strong></div><button onclick="route(\'garage\')">Garage</button>';
    const focus=mobile.querySelector('.mobile-focus'); if(focus)focus.insertAdjacentElement('afterend',box); else mobile.prepend(box);
   }
  }catch(e){console.warn('V1.17 dashboard pulse',e)}finally{hydrating=false}
 }
 const apply=()=>{
  if(!document.querySelector('.v117-marker')){const m=document.createElement('div');m.className='v117-marker';m.textContent='DEMO V1.17';document.body.appendChild(m)}
  hydrate();
 };
 new MutationObserver(()=>requestAnimationFrame(apply)).observe(document.documentElement,{childList:true,subtree:true});
 setTimeout(apply,100);setTimeout(apply,600);setTimeout(apply,1600);
})();
`;
  html=html.replace(/V1\.15/g,'V1.17').replace(/1\.15\.0-malu23/g,'1.17.0-malu23');
  html=html.replace('</head>','<style>'+css+'</style></head>');
  html=html.replace('</body>','<script>'+patch.replace(/<\\\/script>/g,'<\\/script>')+'<\\/script></body>');
  document.open();document.write(html);document.close();
 }catch(e){document.body.innerHTML='<div class="boot"><div><strong>Preview V1.17 non caricata</strong><small>'+String(e.message||e)+'</small></div></div>'}
})();
</script></body></html>
