<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#34346e"><meta name="description" content="Timer di concentrazione con storico delle sessioni completate."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/study-timer/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>StudyTimer — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"><style>:root{--navy:#34346e;--green:#8f85ff;--blue:#8f85ff}.row>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg" alt="">StudyTimer</div><a href="../studio/">← Studio & produttività</a></header><section class="hero"><div class="ey">STUDIO & PRODUTTIVITÀ</div><h1>StudyTimer</h1><p>Timer di concentrazione con storico delle sessioni completate.</p></section>
<div class="grid"><section class="card"><h2>Sessione</h2><div class="big" id="clock">25:00</div><div id="state" class="status good" style="display:inline-block;margin-top:8px">Pronto</div><div class="form" style="margin-top:10px"><div class="field"><label>Minuti</label><input class="f" id="custom" type="number" min="1" max="180" value="25"></div></div><div class="actions"><button class="btn green" onclick="start()">Avvia</button><button class="btn soft" onclick="pause()">Pausa</button><button class="btn soft" onclick="reset()">Reset</button><button class="btn primary" onclick="custom.value=50;setMin(50)">50 min</button></div></section><aside class="card"><h2>Progressi</h2><div class="result"><div class="metric"><span>Oggi</span><b id="today">0 min</b></div><div class="metric"><span>Ultimi 7 giorni</span><b id="week">0 min</b></div><div class="metric"><span>Sessioni</span><b id="sessions">0</b></div></div></aside></div><section class="card" style="margin-top:12px"><h2>Ultime sessioni</h2><div id="list" class="list"></div></section><div class="footer"><a href="../studio/">Studio & produttività</a> · dati salvati solo nel browser</div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>
const K='studytimer.v1',$=id=>document.getElementById(id);let S=Webinsolito.store.get(K,{history:[]}),timer=null,left=25*60,running=false;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setMin(m){if(running)return;left=Math.max(1,m)*60;$('clock').textContent=fmt(left)}
function start(){if(running)return;running=true;$('state').textContent='In corso';timer=setInterval(()=>{left--;$('clock').textContent=fmt(left);if(left<=0){clearInterval(timer);running=false;const min=Math.max(1,+$('custom').value||25);S.history.unshift({at:new Date().toISOString(),min});S.history=S.history.slice(0,30);Webinsolito.store.set(K,S);Webinsolito.toast('Sessione completata');reset();render()}},1000)}
function pause(){clearInterval(timer);running=false;$('state').textContent='In pausa'}
function reset(){clearInterval(timer);running=false;const m=Math.max(1,+$('custom').value||25);left=m*60;$('clock').textContent=fmt(left);$('state').textContent='Pronto'}
function render(){const today=new Date().toISOString().slice(0,10),todayMin=S.history.filter(x=>x.at.slice(0,10)===today).reduce((t,x)=>t+x.min,0),week=S.history.filter(x=>Date.now()-new Date(x.at).getTime()<7*86400000).reduce((t,x)=>t+x.min,0);$('today').textContent=todayMin+' min';$('week').textContent=week+' min';$('sessions').textContent=S.history.length;$('list').innerHTML=S.history.length?S.history.slice(0,8).map(x=>'<div class="row"><div><b>'+x.min+' minuti</b><span>'+new Date(x.at).toLocaleString('it-IT')+'</span></div></div>').join(''):'<div class="note">Completa una sessione per vedere lo storico.</div>'}
$('custom').onchange=()=>setMin(Math.max(1,+$('custom').value||25));reset();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
