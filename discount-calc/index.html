<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Calcola sconti percentuali, coupon fissi e prezzo finale."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/discount-calc/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>DiscountCalc — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg">DiscountCalc</div><a href="../soldi/">← Soldi & risparmio</a></header><section class="hero"><div class="ey">SOLDI & RISPARMIO</div><h1>Quanto paghi davvero dopo lo sconto?</h1><p>Percentuale, coupon fisso e quantità: il prezzo finale è immediato.</p></section><div class="grid"><section class="card"><h2>Prezzo e sconto</h2><div class="form"><div class="field"><label>Prezzo iniziale €</label><input class="f" id="price" type="number" min="0" max="10000000" step=".01"></div><div class="field"><label>Sconto %</label><input class="f" id="discount" type="number" min="0" max="100" step=".1" value="0"></div><div class="field"><label>Coupon fisso €</label><input class="f" id="coupon" type="number" min="0" max="1000000" step=".01" value="0"></div><div class="field"><label>Quantità</label><input class="f" id="qty" type="number" min="1" max="10000" step="1" value="1"></div></div><div class="actions"><button class="btn green" onclick="calc()">Calcola</button><button class="btn soft" onclick="resetAll()">Reset</button></div><div id="error" class="note warn" hidden></div></section><aside class="card"><h2>Risultato</h2><div class="result"><div class="metric"><span>Prezzo / pezzo</span><b id="unitFinal">—</b></div><div class="metric"><span>Totale finale</span><b id="totalFinal">—</b></div><div class="metric"><span>Risparmio totale</span><b id="saving">—</b></div><div class="metric"><span>Sconto effettivo</span><b id="effective">—</b></div></div></aside></div><div class="footer"><a href="../soldi/">Soldi & risparmio</a></div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>function calc(){error.hidden=true;const p=+price.value,d=+discount.value||0,c=Math.max(0,+coupon.value||0),q=Math.floor(+qty.value||0);if(!(p>0)||d<0||d>100||q<1){error.textContent='Controlla prezzo, sconto e quantità.';error.hidden=false;return}const discounted=p*(1-d/100),u=Math.max(0,discounted-c),tot=u*q,orig=p*q,s=orig-tot;unitFinal.textContent=Webinsolito.euro(u);totalFinal.textContent=Webinsolito.euro(tot);saving.textContent=Webinsolito.euro(s);effective.textContent=(s/orig*100).toFixed(1)+'%'}function resetAll(){price.value='';discount.value=coupon.value=0;qty.value=1;unitFinal.textContent=totalFinal.textContent=saving.textContent=effective.textContent='—';error.hidden=true};if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
