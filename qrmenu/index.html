<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Crea un piccolo menu digitale e genera un QR code locale che contiene il testo del menu."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/qrmenu/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>QRMenu — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../business/">← Categoria</a></header><section class="hero"><h1>QRMenu</h1><p>Crea un piccolo menu digitale e genera un QR code locale che contiene il testo del menu.</p></section>
<div class="grid"><section class="card"><div class="field"><label>Nome locale/menu</label><input class="f" id="title"></div><div class="field"><label>Piatti e prezzi</label><textarea class="f" id="items" rows="10" placeholder="Margherita — 7 €"></textarea></div><div class="field"><label>Note / allergeni</label><textarea class="f" id="notes"></textarea></div><button class="btn primary" id="go">Crea menu e QR</button><div id="err" class="muted"></div></section><section class="card"><textarea class="f" id="out" rows="12" readonly></textarea><div id="qr" style="max-width:280px;margin:16px auto;background:#fff;padding:12px;border-radius:14px"></div><button class="btn" id="copy">Copia testo</button></section></div><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/vendor/qrcode.min.js"></script><script>
go.onclick=()=>{err.textContent='';const t=[title.value.trim(),items.value.trim(),notes.value.trim()?'NOTE / ALLERGENI\n'+notes.value.trim():''].filter(Boolean).join('\n\n');out.value=t;qr.innerHTML='';if(!t)return;try{new QRCode(qr,{text:t,width:240,height:240,correctLevel:QRCode.CorrectLevel.L})}catch(e){err.textContent='Il menu è troppo lungo per un singolo QR. Accorcialo oppure usa un link a un menu online.'}}
copy.onclick=()=>navigator.clipboard?.writeText(out.value)
</script></body></html>
