</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg" alt="">WEBINSOLITO</div></header><section class="hero"><div class="ey">Gratis · senza account obbligatorio</div><h1>Dimmi cosa devi fare.</h1><p>Scrivilo come ti viene. Webinsolito prova a capire il problema e ti porta allo strumento giusto.</p><div class="searchBox"><div class="searchShell"><span class="searchIcon" aria-hidden="true">⌕</span><input id="globalSearch" class="search" autocomplete="off" aria-label="Cerca uno strumento" placeholder="Es. parto una settimana, devo cambiare casa…"></div><div id="searchResults" class="results" role="listbox" aria-live="polite"></div></div></section><section id="categoryGrid" class="cats" aria-label="Categorie Webinsolito"></section><footer class="footer">Webinsolito · veloce, gratuito, senza passaggi inutili</footer></main><script src="./assets/home-search.js"></script><script>

th)return;if(e.key==='ArrowDown'){e.preventDefault();cursor=(cursor+1)%links.length}if(e.key==='ArrowUp'){e.preventDefault();cursor=(cursor-1+links.length)%links.length}links.forEach((el,i)=>el.classList.toggle('active',i===cursor));if(e.key==='Enter'&&cursor>=0){e.preventDefault();links[cursor].click()}if(e.key==='Escape')closeResults()};document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))closeResults()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
