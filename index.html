<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Webinsolito: strumenti gratuiti per le piccole cose di ogni giorno."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/webinsolito-logo.svg"><title>Webinsolito</title><style>*{box-sizing:border-box}body{margin:0;background:#09111b;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:16px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:9px;align-items:center;font-weight:950}.brand img{width:42px}.top a{font-size:10px;color:#a7b4c2;text-decoration:none}.hero{padding:78px 0 38px}.ey{font-size:10px;color:#7cffb2;font-weight:900}.hero h1{font-size:clamp(54px,9vw,94px);line-height:.9;letter-spacing:-5px;margin:12px 0 18px}.hero p{font-size:18px;color:#a8b6c5;max-width:730px}.searchBox{max-width:700px;position:relative;margin-top:24px}.search{width:100%;padding:14px;background:#101a26;border:1px solid #2c3b4e;border-radius:15px;color:#fff}.results{display:none;position:absolute;top:52px;left:0;right:0;background:#0f1823;border:1px solid #2a394b;border-radius:15px;z-index:20}.results.on{display:block}.res{display:flex;gap:10px;padding:10px 12px;text-decoration:none;border-bottom:1px solid #1e2b3a}.res img{width:34px;height:34px;border-radius:9px}.res b{font-size:12px}.res span{display:block;font-size:9px;color:#8191a2}.head{margin:30px 0 12px}.head h2{font-size:28px;margin:0}.head p{font-size:10px;color:#8191a2}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.cat,.app{background:#101923;border:1px solid #243244;border-radius:21px;padding:15px;text-decoration:none}.cat{min-height:150px;background:linear-gradient(145deg,var(--c1),#0d1620)}.cat img,.app img{width:48px;height:48px;border-radius:14px}.cat h3,.app h3{font-size:17px;margin:12px 0 5px}.cat p,.app p{font-size:10px;color:#a7b4c2;line-height:1.4}.featured{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.app{min-height:155px;display:flex;flex-direction:column}.app b{margin-top:auto;font-size:10px;color:#7cffb2}.footer{margin-top:38px;border-top:1px solid #1d2836;padding-top:18px;font-size:10px;color:#718294}@media(max-width:850px){.cats{grid-template-columns:repeat(3,1fr)}.featured{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.cats{grid-template-columns:repeat(2,1fr)}.featured{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg">WEBINSOLITO</div><a href="./changelog.html">Novità</a></header><section class="hero"><div class="ey">GRATIS · NESSUN ACCOUNT</div><h1>Piccoli strumenti. Problemi risolti.</h1><p>Scegli una categoria oppure cerca direttamente ciò che ti serve.</p><div class="searchBox"><input id="globalSearch" class="search" placeholder="Cerca: benzina, revisione, documenti…"><div id="searchResults" class="results"></div></div></section><div class="head"><h2>Categorie</h2><p>Ogni categoria ha la sua pagina.</p></div><section id="categoryGrid" class="cats"></section><div class="head"><h2>In evidenza</h2><p>Pochi strumenti utili da aprire subito.</p></div><section id="featuredGrid" class="featured"></section><footer class="footer">Webinsolito · strumenti quotidiani gratuiti</footer></main><script>const slugMap={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'},esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[];fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);categoryGrid.innerHTML=x.categories.map(c=>'<a class="cat" style="--c1:'+c.colors[0]+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'"><h3>'+esc(c.name)+'</h3><p>'+esc(c.tagline)+'</p></a>').join('');featuredGrid.innerHTML=live.filter(a=>a.featured).slice(0,6).map(a=>'<a class="app" href="./'+a.path+'"><img src="./'+a.icon+'"><h3>'+esc(a.name)+'</h3><p>'+esc(a.description)+'</p><b>Apri →</b></a>').join('');globalSearch.oninput=()=>{const q=globalSearch.value.trim().toLowerCase();if(!q){searchResults.classList.remove('on');return}const r=live.filter(a=>(a.name+' '+a.description).toLowerCase().includes(q)).slice(0,7);searchResults.innerHTML=r.map(a=>'<a class="res" href="./'+a.path+'"><img src="./'+a.icon+'"><div><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div></a>').join('')||'<div class="res"><b>Nessun risultato</b></div>';searchResults.classList.add('on')}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
