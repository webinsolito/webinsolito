</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg" alt="">WEBINSOLITO</div></header><section class="hero"><div class="ey">Gratis · senza account obbligatorio</div><h1>Dimmi cosa devi fare.</h1><p>Scrivilo come ti viene. Webinsolito prova a capire il problema e ti porta allo strumento giusto.</p><div class="searchBox"><div class="searchShell"><span class="searchIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><input id="globalSearch" class="search" autocomplete="off" aria-label="Cerca uno strumento" placeholder="Es. parto una settimana, devo cambiare casa…"></div><div id="searchResults" class="results" role="listbox" aria-live="polite"></div></div></section><section id="categoryGrid" class="cats" aria-label="Categorie Webinsolito"></section><footer class="footer">Webinsolito · veloce, gratuito, senza passaggi inutili</footer></main><script src="./assets/home-search.js"></script><script>
const slugMap={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'},esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[],categories=[],cursor=-1,current=[];const input=document.getElementById('globalSearch'),results=document.getElementById('searchResults'),grid=document.getElementById('categoryGrid');function closeResults(){results.classList.remove('on');results.innerHTML='';cursor=-1;current=[]}function renderResults(query){current=WebinsolitoSearch.search(query,live,categories,9);cursor=-1;if(!query.trim()){closeResults();return}results.innerHTML=current.length?current.map((r,i)=>{if(r.type==='category'){const c=r.category;return '<a class="res" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>'}const a=r.app;return '<a class="res" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||'Strumento')+'</em></a>'}).join(''):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';results.classList.add('on')}fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{categories=x.categories;live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);grid.innerHTML=categories.map(c=>'<a class="cat" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><strong>'+esc(c.name)+'</strong></a>').join('');if(input.value.trim())renderResults(input.value)});input.oninput=()=>renderResults(input.value);input.onkeydown=e=>{const links=[...results.querySelectorAll('.res[href]')];if(!links.length)return;if(e.key==='ArrowDown'){e.preventDefault();cursor=(cursor+1)%links.length}if(e.key==='ArrowUp'){e.preventDefault();cursor=(cursor-1+links.length)%links.length}links.forEach((el,i)=>el.classList.toggle('active',i===cursor));if(e.key==='Enter'&&cursor>=0){e.preventDefault();links[cursor].click()}if(e.key==='Escape')closeResults()};document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))closeResults()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
