<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111b"><meta name="description" content="Webinsolito: strumenti gratuiti e veloci per risolvere cose concrete, senza account obbligatorio."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/webinsolito-logo.svg"><title>Webinsolito</title><style>
*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:#08111b;color:#f7f9fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:18px 20px 70px}.top{display:flex;align-items:center;min-height:48px}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:950;letter-spacing:.05em}.brand img{width:44px;height:44px}.hero{padding:54px 0 34px;max-width:820px}.ey{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#72eaa7}.hero h1{font-size:clamp(52px,7vw,76px);line-height:.92;letter-spacing:-4px;margin:10px 0 16px}.hero p{margin:0;color:#9eafbf;font-size:15px;line-height:1.5;max-width:610px}.searchBox{position:relative;max-width:720px;margin-top:24px}.searchShell{display:flex;align-items:center;gap:11px;border:1px solid #304256;background:#101b27;border-radius:18px;padding:0 16px;box-shadow:0 16px 48px #0002}.searchIcon{font-size:21px;color:#72eaa7}.search{width:100%;border:0;outline:0;background:transparent;color:#fff;padding:17px 0;font-size:16px}.search::placeholder{color:#718296}.results{display:none;position:absolute;top:64px;left:0;right:0;z-index:30;background:#0d1722;border:1px solid #304156;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px #0007}.results.on{display:block}.res{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;border-bottom:1px solid #1d2b3a}.res:last-child{border-bottom:0}.res:hover,.res.active{background:#142131}.res img{width:42px;height:42px;border-radius:12px}.resText{min-width:0;flex:1}.res b{font-size:13px}.res span{display:block;font-size:10px;color:#91a1b2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.res em{font-style:normal;font-size:9px;font-weight:850;color:#72eaa7;white-space:nowrap}.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.cat{height:180px;border:1px solid #293a4e;background:linear-gradient(145deg,#111d2a,#0b141e);border-radius:28px;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.16s ease;box-shadow:inset 0 1px #ffffff08}.cat:hover{transform:translateY(-3px);border-color:#45627d;box-shadow:0 18px 45px #0004,inset 0 1px #ffffff0c}.cat img{width:104px;height:104px;display:block}.cat strong{font-size:12px;line-height:1.1;letter-spacing:.055em;text-align:center;text-transform:uppercase}.footer{margin-top:42px;border-top:1px solid #1d2938;padding-top:18px;color:#6f8295;font-size:10px}@media(max-width:880px){.cats{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.wrap{padding:14px 14px 54px}.hero{padding:38px 0 25px}.hero h1{font-size:54px;letter-spacing:-3px}.hero p{font-size:14px}.searchBox{margin-top:20px}.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cat{height:154px;border-radius:22px}.cat img{width:88px;height:88px}.cat strong{font-size:10px}.footer{margin-top:30px}}@media(max-width:370px){.cat{height:146px}.cat img{width:82px;height:82px}}@media(prefers-reduced-motion:reduce){.cat{transition:none}.cat:hover{transform:none}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg" alt="">WEBINSOLITO</div></header><section class="hero"><div class="ey">Gratis · senza account obbligatorio</div><h1>Dimmi cosa devi fare.</h1><p>Scrivilo come ti viene. Webinsolito prova a capire il problema e ti porta allo strumento giusto.</p><div class="searchBox"><div class="searchShell"><span class="searchIcon" aria-hidden="true">⌕</span><input id="globalSearch" class="search" autocomplete="off" aria-label="Cerca uno strumento" placeholder="Es. parto una settimana, devo cambiare casa…"></div><div id="searchResults" class="results" role="listbox" aria-live="polite"></div></div></section><section id="categoryGrid" class="cats" aria-label="Categorie Webinsolito"></section><footer class="footer">Webinsolito · veloce, gratuito, senza passaggi inutili</footer></main><script src="./assets/home-search.js"></script><script>
const slugMap={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'},esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[],categories=[],cursor=-1,current=[];const input=document.getElementById('globalSearch'),results=document.getElementById('searchResults'),grid=document.getElementById('categoryGrid');function closeResults(){results.classList.remove('on');results.innerHTML='';cursor=-1;current=[]}function renderResults(query){current=WebinsolitoSearch.search(query,live,categories,9);cursor=-1;if(!query.trim()){closeResults();return}results.innerHTML=current.length?current.map((r,i)=>{if(r.type==='category'){const c=r.category;return '<a class="res" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>'}const a=r.app;return '<a class="res" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||'Strumento')+'</em></a>'}).join(''):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';results.classList.add('on')}fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{categories=x.categories;live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);grid.innerHTML=categories.map(c=>'<a class="cat" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><strong>'+esc(c.name)+'</strong></a>').join('');if(input.value.trim())renderResults(input.value)});input.oninput=()=>renderResults(input.value);input.onkeydown=e=>{const links=[...results.querySelectorAll('.res[href]')];if(!links.length)return;if(e.key==='ArrowDown'){e.preventDefault();cursor=(cursor+1)%links.length}if(e.key==='ArrowUp'){e.preventDefault();cursor=(cursor-1+links.length)%links.length}links.forEach((el,i)=>el.classList.toggle('active',i===cursor));if(e.key==='Enter'&&cursor>=0){e.preventDefault();links[cursor].click()}if(e.key==='Escape')closeResults()};document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))closeResults()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
