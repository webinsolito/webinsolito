<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Webinsolito: strumenti gratuiti e veloci per risolvere piccole cose di ogni giorno."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/webinsolito-logo.svg"><title>Webinsolito</title><style>*{box-sizing:border-box}body{margin:0;background:#09111b;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px 16px 70px}.top{display:flex;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:950;letter-spacing:.04em}.brand img{width:42px;height:42px}.hero{padding:90px 0 34px;max-width:850px}.hero h1{font-size:clamp(54px,9vw,96px);line-height:.9;letter-spacing:-5px;margin:0 0 20px}.hero p{font-size:18px;color:#a7b4c2;max-width:700px;line-height:1.5}.searchBox{max-width:720px;position:relative;margin-top:26px}.search{width:100%;padding:16px;background:#101a26;border:1px solid #2c3b4e;border-radius:16px;color:#fff;font-size:16px}.results{display:none;position:absolute;top:58px;left:0;right:0;background:#0f1823;border:1px solid #2a394b;border-radius:16px;z-index:20;overflow:hidden}.results.on{display:block}.res{display:flex;gap:10px;padding:12px;text-decoration:none;color:inherit;border-bottom:1px solid #1e2b3a}.res:last-child{border-bottom:0}.res img{width:36px;height:36px;border-radius:10px}.res b{font-size:13px}.res span{display:block;font-size:10px;color:#8191a2;margin-top:2px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}.cat{min-height:170px;padding:18px;border:1px solid #243244;border-radius:24px;text-decoration:none;color:inherit;background:linear-gradient(145deg,var(--c1),#0d1620);display:flex;flex-direction:column}.cat img{width:50px;height:50px;border-radius:14px}.cat h2{font-size:19px;margin:16px 0 7px}.cat p{font-size:11px;color:#b0bdca;line-height:1.45;margin:0}.cat b{margin-top:auto;padding-top:18px;font-size:11px;color:#fff}.footer{margin-top:42px;border-top:1px solid #1d2836;padding-top:18px;font-size:10px;color:#718294}@media(max-width:850px){.cats{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.cats{grid-template-columns:repeat(2,1fr)}.hero{padding-top:64px}.hero h1{letter-spacing:-3px}.cat{min-height:150px}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg" alt="">WEBINSOLITO</div></header><section class="hero"><h1>Ti serve qualcosa?<br>Trovala qui.</h1><p>Strumenti semplici e gratuiti per risparmiare tempo nelle cose di ogni giorno.</p><div class="searchBox"><input id="globalSearch" class="search" placeholder="Cerca quello che devi fare…"><div id="searchResults" class="results"></div></div></section><section id="categoryGrid" class="cats" aria-label="Categorie Webinsolito"></section><footer class="footer">Webinsolito · veloce, gratuito, senza passaggi inutili</footer></main><script>const slugMap={"auto":"auto","food":"food","money":"soldi","events":"eventi","docs":"documenti","home":"casa","travel":"viaggi","style":"persona","shopping":"shopping","territory":"territorio","business":"business","study":"studio"},esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[];fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);categoryGrid.innerHTML=x.categories.map(c=>'<a class="cat" style="--c1:'+c.colors[0]+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><h2>'+esc(c.name)+'</h2><p>'+esc(c.tagline)+'</p><b>Apri categoria →</b></a>').join('');globalSearch.oninput=()=>{const q=globalSearch.value.trim().toLowerCase();if(!q){searchResults.classList.remove('on');return}const r=live.filter(a=>(a.name+' '+a.description).toLowerCase().includes(q)).slice(0,10);searchResults.innerHTML=r.map(a=>'<a class="res" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div></a>').join('')||'<div class="res"><b>Nessun risultato</b></div>';searchResults.classList.add('on')}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});</script></body></html>
