<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111b"><meta name="description" content="Webinsolito: strumenti gratuiti e veloci per risolvere cose concrete, senza account obbligatorio."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/webinsolito-logo.svg"><title>Webinsolito</title><style>*{box-sizing:border-box}
:root{color-scheme:dark}

.searchIcon:after{content:"";position:absolute;width:7px;height:1.8px;border-radius:2px;background:#79dbbc;transform:rotate(45deg);left:10px;top:12px;transform-origin:left center}

.cat{--c1:#173a5e;--c2:#6fb7ff;position:relative;height:186px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid rgba(255,255,255,.09);border-radius:29px;background:linear-gradient(155deg,rgba(255,255,255,.058),rgba(255,255,255,.016));box-shadow:0 14px 34px rgba(0,0,0,.14),inset 0 1px rgba(255,255,255,.045);text-decoration:none;isolation:isolate;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}

.cat:nth-child(1){--c1:#173a5e;--c2:#6fb7ff}.cat:nth-child(2){--c1:#234a31;--c2:#f39a52}.cat:nth-child(3){--c1:#0f4b45;--c2:#68d6a3}.cat:nth-child(4){--c1:#41215f;--c2:#f153a7}.cat:nth-child(5){--c1:#243c72;--c2:#789bff}.cat:nth-child(6){--c1:#5a6048;--c2:#d8c99f}.cat:nth-child(7){--c1:#17627a;--c2:#71d5ef}.cat:nth-child(8){--c1:#62466f;--c2:#dcb8dc}.cat:nth-child(9){--c1:#4b3b00;--c2:#f3c640}.cat:nth-child(10){--c1:#245c45;--c2:#7cccec}.cat:nth-child(11){--c1:#162d4c;--c2:#648ed2}.cat:nth-child(12){--c1:#34346e;--c2:#8f85ff}
.cat img{width:124px;height:124px;display:block;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.27));transform:translateY(2px);transition:transform .16s ease,filter .16s ease}
.cat strong{position:relative;z-index:1;max-width:90%;font-size:13px;line-height:1.08;letter-spacing:.025em;text-align:center;text-transform:none;font-weight:880}

.cat:hover:before{opacity:.12;transform:translate(-50%,-53%) scale(1.05)}
.cat:hover img{transform:translateY(-2px) scale(1.025);filter:drop-shadow(0 15px 17px rgba(0,0,0,.30))}

 .cat{height:154px;border-radius:23px;gap:2px}.cat:after{border-radius:21px}.cat img{width:104px;height:104px}.cat strong{font-size:10.5px;line-height:1.12;letter-spacing:.012em}

@media(prefers-reduced-motion:reduce){.cat,.cat img,.cat:before,.searchShell,.res{transition:none}.cat:hover,.searchShell:focus-within{transform:none}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg" alt="">WEBINSOLITO</div></header><section class="hero"><div class="ey">Gratis · senza account obbligatorio</div><h1>Dimmi cosa devi fare.</h1><p>Scrivilo come ti viene. Webinsolito prova a capire il problema e ti porta allo strumento giusto.</p><div class="searchBox"><div class="searchShell"><span class="searchIcon" aria-hidden="true">⌕</span><input id="globalSearch" class="search" autocomplete="off" aria-label="Cerca uno strumento" placeholder="Es. parto una settimana, devo cambiare casa…"></div><div id="searchResults" class="results" role="listbox" aria-live="polite"></div></div></section><section id="categoryGrid" class="cats" aria-label="Categorie Webinsolito"></section><footer class="footer">Webinsolito · veloce, gratuito, senza passaggi inutili</footer></main><script src="./assets/home-search.js"></script><script>
const slugMap={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'},esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[],categories=[],cursor=-1,current=[];const input=document.getElementById('globalSearch'),results=document.getElementById('searchResults'),grid=document.getElementById('categoryGrid');function closeResults(){results.classList.remove('on');results.innerHTML='';cursor=-1;current=[]}function renderResults(query){current=WebinsolitoSearch.search(query,live,categories,9);cursor=-1;if(!query.trim()){closeResults();return}results.innerHTML=current.length?current.map((r,i)=>{if(r.type==='category'){const c=r.category;return '<a class="res" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>'}const a=r.app;return '<a class="res" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||'Strumento')+'</em></a>'}).join(''):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';results.classList.add('on')}fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{categories=x.categories;live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);grid.innerHTML=categories.map(c=>'<a class="cat" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><strong>'+esc(c.name)+'</strong></a>').join('');if(input.value.trim())renderResults(input.value)});input.oninput=()=>renderResults(input.value);input.onkeydown=e=>{const links=[...results.querySelectorAll('.res[href]')];if(!links.length)return;if(e.key==='ArrowDown'){e.preventDefault();cursor=(cursor+1)%links.length}if(e.key==='ArrowUp'){e.preventDefault();cursor=(cursor-1+links.length)%links.length}links.forEach((el,i)=>el.classList.toggle('active',i===cursor));if(e.key==='Enter'&&cursor>=0){e.preventDefault();links[cursor].click()}if(e.key==='Escape')closeResults()};document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))closeResults()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
