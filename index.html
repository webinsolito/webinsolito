const slugMap={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'},esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[],categories=[],cursor=-1,current=[];const input=document.getElementById('globalSearch'),results=document.getElementById('searchResults'),grid=document.getElementById('categoryGrid');function closeResults(){results.classList.remove('on');results.innerHTML='';input.setAttribute('aria-expanded','false');cursor=-1;current=[]}function renderResults(query){current=WebinsolitoSearch.search(query,live,categories,9);cursor=-1;if(!query.trim()){closeResults();return}results.innerHTML=current.length?current.map((r,i)=>{if(r.type==='category'){const c=r.category;return '<a class="res" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>'}const a=r.app;return '<a class="res" role="option" aria-selected="false" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||'Strumento')+'</em></a>'}).join(''):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';results.classList.add('on');input.setAttribute('aria-expanded','true')}
function bindDepth(){if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;grid.querySelectorAll('.cat').forEach(card=>{card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,dx=x-.5,dy=y-.5;card.style.setProperty('--rx',(-dy*8).toFixed(2)+'deg');card.style.setProperty('--ry',(dx*8).toFixed(2)+'deg');card.style.setProperty('--ix',(dx*8).toFixed(2)+'px');card.style.setProperty('--iy',(dy*5).toFixed(2)+'px');card.style.setProperty('--hx',(x*100).toFixed(1)+'%');card.style.setProperty('--hy',(y*100).toFixed(1)+'%');card.style.setProperty('--sx',(-dx*10).toFixed(1)+'px');card.style.setProperty('--sy',(18+dy*6).toFixed(1)+'px')});card.addEventListener('pointerleave',()=>['--rx','--ry','--ix','--iy','--sx'].forEach(v=>card.style.removeProperty(v)));card.addEventListener('pointerdown',()=>card.classList.add('is-pressed'));['pointerup','pointercancel','pointerleave'].forEach(ev=>card.addEventListener(ev,()=>card.classList.remove('is-pressed')))})}
fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{categories=x.categories;live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);grid.innerHTML=categories.map(c=>'<a class="cat" href="./'+slugMap[c.id]+'/"><span class="catArt"><img src="./'+c.icon+'" alt=""></span><strong>'+esc(c.name)+'</strong></a>').join('');bindDepth();if(input.value.trim())renderResults(input.value)});input.oninput=()=>renderResults(input.value);input.onkeydown=e=>{const links=[...results.querySelectorAll('.res[href]')];if(!links.length)return;if(e.key==='ArrowDown'){e.preventDefault();cursor=(cursor+1)%links.length}if(e.key==='ArrowUp'){e.preventDefault();cursor=(cursor-1+links.length)%links.length}links.forEach((el,i)=>{const active=i===cursor;el.classList.toggle('active',active);el.setAttribute('aria-selected',active?'true':'false')});if(e.key==='Enter'&&cursor>=0){e.preventDefault();links[cursor].click()}if(e.key==='Escape')closeResults()};document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))closeResults()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
