<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09111b"><meta name="description" content="Webinsolito: strumenti gratuiti e veloci per risolvere le cose di ogni giorno.">
<link rel="canonical" href="https://webinsolito.github.io/webinsolito/"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/webinsolito-logo.svg"><title>Webinsolito</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark}body{margin:0;background:#09111b;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:18px 20px 70px}.top{display:flex;align-items:center;min-height:50px}.brand{display:flex;align-items:center;gap:11px;font-weight:950;letter-spacing:.045em;font-size:14px}.brand img{width:46px;height:46px}.hero{max-width:880px;padding:42px 0 26px}.hero h1{font-size:clamp(48px,7.2vw,78px);line-height:.94;letter-spacing:-4px;margin:0 0 14px}.hero p{font-size:16px;color:#aebbc8;line-height:1.5;margin:0;max-width:680px}.searchBox{max-width:760px;position:relative;margin-top:23px}.searchShell{display:flex;align-items:center;gap:12px;background:#101a26;border:1px solid #314359;border-radius:18px;padding:0 16px;box-shadow:0 16px 48px rgba(0,0,0,.17)}.searchShell:focus-within{border-color:#5c7a99;box-shadow:0 0 0 3px rgba(124,255,178,.06),0 16px 48px rgba(0,0,0,.2)}.searchIcon{font-size:21px;color:#7cffb2}.search{width:100%;padding:16px 0;background:transparent;border:0;outline:0;color:#fff;font-size:16px}.search::placeholder{color:#718296}.results{display:none;position:absolute;top:62px;left:0;right:0;background:#0d1722;border:1px solid #304156;border-radius:18px;z-index:40;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.48)}.results.on{display:block}.res{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;border-bottom:1px solid #1d2b3a}.res:last-child{border-bottom:0}.res:hover,.res.active{background:#142131}.res img{width:42px;height:42px;border-radius:12px;flex:none}.resText{min-width:0;flex:1}.res b{font-size:13px}.res span{display:block;font-size:10px;color:#91a1b2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.res em{font-style:normal;font-size:9px;font-weight:800;color:#7cffb2;margin-left:auto;white-space:nowrap}.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.cat{position:relative;min-height:176px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .16s ease,border-color .16s ease,background .16s ease}.cat:before{content:"";position:absolute;right:-40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:var(--c2);opacity:.08;filter:blur(16px)}.cat:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c2) 42%,#405269);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}.iconWrap{width:116px;height:116px;display:grid;place-items:center;position:relative;z-index:1}.cat img{width:104px;height:104px;display:block;filter:drop-shadow(0 9px 14px rgba(0,0,0,.22))}.catName{font-size:18px;font-weight:950;text-align:center;line-height:1;position:relative;z-index:1}.footer{margin-top:38px;border-top:1px solid #1d2938;padding-top:18px;font-size:10px;color:#718294}@media(max-width:780px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wrap{padding:14px 13px 50px}.brand img{width:42px;height:42px}.hero{padding:28px 0 22px}.hero h1{font-size:clamp(45px,13vw,61px);letter-spacing:-3px}.hero p{font-size:14px}.search{font-size:15px}.cats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cat{min-height:155px;border-radius:24px}.iconWrap{width:98px;height:98px}.cat img{width:88px;height:88px}.catName{font-size:15px}}@media(max-width:360px){.cat{min-height:148px}.cat img{width:82px;height:82px}}@media(prefers-reduced-motion:reduce){.cat{transition:none}.cat:hover{transform:none}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand"><img src="./assets/webinsolito-logo.svg" alt="">WEBINSOLITO</div></header>
<section class="hero"><h1>Dimmi cosa devi fare.</h1><p>Scrivilo come ti viene. Webinsolito prova a capire il problema e ti porta allo strumento giusto.</p><div class="searchBox"><div class="searchShell"><span class="searchIcon" aria-hidden="true">⌕</span><input id="globalSearch" class="search" autocomplete="off" aria-label="Cerca uno strumento" placeholder="Es. devo vendere la macchina, parto una settimana…"></div><div id="searchResults" class="results" role="listbox" aria-live="polite"></div></div></section>
<section id="categoryGrid" class="cats" aria-label="Categorie Webinsolito"></section>
<footer class="footer">Webinsolito · veloce, gratuito, senza account obbligatorio</footer></main>
<script src="./assets/home-search.js"></script><script>
const slugMap={auto:'auto',food:'food',money:'soldi',events:'eventi',docs:'documenti',home:'casa',travel:'viaggi',style:'persona',shopping:'shopping',territory:'territorio',business:'business',study:'studio'};
const shortName={auto:'Auto',food:'Food',money:'Soldi',events:'Eventi',docs:'Documenti',home:'Casa',travel:'Viaggi',style:'Persona',shopping:'Shopping',territory:'Territorio',business:'Lavoro',study:'Studio'};
const esc=s=>(s??'').toString().replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let live=[],categories=[],cursor=-1,current=[];const input=document.getElementById('globalSearch'),results=document.getElementById('searchResults');
function closeResults(){results.classList.remove('on');results.innerHTML='';cursor=-1;current=[]}
function renderResults(q){current=WebinsolitoSearch.search(q,live,categories,9);cursor=-1;if(!q.trim()){closeResults();return}results.innerHTML=current.length?current.map((r,i)=>{if(r.type==='category'){const c=r.category;return '<a class="res" role="option" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>'}const a=r.app,c=categories.find(x=>x.id===a.category);return '<a class="res" role="option" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||(c?.name||''))+'</em></a>'}).join(''):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';results.classList.add('on')}
function paintCursor(){[...results.querySelectorAll('.res[href]')].forEach((el,i)=>el.classList.toggle('active',i===cursor))}
fetch('./apps.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{categories=x.categories;live=x.apps.filter(a=>['MVP','BETA','STABLE'].includes(a.status)&&a.path);categoryGrid.innerHTML=categories.map(c=>'<a class="cat" style="--c1:'+c.colors[0]+';--c2:'+c.colors[1]+'" href="./'+slugMap[c.id]+'/"><div class="iconWrap"><img src="./'+c.icon+'" alt=""></div><div class="catName">'+esc(shortName[c.id]||c.name)+'</div></a>').join('');if(input.value.trim())renderResults(input.value)});
input.addEventListener('input',()=>renderResults(input.value));input.addEventListener('keydown',e=>{const links=[...results.querySelectorAll('.res[href]')];if(!links.length)return;if(e.key==='ArrowDown'){e.preventDefault();cursor=(cursor+1)%links.length;paintCursor()}if(e.key==='ArrowUp'){e.preventDefault();cursor=(cursor-1+links.length)%links.length;paintCursor()}if(e.key==='Enter'&&cursor>=0){e.preventDefault();links[cursor].click()}if(e.key==='Escape')closeResults()});document.addEventListener('click',e=>{if(!e.target.closest('.searchBox'))closeResults()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script></body></html>
