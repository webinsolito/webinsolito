<style>
:root{
  color-scheme:dark;
  --bg:#020910;
  --bg2:#061522;
  --blue:#0a2a3c;
  --blue2:#123d55;
  --gold:#d4a45e;
  --gold2:#f0d6a5;
  --gold3:#9c672e;
  --ivory:#f7ead3;
  --muted:#9aa6b0;
  --line:rgba(229,187,116,.42);
  --glass:rgba(4,18,29,.78);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ivory);
  background:
    radial-gradient(900px 580px at 17% 4%,rgba(49,125,166,.24),transparent 55%),
    radial-gradient(700px 540px at 86% 27%,rgba(212,164,94,.10),transparent 62%),
    linear-gradient(180deg,#061827 0%,#03111c 52%,#020910 100%);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button,input{font:inherit}
button{color:inherit}
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-4;
  pointer-events:none;
  background:
    radial-gradient(circle at 8% 13%,rgba(255,234,196,.70) 0 1.2px,transparent 1.8px),
    radial-gradient(circle at 21% 42%,rgba(63,145,188,.52) 0 1px,transparent 1.7px),
    radial-gradient(circle at 71% 11%,rgba(255,222,174,.54) 0 1.2px,transparent 1.8px),
    radial-gradient(circle at 88% 35%,rgba(69,142,181,.46) 0 1px,transparent 1.7px),
    radial-gradient(circle at 45% 73%,rgba(255,225,178,.42) 0 1px,transparent 1.7px),
    radial-gradient(circle at 70% 84%,rgba(61,132,168,.44) 0 1px,transparent 1.7px);
  background-size:330px 290px,410px 350px,480px 390px,390px 330px,540px 450px,610px 510px;
  opacity:.74;
}
body:after{
  content:"";
  position:fixed;
  inset:-12%;
  z-index:-3;
  pointer-events:none;
  background:
    linear-gradient(117deg,transparent 20%,rgba(75,161,205,.09) 39%,transparent 56%),
    linear-gradient(68deg,transparent 50%,rgba(221,176,105,.055) 67%,transparent 82%);
  filter:blur(24px);
}
.boot{
  position:fixed;
  inset:0;
  z-index:999;
  display:grid;
  place-items:center;
  background:
    radial-gradient(540px 440px at 50% 43%,rgba(13,59,82,.48),transparent 72%),
    #020910;
  transition:opacity .52s ease,visibility .52s ease;
}
.bootInner{width:min(430px,76vw);text-align:center}
.bootWord{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,7vw,56px);
  letter-spacing:.22em;
  color:var(--gold2);
  text-transform:uppercase;
}
.bootRule{width:54px;height:1px;margin:18px auto 30px;background:var(--gold)}
.bootTrack{height:4px;border:1px solid rgba(212,164,94,.36);border-radius:999px;overflow:hidden}
.bootFill{
  width:0;height:100%;
  background:linear-gradient(90deg,#8b5625,var(--gold2));
  box-shadow:0 0 18px rgba(212,164,94,.55);
  animation:bootProgress 1.12s cubic-bezier(.25,.7,.25,1) forwards;
}
.bootLabel{margin-top:17px;color:#8e9aa4;font-size:9px;font-weight:900;letter-spacing:.34em;text-transform:uppercase}
.boot-seen .boot{display:none}
.boot-done .boot{opacity:0;visibility:hidden}
@keyframes bootProgress{to{width:100%}}

.page{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}
.page:before{
  content:"";
  position:absolute;
  left:-170px;top:-60px;
  width:520px;height:840px;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(57,139,181,.17),transparent 67%);
  filter:blur(18px);
  transform:rotate(-17deg);
  pointer-events:none;
}
.page:after{
  content:"";
  position:absolute;
  right:-160px;bottom:-140px;
  width:560px;height:560px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(212,164,94,.10),transparent 67%);
  filter:blur(20px);
  pointer-events:none;
}
.top{
  position:relative;
  z-index:40;
  width:min(1480px,calc(100% - 58px));
  min-height:74px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.brand{
  text-decoration:none;
  color:var(--gold2);
  font:700 12px/1 Georgia,"Times New Roman",serif;
  letter-spacing:.31em;
  text-transform:uppercase;
}
.topRight{display:flex;align-items:center;gap:18px}
.topLink{
  text-decoration:none;color:#99a5af;
  font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase
}
.topLink:hover{color:#fff5e4}
.release{
  min-height:26px;padding:0 9px;display:inline-flex;align-items:center;
  border:1px solid rgba(212,164,94,.18);
  color:#8c98a2;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase
}
.hero{
  position:relative;
  z-index:10;
  width:min(1040px,calc(100% - 28px));
  margin:0 auto;
  padding:35px 0 58px;
  text-align:center;
}
.plate{
  margin:4px 0 0;
  color:var(--gold2);
  font:700 12px/1 Georgia,"Times New Roman",serif;
  letter-spacing:.34em;
  text-transform:uppercase;
}
.plate:after{
  content:"";
  display:block;
  width:56px;height:1px;
  margin:14px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* Main reference-matched visual stage */
.stage{
  position:relative;
  width:min(850px,96vw);
  height:690px;
  margin:8px auto 0;
}
.modelMount{
  position:absolute;
  left:50%;top:47%;
  width:min(650px,78vw);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  z-index:7;
  touch-action:pan-y;
  cursor:grab;
  filter:drop-shadow(0 34px 60px rgba(0,0,0,.46));
}
.modelMount:active{cursor:grabbing}
.modelMount canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  opacity:0;
  transition:opacity .55s ease;
}
.modelMount.hero3d-ready canvas{opacity:1}
.hero3dFallback{
  position:absolute;
  inset:11%;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid rgba(236,196,126,.56);
  background:
    radial-gradient(circle at 34% 28%,rgba(83,158,194,.26),transparent 15%),
    radial-gradient(circle at 55% 58%,rgba(17,68,88,.68),transparent 48%),
    radial-gradient(circle,#0b2c3d 0 38%,#061722 72%,#020a11 100%);
  box-shadow:0 0 0 10px rgba(212,164,94,.03),0 0 70px rgba(212,164,94,.12),inset -30px -34px 60px rgba(0,0,0,.45);
  color:var(--gold2);
  font:700 110px/1 Georgia,"Times New Roman",serif;
  transition:opacity .4s ease;
  pointer-events:none;
}
.modelMount.hero3d-ready .hero3dFallback{opacity:0}
.modelMount.hero3d-failed .hero3dFallback{opacity:1}
.hero3dBadge{
  position:absolute;
  left:50%;bottom:4%;
  transform:translateX(-50%);
  z-index:3;
  color:rgba(238,211,163,.7);
  font-size:7px;
  font-weight:900;
  letter-spacing:.22em;
  text-transform:uppercase;
  opacity:.78;
  pointer-events:none;
}


.node{
  position:absolute;
  z-index:20;
  width:122px;
  text-decoration:none;
  text-align:center;
  color:var(--ivory);
  transition:transform .2s ease,filter .2s ease;
}
.node:hover,.node:focus-visible{outline:none;transform:translateY(-3px) scale(1.045);filter:drop-shadow(0 12px 24px rgba(0,0,0,.40))}
.nodeIcon{
  width:72px;height:72px;
  margin:0 auto 9px;
  border:1px solid rgba(240,211,159,.88);
  border-radius:50%;
  display:grid;place-items:center;
  background:rgba(2,13,22,.48);
  box-shadow:0 0 0 5px rgba(212,164,94,.022),inset 0 0 24px rgba(56,126,159,.10);
  backdrop-filter:blur(10px);
}
.nodeIcon svg{
  width:34px;height:34px;fill:none;stroke:var(--gold2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round
}
.node strong{
  display:block;
  font:700 22px/1 Georgia,"Times New Roman",serif;
  letter-spacing:-.02em;
}
.node:after{
  content:"";
  display:block;
  width:46px;height:1px;
  margin:10px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.nodeAuto{left:3%;top:17%}
.nodeHome{right:3%;top:17%}
.nodeTravel{left:0;bottom:18%}
.nodeFood{right:0;bottom:18%}
.nodeMoney{left:50%;bottom:-1%;transform:translateX(-50%)}
.nodeMoney:hover,.nodeMoney:focus-visible{transform:translateX(-50%) translateY(-3px) scale(1.045)}
.connector{
  position:absolute;
  z-index:3;
  border-top:1px dashed rgba(221,178,106,.68);
  width:150px;
  transform-origin:left center;
  opacity:.72;
}
.conAuto{left:16%;top:29%;transform:rotate(23deg)}
.conHome{right:16%;top:29%;transform:rotate(157deg);transform-origin:right center}
.conTravel{left:14%;bottom:28%;width:170px;transform:rotate(-22deg)}
.conFood{right:14%;bottom:28%;width:170px;transform:rotate(202deg);transform-origin:right center}
.conMoney{left:50%;bottom:13%;width:105px;transform:rotate(90deg)}

.identity{margin-top:-4px}
.identity h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(72px,9vw,126px);
  line-height:.86;
  letter-spacing:-.063em;
  font-weight:700;
  background:linear-gradient(180deg,#fff3dc 0%,#edc98d 38%,#d5a25a 66%,#9b622b 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 18px 52px rgba(0,0,0,.28);
}
.identityRule{width:58px;height:1px;margin:20px auto 16px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.identity p{
  margin:0;color:#d9bd8e;
  font:700 14px/1.2 Georgia,"Times New Roman",serif;
  letter-spacing:.26em;text-transform:uppercase;
}

.searchBox{
  position:relative;z-index:60;
  width:min(770px,92vw);
  margin:34px auto 0;text-align:left
}
.searchShell{
  min-height:72px;
  display:flex;align-items:center;gap:14px;
  padding:8px 9px 8px 20px;
  border:1px solid rgba(235,193,122,.76);
  border-radius:999px;
  background:linear-gradient(180deg,rgba(5,25,39,.90),rgba(2,14,23,.92));
  box-shadow:0 22px 62px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(212,164,94,.04);
  backdrop-filter:blur(20px);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.searchShell:focus-within{
  transform:translateY(-2px);
  border-color:var(--gold2);
  box-shadow:0 30px 80px rgba(0,0,0,.50),0 0 0 5px rgba(212,164,94,.07),inset 0 1px rgba(255,255,255,.07)
}
.searchIcon{width:22px;height:22px;flex:none;position:relative}
.searchIcon:before{content:"";position:absolute;left:1px;top:1px;width:12px;height:12px;border:2px solid var(--gold2);border-radius:50%}
.searchIcon:after{content:"";position:absolute;left:14px;top:15px;width:8px;height:2px;background:var(--gold2);border-radius:2px;transform:rotate(45deg);transform-origin:left center}
.search{
  width:100%;min-width:0;border:0;outline:0;background:transparent;
  color:#fff7e9;font:650 16px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em
}
.search::placeholder{color:#9ca8b0}
.searchSubmit{
  width:55px;height:55px;flex:none;
  border:1px solid rgba(242,211,159,.62);border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(145deg,rgba(223,180,109,.22),rgba(128,78,30,.38));
  color:var(--gold2);
  box-shadow:inset 0 1px rgba(255,255,255,.13);
  transition:transform .18s ease,background .18s ease
}
.searchSubmit:hover{transform:rotate(-3deg) scale(1.04);background:linear-gradient(145deg,rgba(240,211,159,.31),rgba(128,78,30,.46))}
.searchSubmit svg{width:20px;height:20px}
.results{
  display:none;position:absolute;left:0;right:0;top:82px;z-index:100;overflow:hidden;
  border:1px solid rgba(229,187,116,.25);border-radius:24px;
  background:rgba(2,13,22,.985);box-shadow:0 34px 100px rgba(0,0,0,.64);backdrop-filter:blur(22px)
}
.results.on{display:block}
.res{display:flex;align-items:center;gap:13px;min-height:64px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.055);text-decoration:none}
.res:last-child{border-bottom:0}
.res:hover,.res.active{background:rgba(212,164,94,.075)}
.res:focus-visible{outline:3px solid rgba(212,164,94,.26);outline-offset:-3px}
.res img{width:42px;height:42px;object-fit:contain}
.resText{min-width:0;flex:1}
.res b{font-size:13px;color:#fff}
.res span{display:block;margin-top:3px;color:#7f8f9c;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res em{font-style:normal;color:#d6aa67;font-size:9px;font-weight:850;white-space:nowrap}
.status{
  width:min(430px,70vw);
  margin:44px auto 0;
}
.statusTrack{height:4px;border:1px solid rgba(212,164,94,.28);border-radius:999px;overflow:hidden}
.statusFill{
  width:34%;height:100%;border-radius:inherit;
  background:linear-gradient(90deg,#8a5526,var(--gold2));
  box-shadow:0 0 16px rgba(212,164,94,.38);
  animation:statusPulse 5s ease-in-out infinite
}
.statusText{margin-top:14px;color:#7f8d98;font-size:8px;font-weight:900;letter-spacing:.33em;text-transform:uppercase}
@keyframes statusPulse{50%{width:66%;opacity:.78}}
.footer{
  width:min(1040px,calc(100% - 28px));
  margin:0 auto;padding:25px 0 34px;
  display:flex;justify-content:space-between;gap:20px;
  color:#66737d;font-size:9px;border-top:1px solid rgba(255,255,255,.055)
}
.footer a{color:#9ba7b0;text-decoration:none}
.footer a:hover{color:var(--gold2)}

@media(max-width:860px){
  .stage{height:620px}
  .modelMount{width:min(590px,78vw)}
  .artGlow{width:min(620px,82vw)}
  .nodeAuto{left:1%}.nodeHome{right:1%}.nodeTravel{left:-1%}.nodeFood{right:-1%}
}
@media(max-width:680px){
  .top{width:calc(100% - 26px);min-height:66px}
  .brand{font-size:11px}
  .topLink{display:none}
  .hero{width:100%;padding:20px 0 44px}
  .plate{font-size:9px}
  .stage{width:100%;height:520px;margin-top:4px}
  .modelMount{top:46%;width:390px;max-width:76vw}
  .artGlow{top:46%;width:420px;max-width:82vw}
  .node{width:88px}
  .nodeIcon{width:54px;height:54px;margin-bottom:7px}
  .nodeIcon svg{width:27px;height:27px}
  .node strong{font-size:17px}
  .node:after{width:34px;margin-top:8px}
  .nodeAuto{left:4%;top:17%}
  .nodeHome{right:4%;top:17%}
  .nodeTravel{left:2%;bottom:18%}
  .nodeFood{right:2%;bottom:18%}
  .nodeMoney{bottom:0}
  .connector{display:none}
  .identity{padding:0 12px}
  .identity h1{font-size:clamp(59px,15vw,84px)}
  .identity p{font-size:10px;letter-spacing:.19em}
  .identityRule{margin:15px auto 12px}
  .searchBox{margin-top:27px;width:calc(100% - 24px)}
  .searchShell{min-height:64px;padding:7px 8px 7px 16px}
  .searchSubmit{width:49px;height:49px}
  .search{font-size:14px}
  .results{top:73px}
  .status{margin-top:32px}
  .footer{width:calc(100% - 26px);padding-bottom:24px}
}
@media(max-width:430px){
  .release{display:none}
  .stage{height:485px}
  .modelMount{top:45%;width:330px;max-width:78vw}
  .artGlow{top:45%;width:360px;max-width:84vw}
  .node{width:76px}
  .nodeIcon{width:48px;height:48px}
  .nodeIcon svg{width:24px;height:24px}
  .node strong{font-size:15.5px}
  .nodeAuto{left:3%;top:15%}
  .nodeHome{right:3%;top:15%}
  .nodeTravel{left:1%;bottom:20%}
  .nodeFood{right:1%;bottom:20%}
  .nodeMoney{bottom:1%}
  .identity h1{font-size:59px}
  .identity p{font-size:8.5px;letter-spacing:.17em}
  .search::placeholder{font-size:13px}
  .status{width:64vw}
}
@media(max-width:390px){
  .stage{height:460px}
  .modelMount{width:302px}
  .nodeIcon{width:46px;height:46px}
  .node strong{font-size:14px}
  .identity h1{font-size:54px}
  .searchBox{width:calc(100% - 20px)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
  .boot{display:none!important}
  .searchShell:focus-within{transform:none}
}
</style>
</head>
<body data-home-release="23.0">
<div class="boot" aria-hidden="true">
  <div class="bootInner">
    <div class="bootWord">Webinsolito</div>
    <div class="bootRule"></div>
    <div class="bootTrack"><div class="bootFill"></div></div>
    <div class="bootLabel">Caricamento</div>
  </div>
</div>

<main class="page">
  <header class="top">
    <a class="brand" href="./" aria-label="Webinsolito, Home">Webinsolito</a>
    <div class="topRight">
      <a class="topLink" href="./categorie.html">Tutte le categorie</a>
      <span class="release" aria-label="Versione Home 23.0">Home V23.0</span>
    </div>
  </header>

  <section class="hero" aria-labelledby="home-title">
    <p class="plate">Webinsolito</p>

    <div class="stage">
      <div class="artGlow" aria-hidden="true"></div>

      <div class="modelMount" id="hero3d" data-state="loading" aria-label="Scultura 3D interattiva Webinsolito" aria-busy="true">
        <canvas id="hero3dCanvas" aria-hidden="true"></canvas>
        <div class="hero3dFallback" id="hero3dFallback" aria-hidden="true">W</div>
        <span class="hero3dBadge" aria-hidden="true">3D · trascina leggermente</span>
      </div>

      <span class="connector conAuto" aria-hidden="true"></span>
      <span class="connector conHome" aria-hidden="true"></span>
      <span class="connector conTravel" aria-hidden="true"></span>
      <span class="connector conFood" aria-hidden="true"></span>
      <span class="connector conMoney" aria-hidden="true"></span>

      <a class="node nodeAuto" href="./auto/" aria-label="Apri categoria Auto">
        <span class="nodeIcon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M11 30h26l-3-10a5 5 0 0 0-5-4H19a5 5 0 0 0-5 4l-3 10Z"/><path d="M9 30h30v7H9z"/><circle cx="15" cy="37" r="3"/><circle cx="33" cy="37" r="3"/><path d="M17 16v-4h14v4"/></svg>
        </span>
        <strong>Auto</strong>
      </a>

      <a class="node nodeHome" href="./casa/" aria-label="Apri categoria Casa">
        <span class="nodeIcon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M8 23 24 10l16 13"/><path d="M12 21v17h24V21"/><path d="M20 38V27h8v11"/></svg>
        </span>
        <strong>Casa</strong>
      </a>

      <a class="node nodeTravel" href="./viaggi/" aria-label="Apri categoria Viaggi">
        <span class="nodeIcon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="m7 27 14-4 9-12 5 1-5 13 10 4c2 1 2 4 0 5l-10 1-7 8-4-1 2-8-14-2Z"/></svg>
        </span>
        <strong>Viaggi</strong>
      </a>

      <a class="node nodeFood" href="./food/" aria-label="Apri categoria Food">
        <span class="nodeIcon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M14 8v13M10 8v8c0 4 8 4 8 0V8M14 21v19"/><path d="M30 8v32M30 8c7 3 8 14 0 18"/></svg>
        </span>
        <strong>Food</strong>
      </a>

<script type="module" src="./assets/home-3d-v23.js"></script>
<script src="./assets/home-search-20260925.js"></script>
<script>
(function(){
  "use strict";

  var root=document.documentElement;
  if(root.classList.contains("boot-new")&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    var bootStarted=performance.now(),bootClosed=false;
    function closeBoot(){
      if(bootClosed)return;
      var wait=Math.max(0,1100-(performance.now()-bootStarted));
      setTimeout(function(){
        root.classList.add("boot-done");
        try{sessionStorage.setItem("wi-v23-seen","1")}catch(e){}
      },wait);
      bootClosed=true;
    }
    window.addEventListener("webinsolito:hero3d-ready",closeBoot,{once:true});
    window.addEventListener("webinsolito:hero3d-error",closeBoot,{once:true});
    setTimeout(closeBoot,3000);
  }

  var slugMap={auto:"auto",food:"food",money:"soldi",events:"eventi",docs:"documenti",home:"casa",travel:"viaggi",style:"persona",shopping:"shopping",territory:"territorio",business:"business",study:"studio"};
  var esc=function(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]})};
  var live=[],categories=[],cursor=-1,current=[];
  var input=document.getElementById("globalSearch");
  var results=document.getElementById("searchResults");
  var searchButton=document.querySelector(".searchSubmit");

  function closeResults(){
    results.classList.remove("on");
    results.innerHTML="";
    input.setAttribute("aria-expanded","false");
    cursor=-1;
    current=[];
  }
  function renderResults(query){
    if(!window.WebinsolitoSearch)return;
    current=WebinsolitoSearch.search(query,live,categories,9);
    cursor=-1;
    if(!query.trim()){closeResults();return}
    results.innerHTML=current.length?current.map(function(r,i){
      if(r.type==="category"){
        var c=r.category;
        return '<a class="res" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>';
      }
      var a=r.app;
      return '<a class="res" role="option" aria-selected="false" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||"Strumento")+'</em></a>';
    }).join(""):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';
    results.classList.add("on");
    input.setAttribute("aria-expanded","true");
  }

  fetch("./apps.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){
    categories=x.categories||[];
    live=(x.apps||[]).filter(function(a){return ["MVP","BETA","STABLE"].indexOf(a.status)>=0&&a.path});
    if(input.value.trim())renderResults(input.value);
  }).catch(function(){});

  input.addEventListener("input",function(){renderResults(input.value)});
  input.addEventListener("keydown",function(e){
    var links=[].slice.call(results.querySelectorAll(".res[href]"));
    if(e.key==="Escape"){closeResults();return}
    if(!links.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();cursor=(cursor+1)%links.length}
    if(e.key==="ArrowUp"){e.preventDefault();cursor=(cursor-1+links.length)%links.length}
    links.forEach(function(el,i){
      var on=i===cursor;
      el.classList.toggle("active",on);
      el.setAttribute("aria-selected",on?"true":"false");
    });
    if(e.key==="Enter"&&cursor>=0){e.preventDefault();links[cursor].click()}
  });
  searchButton.addEventListener("click",function(){input.focus();renderResults(input.value)});
  document.addEventListener("click",function(e){if(!e.target.closest(".searchBox"))closeResults()});

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(r){return r.update()}).catch(function(){});
  }
})();
</script>
