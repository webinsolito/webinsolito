<style>
:root{
  color-scheme:dark;
  --night:#040c14;
  --navy:#071725;
  --petrol:#0a2a36;
  --gold:#d7aa68;
  --gold2:#f0d39f;
  --ivory:#f6e9d1;
  --muted:#9ca9b3;
  --line:rgba(231,190,124,.35);
  --glass:rgba(5,18,29,.72);
}
*{box-sizing:border-box}
html{background:var(--night);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ivory);
  background:
    radial-gradient(880px 560px at 22% 8%,rgba(31,105,143,.22),transparent 60%),
    radial-gradient(680px 540px at 84% 25%,rgba(215,170,104,.10),transparent 62%),
    linear-gradient(180deg,#071725 0%,#04111c 48%,#030a11 100%);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button,input{font:inherit}
button{color:inherit}
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  opacity:.68;
  background:
    radial-gradient(circle at 8% 12%,rgba(255,232,187,.65) 0 1px,transparent 1.7px),
    radial-gradient(circle at 29% 27%,rgba(94,163,199,.62) 0 1px,transparent 1.7px),
    radial-gradient(circle at 72% 15%,rgba(255,232,187,.58) 0 1px,transparent 1.7px),
    radial-gradient(circle at 86% 38%,rgba(89,153,190,.6) 0 1px,transparent 1.7px),
    radial-gradient(circle at 42% 70%,rgba(255,232,187,.45) 0 1px,transparent 1.7px),
    radial-gradient(circle at 64% 83%,rgba(85,145,178,.5) 0 1px,transparent 1.7px);
  background-size:310px 270px,430px 330px,470px 360px,390px 300px,520px 410px,610px 470px;
}
body:after{
  content:"";
  position:fixed;
  inset:-15%;
  z-index:-2;
  pointer-events:none;
  background:
    linear-gradient(112deg,transparent 25%,rgba(80,160,199,.065) 42%,transparent 56%),
    linear-gradient(72deg,transparent 53%,rgba(215,170,104,.04) 67%,transparent 79%);
  filter:blur(18px);
}
.boot{
  position:fixed;
  inset:0;
  z-index:999;
  display:grid;
  place-items:center;
  background:
    radial-gradient(520px 420px at 50% 42%,rgba(15,65,86,.40),transparent 72%),
    #030b12;
  transition:opacity .55s ease,visibility .55s ease;
}
.bootInner{width:min(420px,76vw);text-align:center}
.bootWord{
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,7vw,58px);
  letter-spacing:.18em;
  color:var(--gold2);
  text-transform:uppercase;
  text-shadow:0 0 34px rgba(215,170,104,.16);
}
.bootLine{width:52px;height:1px;margin:18px auto 30px;background:var(--gold)}
.bootTrack{
  height:4px;
  overflow:hidden;
  border:1px solid rgba(215,170,104,.34);
  border-radius:999px;
}
.bootFill{
  height:100%;width:0;
  background:linear-gradient(90deg,#9d6a31,var(--gold2));
  box-shadow:0 0 16px rgba(215,170,104,.48);
  animation:bootFill 1.1s cubic-bezier(.25,.7,.25,1) forwards;
}
.bootLabel{
  margin-top:17px;
  color:#95a1aa;
  font-size:9px;
  font-weight:850;
  letter-spacing:.34em;
  text-transform:uppercase;
}
.boot-seen .boot{display:none}
.boot-done .boot{opacity:0;visibility:hidden}
@keyframes bootFill{to{width:100%}}

.page{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  isolation:isolate;
}
.page:before{
  content:"";
  position:absolute;
  left:-180px;
  top:-90px;
  width:460px;height:760px;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(50,127,162,.17),transparent 68%);
  filter:blur(20px);
  transform:rotate(-18deg);
  pointer-events:none;
}
.page:after{
  content:"";
  position:absolute;
  right:-150px;
  bottom:-120px;
  width:520px;height:520px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(215,170,104,.09),transparent 66%);
  filter:blur(18px);
  pointer-events:none;
}
.top{
  position:relative;
  z-index:50;
  width:min(1480px,calc(100% - 56px));
  min-height:76px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.075);
}
.miniBrand{
  text-decoration:none;
  color:var(--gold2);
  font-family:Georgia,"Times New Roman",serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
}
.topRight{display:flex;align-items:center;gap:18px}
.topLink{
  text-decoration:none;
  color:#9eabb5;
  font-size:9px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.topLink:hover{color:var(--ivory)}
.release{
  min-height:26px;
  padding:0 9px;
  border:1px solid rgba(215,170,104,.18);
  display:inline-flex;
  align-items:center;
  color:#8f9ba5;
  font-size:8px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.hero{
  position:relative;
  z-index:10;
  width:min(1160px,calc(100% - 34px));
  margin:0 auto;
  padding:26px 0 58px;
  text-align:center;
}
.plate{
  margin:4px 0 0;
  color:var(--gold2);
  font:700 12px/1 Georgia,"Times New Roman",serif;
  letter-spacing:.36em;
  text-transform:uppercase;
}
.plateLine{
  width:56px;height:1px;
  margin:14px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.celestialStage{
  --rx:0deg;
  --ry:0deg;
  position:relative;
  width:min(860px,94vw);
  height:600px;
  margin:10px auto 0;
  transform:perspective(1200px) rotateX(var(--rx)) rotateY(var(--ry));
  transform-style:preserve-3d;
  transition:transform .16s ease-out;
}
.aura{
  position:absolute;
  left:50%;top:48%;
  width:520px;height:520px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle,rgba(57,146,184,.18) 0 15%,rgba(215,170,104,.06) 30%,transparent 68%);
  filter:blur(7px);
}
.sphereWrap{
  position:absolute;
  left:50%;top:47%;
  width:390px;height:390px;
  transform:translate(-50%,-50%);
  transform-style:preserve-3d;
}
.core{
  position:absolute;
  left:50%;top:50%;
  width:262px;height:262px;
  transform:translate(-50%,-50%) translateZ(36px);
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 35% 28%,rgba(255,239,204,.34),transparent 12%),
    radial-gradient(circle at 58% 66%,rgba(18,69,87,.62),transparent 38%),
    radial-gradient(circle at 42% 38%,#14384a 0 14%,#0a2432 43%,#06131f 72%);
  border:1px solid rgba(242,211,159,.70);
  box-shadow:
    inset -32px -36px 74px rgba(0,0,0,.54),
    inset 18px 12px 40px rgba(89,166,195,.11),
    0 0 0 8px rgba(215,170,104,.05),
    0 0 70px rgba(215,170,104,.14),
    0 38px 70px rgba(0,0,0,.45);
}
.core:before,
.core:after{
  content:"";
  position:absolute;
  border-radius:50%;
  inset:17%;
  border:1px solid rgba(215,170,104,.15);
  transform:rotate(34deg) scaleX(1.42);
}
.core:after{transform:rotate(-26deg) scaleX(.74);opacity:.58}
.coreW{
  position:relative;
  z-index:5;
  font-family:Georgia,"Times New Roman",serif;
  font-size:124px;
  line-height:1;
  color:var(--ivory);
  text-shadow:0 4px 0 rgba(123,77,27,.5),0 16px 32px rgba(0,0,0,.42);
}
.coreW:after{
  content:"";
  position:absolute;
  left:50%;bottom:-17px;
  width:15px;height:15px;
  transform:translateX(-50%) rotate(45deg);
  background:var(--gold2);
  clip-path:polygon(50% 0,63% 37%,100% 50%,63% 63%,50% 100%,37% 63%,0 50%,37% 37%);
}
.ring{
  position:absolute;
  left:50%;top:50%;
  border:3px solid var(--gold);
  border-radius:50%;
  box-shadow:0 0 14px rgba(215,170,104,.22),inset 0 0 10px rgba(215,170,104,.08);
  transform-style:preserve-3d;
  pointer-events:none;
}
.r1{
  width:360px;height:182px;
  margin:-91px 0 0 -180px;
  transform:rotate(17deg) rotateX(66deg);
  animation:ringA 13s linear infinite;
}
.r2{
  width:350px;height:202px;
  margin:-101px 0 0 -175px;
  transform:rotate(-32deg) rotateX(68deg);
  animation:ringB 17s linear infinite reverse;
}
.r3{
  width:250px;height:390px;
  margin:-195px 0 0 -125px;
  transform:rotate(68deg) rotateY(62deg);
  opacity:.78;
  animation:ringC 19s linear infinite;
}
@keyframes ringA{to{transform:rotate(377deg) rotateX(66deg)}}
@keyframes ringB{to{transform:rotate(328deg) rotateX(68deg)}}
@keyframes ringC{to{transform:rotate(428deg) rotateY(62deg)}}
.orb{
  position:absolute;
  width:30px;height:30px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff0c9 0 8%,#e3ba78 20%,#9b6227 68%,#4c2e12 100%);
  box-shadow:0 0 17px rgba(215,170,104,.45),0 7px 14px rgba(0,0,0,.44);
  z-index:8;
}
.o1{left:69px;top:72px}
.o2{right:42px;top:132px;width:42px;height:42px}
.o3{left:43px;bottom:84px;width:37px;height:37px}
.o4{right:106px;bottom:32px;width:22px;height:22px}
.o5{left:174px;top:-6px;width:25px;height:25px}

.catNode{
  position:absolute;
  z-index:20;
  width:118px;
  text-decoration:none;
  text-align:center;
  color:var(--ivory);
  transform:translateZ(62px);
  transition:transform .22s ease,filter .22s ease,color .22s ease;
}
.catNode:hover,.catNode:focus-visible{
  outline:none;
  color:#fff9ed;
  transform:translateZ(80px) scale(1.055);
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.34));
}
.catIcon{
  width:70px;height:70px;
  margin:0 auto 10px;
  border:1px solid rgba(231,190,124,.86);
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(5,18,29,.54);
  box-shadow:0 0 0 5px rgba(215,170,104,.025),inset 0 0 20px rgba(36,103,130,.13);
  backdrop-filter:blur(10px);
  transition:background .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.catNode:hover .catIcon,.catNode:focus-visible .catIcon{
  background:rgba(10,42,54,.72);
  border-color:var(--gold2);
  box-shadow:0 0 0 7px rgba(215,170,104,.045),0 0 28px rgba(215,170,104,.14),inset 0 0 22px rgba(53,133,164,.16);
}
.catIcon svg{
  width:34px;height:34px;
  fill:none;
  stroke:var(--gold2);
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.catNode strong{
  display:block;
  font:700 22px/1 Georgia,"Times New Roman",serif;
  letter-spacing:-.02em;
}
.catNode:after{
  content:"";
  display:block;
  width:46px;height:1px;
  margin:11px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.catNode[data-cat="auto"]{left:5%;top:20%}
.catNode[data-cat="home"]{right:5%;top:20%}
.catNode[data-cat="travel"]{left:2%;bottom:15%}
.catNode[data-cat="food"]{right:2%;bottom:15%}
.catNode[data-cat="money"]{left:50%;bottom:0;transform:translateX(-50%) translateZ(62px)}
.catNode[data-cat="money"]:hover,.catNode[data-cat="money"]:focus-visible{transform:translateX(-50%) translateZ(80px) scale(1.055)}

.connector{
  position:absolute;
  z-index:3;
  height:1px;
  transform-origin:left center;
  background:repeating-linear-gradient(90deg,rgba(215,170,104,.78) 0 5px,transparent 5px 10px);
  opacity:.58;
  pointer-events:none;
}
.c1{left:18%;top:31%;width:155px;transform:rotate(22deg)}
.c2{right:17%;top:31%;width:155px;transform:rotate(158deg);transform-origin:right center}
.c3{left:15%;bottom:26%;width:175px;transform:rotate(-22deg)}
.c4{right:14%;bottom:25%;width:175px;transform:rotate(202deg);transform-origin:right center}
.c5{left:50%;bottom:14%;width:105px;transform:rotate(90deg);transform-origin:left center}

.identity{
  margin-top:-4px;
}
.identity h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(68px,8.8vw,126px);
  line-height:.86;
  letter-spacing:-.062em;
  font-weight:700;
  background:linear-gradient(180deg,#fff2d7 0%,#e3b875 47%,#a56b31 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 18px 55px rgba(0,0,0,.28);
}
.identityLine{
  width:58px;height:1px;margin:20px auto 16px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.identity p{
  margin:0;
  color:#d8bd90;
  font:700 14px/1.2 Georgia,"Times New Roman",serif;
  letter-spacing:.26em;
  text-transform:uppercase;
}

.searchBox{
  position:relative;
  z-index:60;
  width:min(760px,92vw);
  margin:34px auto 0;
  text-align:left;
}
.searchShell{
  min-height:72px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:8px 9px 8px 20px;
  border:1px solid rgba(231,190,124,.72);
  border-radius:999px;
  background:linear-gradient(180deg,rgba(7,27,42,.88),rgba(3,15,25,.90));
  box-shadow:0 22px 62px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.06),0 0 0 1px rgba(215,170,104,.05);
  backdrop-filter:blur(20px);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.searchShell:focus-within{
  transform:translateY(-2px);
  border-color:var(--gold2);
  box-shadow:0 30px 80px rgba(0,0,0,.46),0 0 0 5px rgba(215,170,104,.07),inset 0 1px rgba(255,255,255,.07);
}
.searchIcon{
  width:22px;height:22px;flex:none;position:relative
}
.searchIcon:before{
  content:"";position:absolute;left:1px;top:1px;width:12px;height:12px;border:2px solid var(--gold2);border-radius:50%
}
.searchIcon:after{
  content:"";position:absolute;left:14px;top:15px;width:8px;height:2px;background:var(--gold2);border-radius:2px;transform:rotate(45deg);transform-origin:left center
}
.search{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:#fff8eb;
  font:650 16px/1.2 Georgia,"Times New Roman",serif;
  letter-spacing:.025em;
}
.search::placeholder{color:#9aa6ae}
.searchSubmit{
  width:55px;height:55px;flex:none;
  border:1px solid rgba(242,211,159,.58);
  border-radius:50%;
  display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(215,170,104,.22),rgba(130,82,32,.36));
  color:var(--gold2);
  cursor:pointer;
  box-shadow:inset 0 1px rgba(255,255,255,.12);
  transition:transform .18s ease,background .18s ease;
}
.searchSubmit:hover{transform:rotate(-4deg) scale(1.04);background:linear-gradient(145deg,rgba(240,211,159,.30),rgba(130,82,32,.44))}
.searchSubmit svg{width:20px;height:20px}
.results{
  display:none;
  position:absolute;
  left:0;right:0;top:82px;
  z-index:100;
  overflow:hidden;
  border:1px solid rgba(231,190,124,.24);
  border-radius:24px;
  background:rgba(3,14,23,.985);
  box-shadow:0 34px 100px rgba(0,0,0,.62);
  backdrop-filter:blur(22px);
}
.results.on{display:block}
.res{
  display:flex;align-items:center;gap:13px;
  min-height:64px;padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.055);
  text-decoration:none;
}
.res:last-child{border-bottom:0}
.res:hover,.res.active{background:rgba(215,170,104,.075)}
.res:focus-visible{outline:3px solid rgba(215,170,104,.26);outline-offset:-3px}
.res img{width:42px;height:42px;object-fit:contain}
.resText{min-width:0;flex:1}
.res b{font-size:13px;color:#fff}
.res span{display:block;margin-top:3px;color:#7f8f9c;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res em{font-style:normal;color:#d6aa67;font-size:9px;font-weight:850;white-space:nowrap}

.readyBar{
  width:min(430px,70vw);
  margin:44px auto 0;
}
.readyTrack{
  height:4px;
  border:1px solid rgba(215,170,104,.25);
  border-radius:999px;
  overflow:hidden;
}
.readyFill{
  width:34%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#8c5928,var(--gold2));
  box-shadow:0 0 16px rgba(215,170,104,.35);
  animation:readyPulse 5s ease-in-out infinite;
}
.readyText{
  margin-top:14px;
  color:#7f8e99;
  font-size:8px;
  font-weight:900;
  letter-spacing:.33em;
  text-transform:uppercase;
}
@keyframes readyPulse{50%{width:68%;opacity:.76}}
.footer{
  width:min(1160px,calc(100% - 34px));
  margin:0 auto;
  padding:26px 0 34px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#66737e;
  font-size:9px;
  border-top:1px solid rgba(255,255,255,.055);
}
.footer a{color:#9ba7b0;text-decoration:none}
.footer a:hover{color:var(--gold2)}

@media(max-width:900px){
  .celestialStage{width:min(760px,96vw);height:560px}
  .sphereWrap{transform:translate(-50%,-50%) scale(.9)}
  .catNode[data-cat="auto"]{left:3%}
  .catNode[data-cat="home"]{right:3%}
  .catNode[data-cat="travel"]{left:0}
  .catNode[data-cat="food"]{right:0}
  .connector{opacity:.38}
}
@media(max-width:680px){
  .top{width:calc(100% - 26px);min-height:66px}
  .miniBrand{font-size:11px}
  .topLink{display:none}
  .hero{width:100%;padding:20px 0 44px}
  .plate{font-size:9px}
  .celestialStage{width:100%;height:470px;margin-top:4px}
  .aura{width:370px;height:370px;top:46%}
  .sphereWrap{top:45%;transform:translate(-50%,-50%) scale(.72)}
  .catNode{width:86px}
  .catIcon{width:54px;height:54px;margin-bottom:7px}
  .catIcon svg{width:27px;height:27px}
  .catNode strong{font-size:17px}
  .catNode:after{width:34px;margin-top:8px}
  .catNode[data-cat="auto"]{left:4%;top:19%}
  .catNode[data-cat="home"]{right:4%;top:19%}
  .catNode[data-cat="travel"]{left:3%;bottom:15%}
  .catNode[data-cat="food"]{right:3%;bottom:15%}
  .catNode[data-cat="money"]{bottom:1%}
  .connector{display:none}
  .identity{margin-top:-2px;padding:0 12px}
  .identity h1{font-size:clamp(58px,15vw,82px)}
  .identity p{font-size:10px;letter-spacing:.19em}
  .identityLine{margin:15px auto 12px}
  .searchBox{margin-top:27px;width:calc(100% - 24px)}
  .searchShell{min-height:64px;padding:7px 8px 7px 16px}
  .searchSubmit{width:49px;height:49px}
  .search{font-size:14px}
  .results{top:73px}
  .readyBar{margin-top:32px}
  .footer{width:calc(100% - 26px);padding-bottom:24px}
}
@media(max-width:430px){
  .release{display:none}
  .celestialStage{height:430px}
  .sphereWrap{top:45%;transform:translate(-50%,-50%) scale(.64)}
  .catNode{width:78px}
  .catIcon{width:49px;height:49px}
  .catIcon svg{width:24px;height:24px}

<script>
(function(){
  "use strict";

  var root=document.documentElement;
  if(root.classList.contains("boot-new")&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    setTimeout(function(){
      root.classList.add("boot-done");
      try{sessionStorage.setItem("wi-v22-seen","1")}catch(e){}
    },1180);
  }

  var stage=document.getElementById("celestialStage");
  if(stage&&matchMedia("(pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    stage.addEventListener("pointermove",function(e){
      var r=stage.getBoundingClientRect();
      var nx=(e.clientX-r.left)/r.width-.5;
      var ny=(e.clientY-r.top)/r.height-.5;
      stage.style.setProperty("--ry",(nx*4.5).toFixed(2)+"deg");
      stage.style.setProperty("--rx",(-ny*3.2).toFixed(2)+"deg");
    });
    stage.addEventListener("pointerleave",function(){
      stage.style.setProperty("--ry","0deg");
      stage.style.setProperty("--rx","0deg");
    });
  }

  var slugMap={auto:"auto",food:"food",money:"soldi",events:"eventi",docs:"documenti",home:"casa",travel:"viaggi",style:"persona",shopping:"shopping",territory:"territorio",business:"business",study:"studio"};
  var esc=function(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]})};
  var live=[],categories=[],cursor=-1,current=[];
  var input=document.getElementById("globalSearch");
  var results=document.getElementById("searchResults");
  var searchButton=document.querySelector(".searchSubmit");

  function closeResults(){
    results.classList.remove("on");
    results.innerHTML="";
    input.setAttribute("aria-expanded","false");
    cursor=-1;
    current=[];
  }
  function renderResults(query){
    if(!window.WebinsolitoSearch)return;
    current=WebinsolitoSearch.search(query,live,categories,9);
    cursor=-1;
    if(!query.trim()){closeResults();return}
    results.innerHTML=current.length?current.map(function(r,i){
      if(r.type==="category"){
        var c=r.category;
        return '<a class="res" data-i="'+i+'" href="./'+slugMap[c.id]+'/"><img src="./'+c.icon+'" alt=""><div class="resText"><b>'+esc(c.name)+'</b><span>'+esc(c.tagline)+'</span></div><em>Categoria</em></a>';
      }
      var a=r.app;
      return '<a class="res" role="option" aria-selected="false" data-i="'+i+'" data-app-id="'+esc(a.id)+'" href="./'+a.path+'"><img src="./'+a.icon+'" alt=""><div class="resText"><b>'+esc(a.name)+'</b><span>'+esc(a.description)+'</span></div><em>'+esc(r.reason||"Strumento")+'</em></a>';
    }).join(""):'<div class="res"><div class="resText"><b>Non trovo ancora lo strumento giusto.</b><span>Prova a descrivere il problema con altre parole.</span></div></div>';
    results.classList.add("on");
    input.setAttribute("aria-expanded","true");
  }

  fetch("./apps.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(x){
    categories=x.categories||[];
    live=(x.apps||[]).filter(function(a){return ["MVP","BETA","STABLE"].indexOf(a.status)>=0&&a.path});
    if(input.value.trim())renderResults(input.value);
  }).catch(function(){});

  input.addEventListener("input",function(){renderResults(input.value)});
  input.addEventListener("keydown",function(e){
    var links=[].slice.call(results.querySelectorAll(".res[href]"));
    if(e.key==="Escape"){closeResults();return}
    if(!links.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();cursor=(cursor+1)%links.length}
    if(e.key==="ArrowUp"){e.preventDefault();cursor=(cursor-1+links.length)%links.length}
    links.forEach(function(el,i){
      var on=i===cursor;
      el.classList.toggle("active",on);
      el.setAttribute("aria-selected",on?"true":"false");
    });
    if(e.key==="Enter"&&cursor>=0){
      e.preventDefault();
      links[cursor].click();
    }
  });
  searchButton.addEventListener("click",function(){input.focus();renderResults(input.value)});
  document.addEventListener("click",function(e){if(!e.target.closest(".searchBox"))closeResults()});

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(r){return r.update()}).catch(function(){});
  }
})();
</script>
