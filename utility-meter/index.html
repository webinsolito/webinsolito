<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#40536a"><meta name="description" content="Registra letture di luce, gas o acqua e calcola i consumi tra due date."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/utility-meter/"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.svg"><title>UtilityMeter — Webinsolito</title><link rel="stylesheet" href="../assets/webinsolito-core.css"><link rel="stylesheet" href="../assets/utility.css"><style>:root{--navy:#40536a;--green:#8fc8ff;--blue:#8fc8ff}.row>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap}</style></head><body><main class="tool"><header class="top"><div class="brand"><img src="logo.svg" alt="">UtilityMeter</div><a href="../casa/">← Casa</a></header><section class="hero"><div class="ey">CASA</div><h1>UtilityMeter</h1><p>Registra letture di luce, gas o acqua e calcola i consumi tra due date.</p></section>
<div class="grid"><section class="card"><h2>Nuova lettura</h2><div class="form"><div class="field"><label>Contatore</label><select class="f" id="type"><option value="luce">Luce</option><option value="gas">Gas</option><option value="acqua">Acqua</option></select></div><div class="field"><label>Data</label><input class="f" id="date" type="date"></div><div class="field"><label>Lettura</label><input class="f" id="reading" type="number" step=".01"></div><div class="field"><label>Prezzo per unità € (facoltativo)</label><input class="f" id="price" type="number" min="0" step=".0001"></div></div><div class="actions"><button class="btn green" onclick="add()">Salva lettura</button></div></section><aside class="card"><h2>Confronto</h2><select class="f" id="filter"><option value="">Tutti</option><option value="luce">Luce</option><option value="gas">Gas</option><option value="acqua">Acqua</option></select><div class="result" style="margin-top:8px"><div class="metric"><span>Ultima lettura</span><b id="last">—</b></div><div class="metric"><span>Consumo</span><b id="delta">—</b></div><div class="metric"><span>Media/giorno</span><b id="daily">—</b></div><div class="metric"><span>Costo stimato</span><b id="cost">—</b></div></div></aside></div><section class="card" style="margin-top:12px"><h2>Storico</h2><div id="list" class="list"></div></section><div class="footer"><a href="../casa/">Casa</a> · dati salvati solo nel browser</div></main><script src="../assets/webinsolito-core.js"></script><script src="../assets/utility.js"></script><script>
const K='utilitymeter.v1',$=id=>document.getElementById(id);let S=Webinsolito.store.get(K,{items:[]});
function add(){const type=$('type').value,date=$('date').value,reading=+$('reading').value,price=+$('price').value||0;if(!date||!Number.isFinite(reading))return Webinsolito.toast('Inserisci data e lettura');S.items.push({id:Date.now(),type,date,reading,price});Webinsolito.store.set(K,S);$('reading').value='';render()}
function del(id){S.items=S.items.filter(x=>x.id!==id);Webinsolito.store.set(K,S);render()}
function render(){const type=$('filter').value,arr=S.items.filter(x=>!type||x.type===type).sort((a,b)=>b.date.localeCompare(a.date));let delta=0,days=0,cost=0;if(arr.length>=2){delta=Math.max(0,arr[0].reading-arr[1].reading);days=Math.max(1,Webinsolito.days(arr[1].date,arr[0].date));cost=delta*(arr[0].price||0)}$('last').textContent=arr[0]?arr[0].reading.toLocaleString('it-IT'):'—';$('delta').textContent=arr.length>=2?delta.toLocaleString('it-IT'):'—';$('daily').textContent=arr.length>=2?(delta/days).toFixed(2):'—';$('cost').textContent=arr.length>=2&&arr[0].price?Webinsolito.euro(cost):'—';$('list').innerHTML=arr.length?arr.map(x=>'<div class="row"><div><b>'+x.type.toUpperCase()+' · '+x.reading.toLocaleString('it-IT')+'</b><span>'+Webinsolito.date(x.date)+(x.price?' · '+Webinsolito.euro(x.price)+'/unità':'')+'</span></div><button class="btn soft" onclick="del('+x.id+')">Togli</button></div>').join(''):'<div class="note">Nessuna lettura salvata per questo contatore.</div>'}
$('filter').onchange=render;$('date').value=new Date().toISOString().slice(0,10);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script></body></html>
