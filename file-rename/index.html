<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111b"><meta name="description" content="Rinomina copie di più file con prefisso, suffisso e numerazione, senza caricare i file online."><link rel="canonical" href="https://webinsolito.github.io/webinsolito/file-rename/"><link rel="manifest" href="manifest.json"><link rel="icon" href="../assets/webinsolito-logo.svg"><title>FileRename — Webinsolito</title><link rel="stylesheet" href="../assets/microapp.css"></head><body><main class="tool"><header class="top"><div class="brand">WEBINSOLITO</div><a href="../documenti/">← Categoria</a></header><section class="hero"><h1>FileRename</h1><p>Rinomina copie di più file con prefisso, suffisso e numerazione, senza caricare i file online.</p></section>
<section class="card"><div class="field"><label>Seleziona file</label><input class="f" id="files" type="file" multiple></div><div class="grid"><div class="field"><label>Prefisso</label><input class="f" id="prefix"></div><div class="field"><label>Suffisso</label><input class="f" id="suffix"></div><div class="field"><label>Trova nel nome</label><input class="f" id="find"></div><div class="field"><label>Sostituisci con</label><input class="f" id="replace"></div></div><div class="actions"><button class="btn primary" id="make">Prepara nomi</button><button class="btn" id="all">Scarica tutte le copie</button></div><div id="list"></div></section><footer class="footer"><a href="../">Home</a> · elaborazione locale nel browser</footer></main><script src="../assets/webinsolito-core.js"></script><script>
let links=[];function build(){links.forEach(x=>URL.revokeObjectURL(x.url));links=[];const fs=[...files.files];list.innerHTML='';fs.forEach((f,i)=>{const p=f.name.lastIndexOf('.'),base=p>0?f.name.slice(0,p):f.name,ext=p>0?f.name.slice(p):'',b=find.value?base.split(find.value).join(replace.value):base,name=prefix.value+b+suffix.value+'-'+String(i+1).padStart(2,'0')+ext,url=URL.createObjectURL(f);links.push({name,url});list.insertAdjacentHTML('beforeend','<div class="row"><div><b>'+name.replace(/[&<>"]/g,'')+'</b><span>'+f.name.replace(/[&<>"]/g,'')+'</span></div><a class="btn" download="'+name.replace(/"/g,'')+'" href="'+url+'">Scarica</a></div>')})}make.onclick=build;all.onclick=()=>{if(!links.length)build();links.forEach((x,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=x.url;a.download=x.name;a.click()},i*150))}
</script></body></html>
